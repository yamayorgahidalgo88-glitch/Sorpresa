<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3b30">
<title>Feliz Navidad cariño 💚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf3e6;--green:#1d3b30;--red:#b3262d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--green);color:var(--cream);font-family:"Fredoka",system-ui,sans-serif}
body{touch-action:none;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%}
header{position:fixed;top:0;left:0;right:0;z-index:2;text-align:center;pointer-events:none;
  padding:max(18px,env(safe-area-inset-top)) 16px 0;text-shadow:0 2px 10px rgba(0,0,0,.35)}
header .script{font-family:"Great Vibes",cursive;font-size:clamp(30px,8vw,46px);line-height:1;display:block}
header h1{margin:0;font-weight:700;font-size:clamp(26px,7.5vw,42px);letter-spacing:2px;line-height:1.1}
#hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;
  font-size:14px;letter-spacing:.5px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px;
  transition:opacity .8s;pointer-events:none;white-space:nowrap}
#hint.hide{opacity:0}
#day{position:fixed;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 60px));transform:translate(-50%,20px);z-index:3;
  background:var(--cream);color:var(--green);font-weight:700;font-size:20px;padding:12px 22px;border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
#day.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(8,20,15,.55);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.open{opacity:1;pointer-events:auto}
.card{position:relative;width:min(100%,360px);background:var(--cream);color:var(--green);border-radius:22px;padding:26px 18px 20px;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.45);border:3px solid #fff;outline:3px dashed rgba(179,38,45,.55);outline-offset:-10px;
  transform:translateY(16px) scale(.96);transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.modal.open .card{transform:none}
.card .lock{font-size:34px;line-height:1}
.card h2{margin:6px 0 2px;font-size:24px}
.card p{margin:0 0 16px;font-size:15px;opacity:.8}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count div{background:var(--green);color:var(--cream);border-radius:12px;padding:10px 0 8px}
.count b{display:block;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.count span{display:block;font-size:11px;margin-top:4px;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
.card .close{margin-top:18px;border:0;background:var(--red);color:#fff;font:700 15px Fredoka,sans-serif;padding:10px 26px;border-radius:999px;cursor:pointer}
.card .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:24px;color:var(--green);cursor:pointer;line-height:1;padding:6px}
#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--green);font-size:18px;transition:opacity .8s}
#loading.out{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<header><span class="script">Calendario de</span><h1>ADVIENTO</h1></header>
<div id="hint">Desliza para girar el árbol</div>
<div id="day"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <button class="x" id="mX" aria-label="Cerrar">×</button>
    <div class="lock" id="mIcon">🔒</div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="count" id="mCount">
      <div><b id="cD">0</b><span>días</span></div><div><b id="cH">00</b><span>horas</span></div>
      <div><b id="cM">00</b><span>min</span></div><div><b id="cS">00</b><span>seg</span></div>
    </div>
    <button class="close" id="mClose">Cerrar</button>
  </div>
</div>
<div id="loading">Preparando las casitas…</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

await Promise.race([document.fonts.load('700 100px Fredoka'),new Promise(r=>setTimeout(r,2500))]);
const CABIN=(await new GLTFLoader().loadAsync('modelos/casita.glb')).scene;

/* ---------- random with a seed (same tree every time) ---------- */
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(2412);

/* ---------- renderer / scene ---------- */
const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);

/* background: cosy dark green wall with warm bokeh lights */
function bgTexture(){
  const c=document.createElement('canvas');c.width=1024;c.height=1024;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,1024);gr.addColorStop(0,'#16302a');gr.addColorStop(.6,'#244a3b');gr.addColorStop(1,'#132a22');
  g.fillStyle=gr;g.fillRect(0,0,1024,1024);
  for(let i=0;i<70;i++){
    const x=rnd()*1024,y=rnd()*700,r=6+rnd()*26,col=rnd()<.7?'255,205,120':'255,120,100';
    const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${col},${.35+rnd()*.35})`);rg.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=rg;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
scene.background=bgTexture();

scene.add(new THREE.HemisphereLight(0xfff1dc,0x3b5a4c,1.35));
const sun=new THREE.DirectionalLight(0xffe7c4,2.2);sun.position.set(2.5,12,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-6,right:6,top:8,bottom:-3,near:1,far:30});sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
scene.add(sun);
const warm=new THREE.PointLight(0xffb060,18,14,2);warm.position.set(-4,3,4);scene.add(warm);

/* ---------- canvas textures (laser-cut MDF look) ---------- */
const MDF='#c39a6b';
function woodCanvas(w,h,base=MDF){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,w,h);
  const img=g.getImageData(0,0,w,h),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*22;d[i]+=n;d[i+1]+=n*.9;d[i+2]+=n*.7}
  g.putImageData(img,0,0);
  g.globalAlpha=.08;for(let i=0;i<40;i++){g.fillStyle=rnd()<.5?'#7a5232':'#e8c79a';g.fillRect(0,rnd()*h,w,1+rnd()*2)}g.globalAlpha=1;
  return [c,g];
}
function tex(c,srgb=true){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}

const W=1,D=.95,WALL=.82,APEX=1.32;           // house size (units)
// front/back gable: wood + burnt laser edge + round window with a cross
function gableTexture(){
  const S=512,[c,g]=woodCanvas(S,S);
  const X=x=>(x+.5)*S, Y=y=>S-(y/APEX)*S;
  g.strokeStyle='#5a3a1e';g.lineWidth=10;g.lineJoin='round';
  g.beginPath();g.moveTo(X(-.5),Y(0));g.lineTo(X(-.5),Y(WALL));g.lineTo(X(0),Y(APEX));g.lineTo(X(.5),Y(WALL));g.lineTo(X(.5),Y(0));g.closePath();g.stroke();
  // round window "⊕"
  const cx=X(0),cy=Y(1.03),r=.105*S;
  g.fillStyle='#3b2412';g.beginPath();g.arc(cx,cy,r,0,7);g.fill();
  g.strokeStyle='#fbf6ee';g.lineWidth=.035*S;g.beginPath();g.arc(cx,cy,r*.82,0,7);g.stroke();
  g.lineWidth=.03*S;g.beginPath();g.moveTo(cx-r*.82,cy);g.lineTo(cx+r*.82,cy);g.moveTo(cx,cy-r*.82);g.lineTo(cx,cy+r*.82);g.stroke();
  return tex(c);
}
// side wall: wood with a square window and box-joint (finger joint) edges
function sideTexture(){
  const [c,g]=woodCanvas(512,420);
  g.fillStyle='#8a6038';
  for(let y=0;y<420;y+=42){if((y/42)%2===0){g.fillRect(0,y,14,42);g.fillRect(498,y,14,42)}}
  g.strokeStyle='#5a3a1e';g.lineWidth=8;g.strokeRect(4,4,504,412);
  // window
  const x=176,y=110,s=160;
  g.fillStyle='#3b2412';g.fillRect(x-10,y-10,s+20,s+20);
  g.fillStyle='#fbf6ee';g.fillRect(x,y,s,s);
  g.fillStyle='#3b2412';g.fillRect(x+18,y+18,s-36,s-36);
  g.fillStyle='#fbf6ee';g.fillRect(x+s/2-8,y,16,s);g.fillRect(x,y+s/2-8,s,16);
  return tex(c);
}
// white roof with scalloped shingles
function roofTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=512;const g=c.getContext('2d');
  g.fillStyle='#f7f3ec';g.fillRect(0,0,512,512);
  g.strokeStyle='#d9d0c2';g.lineWidth=5;
  const R=32;
  for(let row=0;row<9;row++){
    const y=row*58+40,off=row%2?R:0;
    for(let x=-R+off;x<512+R;x+=2*R){g.beginPath();g.arc(x,y,R,0,Math.PI);g.stroke()}
  }
  return tex(c);
}
// the number: white, rounded, like the painted/engraved numbers, with a little smile line
function numberTexture(n){
  const c=document.createElement('canvas');c.width=512;c.height=512;const g=c.getContext('2d');
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  g.font=`700 ${n>9?300:340}px Fredoka`;
  g.lineWidth=34;g.strokeStyle='rgba(50,22,8,.9)';g.strokeText(n,256,270);
  g.fillStyle='#fffaf0';g.fillText(n,256,264);
  return tex(c);
}

const woodTex=tex(woodCanvas(512,512)[0]);woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping;
const gableTex=gableTexture();gableTex.repeat.set(1,1/APEX);gableTex.offset.set(.5,0);
const sideTex=sideTexture();
const roofTex=roofTexture();roofTex.wrapS=roofTex.wrapT=THREE.RepeatWrapping;roofTex.repeat.set(1.3,1.6);

const matWood=new THREE.MeshStandardMaterial({map:woodTex,roughness:.85});
const matGable=new THREE.MeshStandardMaterial({map:gableTex,roughness:.85});
const matSide=new THREE.MeshStandardMaterial({map:sideTex,roughness:.85});
const matRoof=new THREE.MeshStandardMaterial({map:roofTex,roughness:.75,color:0xffffff});
const matRoofEdge=new THREE.MeshStandardMaterial({color:0xece5d9,roughness:.8});
const matWhite=new THREE.MeshStandardMaterial({color:0xf4efe6,roughness:.6});

/* ---------- one house: the snowy cabin model + its number ---------- */
const HS=.86;                                     // cabin scale
CABIN.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.material.side=THREE.FrontSide}});
const cbox=new THREE.Box3().setFromObject(CABIN);
// where the front wall is, right where the number goes
const probe=new THREE.Raycaster(new THREE.Vector3(0,-.2,5),new THREE.Vector3(0,0,-1));
const frontZ=(probe.intersectObject(CABIN,true)[0]?.point.z)??cbox.max.z;
const numGeo=new THREE.PlaneGeometry(.74,.74);
function makeHouse(n){
  const h=new THREE.Group();h.userData.day=n;
  const c=CABIN.clone(true);c.position.y=-cbox.min.y;h.add(c);
  const num=new THREE.Mesh(numGeo,new THREE.MeshStandardMaterial({map:numberTexture(n),transparent:true,roughness:.6,polygonOffset:true,polygonOffsetFactor:-4}));
  num.position.set(0,-.21-cbox.min.y,frontZ+.012);h.add(num);
  h.scale.setScalar(HS);
  return h;
}

/* ---------- the tiered stand ---------- */
const tree=new THREE.Group();scene.add(tree);
const TIERS=[{r:2.95,n:8},{r:2.35,n:7},{r:1.8,n:5},{r:1.32,n:3},{r:0,n:1}];
const STEP=1.48;
// days 1..23 shuffled around the tree, 24 on top
const days=Array.from({length:23},(_,i)=>i+1);
for(let i=days.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[days[i],days[j]]=[days[j],days[i]]}
let k=0;const houses=[];
TIERS.forEach((t,ti)=>{
  const y=ti*STEP;
  if(t.r>0){
    const plate=new THREE.Mesh(new THREE.CylinderGeometry(t.r+.95,t.r+.95,.07,72),matWhite);
    plate.position.y=y-.035;plate.receiveShadow=plate.castShadow=true;tree.add(plate);
  }
  const off=t.r>0?rnd()*Math.PI*2:0;
  for(let i=0;i<t.n;i++){
    const n=ti===TIERS.length-1?24:days[k++];
    const h=makeHouse(n);
    const a=off+i/t.n*Math.PI*2;
    h.position.set(Math.sin(a)*t.r,y,Math.cos(a)*t.r);h.rotation.y=a;
    if(n===24)h.scale.setScalar(HS*1.15);
    tree.add(h);houses.push(h);
  }
});
// central pole + base
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,STEP*4,20),matWood);pole.position.y=STEP*2-.05;pole.castShadow=true;tree.add(pole);
const table=new THREE.Mesh(new THREE.CircleGeometry(30,64),new THREE.MeshStandardMaterial({color:0x2a5a44,roughness:.95}));
table.rotation.x=-Math.PI/2;table.position.y=-.075;table.receiveShadow=true;scene.add(table);

// little lights around the tiers (warm fairy lights)
const bulbGeo=new THREE.SphereGeometry(.035,8,8);
const bulbs=[];
TIERS.slice(0,4).forEach((t,ti)=>{for(let i=0;i<36;i++){const a=i/36*Math.PI*2,R=t.r+.93;
  const b=new THREE.Mesh(bulbGeo,new THREE.MeshBasicMaterial({color:0xffd27a}));b.position.set(Math.sin(a)*R,ti*STEP+.02,Math.cos(a)*R);tree.add(b);bulbs.push(b)}});

/* ---------- camera / controls ---------- */
const target=new THREE.Vector3(0,3.35,0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.copy(target);controls.enableDamping=true;controls.dampingFactor=.08;
controls.enablePan=false;controls.minPolarAngle=Math.PI*.30;controls.maxPolarAngle=Math.PI*.52;
controls.rotateSpeed=.7;controls.autoRotate=true;controls.autoRotateSpeed=.8;
function fit(){
  camera.aspect=innerWidth/innerHeight;
  // keep the whole tree (about 8.5 units tall, 6.8 wide) in view on any screen
  const vFov=THREE.MathUtils.degToRad(camera.fov),hFov=2*Math.atan(Math.tan(vFov/2)*camera.aspect);
  const dist=Math.max(4.6/Math.tan(vFov/2),3.95/Math.tan(hFov/2));
  controls.minDistance=dist*.55;controls.maxDistance=dist*1.25;
  if(!fit.done){camera.position.set(0,target.y+dist*.32,dist);fit.done=true}
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
}
fit();addEventListener('resize',fit);
// header space: aim slightly lower on tall screens
const hint=document.getElementById('hint');
controls.addEventListener('start',()=>{controls.autoRotate=false;hint.classList.add('hide')});

/* ---------- tap a house ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
const dayEl=document.getElementById('day');let dayT,hop=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(houses,true)[0];if(!hit)return;
  let o=hit.object;while(!o.userData.day)o=o.parent;
  hop={h:o,t:0,y:o.position.y};
  openDay(o.userData.day);
});

/* ---------- locks: house N opens on N December at 00:00:01 ---------- */
// ?ahora=2026-12-05T10:00 simulates another date (for testing)
const fake=new URLSearchParams(location.search).get('ahora');
const skew=fake&&!isNaN(new Date(fake))?new Date(fake)-Date.now():0;
const now=()=>new Date(Date.now()+skew);
function unlockTime(n){
  const d=now();const y=d.getMonth()===0?d.getFullYear()-1:d.getFullYear();   // in January it still counts last December
  return new Date(y,11,n,0,0,1);
}
const modal=document.getElementById('modal'),$=id=>document.getElementById(id);
let openN=null,tick=null;
function render(){
  const n=openN,left=unlockTime(n)-now();
  if(left<=0){
    $('mIcon').textContent='🎁';$('mTitle').textContent=n===24?'¡Casita 24 abierta!':`¡Casita ${n} abierta!`;
    $('mText').textContent='Ya puedes abrirla';$('mCount').hidden=true;clearInterval(tick);return;
  }
  const s=Math.ceil(left/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;
  $('mIcon').textContent='🔒';$('mTitle').textContent=n===24?'Casita 24 · Nochebuena':`Casita ${n}`;
  $('mText').textContent=`Se abre el ${n} de diciembre. Faltan:`;$('mCount').hidden=false;
  $('cD').textContent=d;$('cH').textContent=String(h).padStart(2,'0');$('cM').textContent=String(m).padStart(2,'0');$('cS').textContent=String(ss).padStart(2,'0');
}
function openDay(n){openN=n;render();clearInterval(tick);tick=setInterval(render,250);modal.classList.add('open')}
function closeDay(){modal.classList.remove('open');clearInterval(tick)}
$('mClose').onclick=$('mX').onclick=closeDay;
modal.addEventListener('click',e=>{if(e.target===modal)closeDay()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDay()});

/* ---------- loop ---------- */
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime(),dt=clock.getDelta();
  controls.update();
  bulbs.forEach((b,i)=>b.material.color.setHSL(.11,1,.55+.25*Math.sin(t*2+i*1.7)));
  if(hop){hop.t+=1/60;const p=Math.min(hop.t/.5,1);hop.h.position.y=hop.y+Math.sin(p*Math.PI)*.35;if(p>=1){hop.h.position.y=hop.y;hop=null}}
  renderer.render(scene,camera);
});
document.getElementById('loading').classList.add('out');
</script>
</body>
</html>
