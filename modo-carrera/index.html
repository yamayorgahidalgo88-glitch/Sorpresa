<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modo Carrera Míster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: consola de retransmisión — barra lateral de navegación (abajo en móvil), panel principal con tarjetas tipo grafismo de TV */
:root{
  --bg:#0d1117;
  --panel:#161c26;
  --panel2:#1d2531;
  --line:#2a3443;
  --fg:#e9edf3;
  --muted:#8b97a8;
  --accent:#f2b134;      /* oro marcador */
  --accent-ink:#1a1204;
  --pitch:#1f6b45;
  --pitch2:#1a5c3b;
  --good:#3fbf74;
  --warn:#e8a33a;
  --bad:#e5534b;
  --info:#5aa6e8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font:600 12px/1 var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.nav button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{font-size:20px;margin-bottom:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font:600 12px/1.5 var(--display);letter-spacing:.05em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.ovr{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:6px;font:700 16px/1 var(--display);background:var(--panel2)}
.ovr.o80{background:#c9a227;color:#1a1204}.ovr.o75{background:#9aa6b4;color:#111}.ovr.o70{background:#8a5a2b;color:#fff}
.pos{font:700 12px/1 var(--display);letter-spacing:.06em;padding:4px 6px;border-radius:5px;display:inline-block;min-width:36px;text-align:center}
.pos.POR{background:#7a5a10;color:#ffe9a8}.pos.DEF{background:#173f6b;color:#bfe0ff}.pos.MED{background:#1d5a37;color:#c6f2d6}.pos.DEL{background:#6b1f22;color:#ffd0cf}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th.sort{cursor:pointer}
td{padding:7px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:700 11px/1 var(--display);flex:none;border:2px solid}
.crest{display:inline-grid;place-items:center;width:30px;height:34px;border-radius:6px 6px 14px 14px;font:800 10px/1 var(--display);flex:none;border:2px solid rgba(255,255,255,.25)}
.crest.big{width:58px;height:66px;font-size:20px;border-radius:10px 10px 26px 26px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}

/* App shell */
#app{display:flex;min-height:100%}
.nav{width:210px;flex:none;align-self:flex-start;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font:800 22px/1 var(--display);letter-spacing:.02em;padding:4px 10px 14px;text-transform:uppercase}
.brand span{color:var(--accent)}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font:600 16px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);position:relative}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:var(--fg);background:var(--panel2)}
.nav button.on{color:var(--fg);background:var(--panel2)}
.nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.nav .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:2px 6px}
main{flex:1;min-width:0;padding-inline:24px;padding-block:20px 40px;max-width:1200px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:32px;text-transform:uppercase}
.topbar .meta{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap}
.stat .v{font:700 20px/1.1 var(--display)}
@media (max-width:760px){
  #app{flex-direction:column}
  .nav{order:2;position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:2px}
  .brand{display:none}
  .nav button{flex-direction:column;gap:4px;font-size:11px;padding:8px 10px;flex:none}
  .nav button.on::before{left:10px;right:10px;top:0;bottom:auto;width:auto;height:3px}
  .nav .dot{position:absolute;top:2px;right:2px;margin:0}
  main{padding-inline:16px;padding-block:16px 96px}
  .topbar h1{font-size:26px}
  .topbar .meta{margin-left:0}
}

/* Next match hero */
.fixture-hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center;padding:10px 0}
.fixture-hero .team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.fixture-hero .name{font:700 20px/1.1 var(--display);text-transform:uppercase}
.vs{font:800 28px/1 var(--display);color:var(--muted)}

/* Pitch */
.pitch{position:relative;aspect-ratio:68/80;max-width:100%;width:100%;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch2) 10% 20%);border:2px solid rgba(255,255,255,.18)}
.pitch::before{content:"";position:absolute;left:22%;right:22%;bottom:0;height:14%;border:2px solid rgba(255,255,255,.25);border-bottom:0}
.pitch::after{content:"";position:absolute;left:0;right:0;top:0;height:0;border-top:2px solid rgba(255,255,255,.25)}
.pitch .circle{position:absolute;left:50%;top:0;width:26%;aspect-ratio:1;border:2px solid rgba(255,255,255,.25);border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:84px;text-align:center}
.slot .chip{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--display);background:var(--panel);border:2px solid var(--fg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .chip.oop{border-color:var(--warn)}
.slot .chip.bad{border-color:var(--bad)}
.slot.sel .chip{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}
.slot .nm{font:600 12px/1.1 var(--display);background:rgba(0,0,0,.55);padding:2px 5px;border-radius:4px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sp{font:700 10px/1 var(--display);color:rgba(255,255,255,.75)}
@media (max-width:460px){.slot{width:64px}.slot .chip{width:36px;height:36px;font-size:14px}.slot .nm{font-size:11px;max-width:64px}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,10,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px}
.modal h2{font-size:26px;margin-bottom:6px;text-transform:uppercase}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
.statgrid b{display:block;font:700 22px/1 var(--display)}

/* Match */
.match{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.match .inner{max-width:900px;margin:0 auto;display:grid;gap:14px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.scoreboard .t{display:flex;align-items:center;gap:10px;font:700 20px/1.1 var(--display);text-transform:uppercase;min-width:0}
.scoreboard .t.away{justify-content:flex-end;text-align:right}
.score{font:800 46px/1 var(--display);text-align:center;letter-spacing:.04em}
.clock{display:block;font:700 15px/1 var(--display);color:var(--accent);margin-top:4px}
.feed{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
.ev{display:flex;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel2);align-items:flex-start}
.ev .m{font:700 15px/1.3 var(--display);color:var(--muted);min-width:30px}
.ev.goal{background:color-mix(in srgb,var(--accent) 22%,var(--panel2));}
.ev.goal .m{color:var(--accent)}
.ev.card-y .m{color:#f5d64a}.ev.card-r .m{color:var(--bad)}
.mstats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.mstats .b{height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}
.mstats .b i{background:var(--accent)}
.mstats .b em{background:var(--info);margin-left:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.start{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:28px}
.start .box{width:min(980px,100%);display:grid;gap:18px}
.hero-title{font:800 clamp(44px,9vw,92px)/.9 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.hero-title em{font-style:italic;color:var(--accent)}
.clubpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.clubpick button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.clubpick button:hover,.clubpick button.on{border-color:var(--accent)}
.clubpick button:focus-visible{outline:2px solid var(--accent)}
.stars{color:var(--accent);letter-spacing:1px;font-size:12px}
.form span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:700 11px/1 var(--display);margin-right:2px;color:#0d1117}
.form .W{background:var(--good)}.form .D{background:#9aa6b4}.form .L{background:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;border-radius:99px;font:600 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.msg{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.msg.unread .t{font-weight:700}
.msg.unread::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.msg:not(.unread)::before{content:"";width:8px;flex:none}
@media (prefers-reduced-motion:no-preference){.ev.new{animation:in .35s ease}@keyframes in{from{opacity:.2;transform:translateY(-4px)}}}
</style>

function activeClubs(){return S.clubs.filter(c=>c.active);}
function makeFixtures(){
  const ids=shuffle(activeClubs().map(c=>c.id));const n=ids.length;const rounds=[];
  const arr=ids.slice();
  const streak={};ids.forEach(id=>streak[id]=0); // >0 partidos seguidos en casa, <0 fuera
  for(let r=0;r<n-1;r++){const rd=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];
      if(streak[h]>streak[a]||(streak[h]===streak[a]&&R()<0.5))[h,a]=[a,h];
      streak[h]=streak[h]>0?streak[h]+1:1;streak[a]=streak[a]<0?streak[a]-1:-1;
      rd.push({h,a,hg:null,ag:null,played:false,ev:[]});}
    rounds.push(rd);arr.splice(1,0,arr.pop());}
  const second=rounds.map(rd=>rd.map(f=>({h:f.a,a:f.h,hg:null,ag:null,played:false,ev:[]})));
  S.fixtures=rounds.concat(second);
}

function available(p){return p.injury===0&&p.susp===0;}
function bestXI(cid,formation,ignoreFit){
  const slots=FORMATIONS[formation];const pool=squad(cid).filter(p=>available(p));const used=new Set();const xi=new Array(11).fill(null);
  const order=slots.map((s,i)=>i).sort((a,b)=>(slots[a][0]==='POR'?-1:0)-(slots[b][0]==='POR'?-1:0));
  const score=(p,pos)=>p.ovr-posPen(p.pos,pos)-(ignoreFit?0:Math.max(0,70-p.fitness)*0.35);
  // primera pasada: solo jugadores en su posición natural; segunda: el mejor disponible
  for(const natural of [true,false])for(const i of order){if(xi[i])continue;const pos=slots[i][0];let best=null,bs=-1e9;
    for(const p of pool){if(used.has(p.id)||(natural&&p.pos!==pos))continue;const sc=score(p,pos);if(sc>bs){bs=sc;best=p;}}
    if(best){xi[i]=best.id;used.add(best.id);}}
  return xi;
}
function bench(cid,xi){const s=new Set(xi);return squad(cid).filter(p=>!s.has(p.id)&&available(p)).sort((a,b)=>b.ovr-a.ovr).slice(0,9).map(p=>p.id);}
function userLineup(){const c=me();if(!c.lineup||c.lineup.length!==11)c.lineup=bestXI(c.id,c.formation);return c.lineup;}
function lineupProblems(){const xi=userLineup();const out=[];xi.forEach((id,i)=>{const p=id&&P(id);if(!p||p.clubId!==S.user.clubId||p.youth)out.push(i);else if(!available(p))out.push(i);});return out;}
function fixLineup(){const c=me();const xi=userLineup();const probs=lineupProblems();if(!probs.length)return;
  const used=new Set(xi.filter((id,i)=>!probs.includes(i)));const pool=squad(c.id).filter(p=>available(p)&&!used.has(p.id));
  probs.forEach(i=>{const pos=FORMATIONS[c.formation][i][0];let best=null,bs=-1e9;pool.forEach(p=>{if(used.has(p.id))return;const sc=p.ovr-posPen(p.pos,pos)-Math.max(0,70-p.fitness)*.35;if(sc>bs){bs=sc;best=p;}});xi[i]=best?best.id:null;if(best)used.add(best.id);});}

function sideStrength(s){let sum=0;s.xi.forEach((id,i)=>{if(!id||s.red.has(id)){sum+=0;return;}const p=P(id);const f=s.fit[id]??p.fitness;
  sum+=(p.ovr-posPen(p.pos,s.slots[i]))*(0.84+0.16*f/100)+(p.morale-60)/20;});

function lambdas(m){const h=m.home,a=m.away;const sh=sideStrength(h)+1.6,sa=sideStrength(a);const d=sh-sa;
  let lh=1.14*Math.exp(0.058*d)*MENT_OWN[h.ment]*MENT_OPP[a.ment],la=1.04*Math.exp(-0.058*d)*MENT_OWN[a.ment]*MENT_OPP[h.ment];
  return [clamp(lh,0.15,5),clamp(la,0.15,5)];}
function onPitch(s){return s.xi.filter(id=>id&&!s.red.has(id));}
function slotOf(s,id){return s.slots[s.xi.indexOf(id)];}
function shooter(s){return wpick(onPitch(s),id=>{const g=GROUP[slotOf(s,id)];const pos=slotOf(s,id);const w={DC:6,ED:3.2,EI:3.2,MCO:3,MC:1.3,MCD:.6,LD:.5,LI:.5,DFC:.45,POR:.01}[pos]||1;return w*Math.pow(1.06,P(id).ovr-70);});}

function stepMinute(m){
  if(m.ended)return;m.min++;const min=m.min;const dm=m.half===1?Math.min(min,45):Math.min(min,90);
  const [lh,la]=lambdas(m);
  [[m.home,m.away,lh],[m.away,m.home,la]].forEach(([s,o,l])=>{
    // desgaste
    onPitch(s).forEach(id=>{s.fit[id]=Math.max(20,(s.fit[id]??100)-0.22-R()*0.12);});
    if(R()<l*9/90){s.shots++;const sh=shooter(s);if(!sh)return;
      if(R()<0.36){s.sot++;
        if(R()<0.31){s.goals++;const as=R()<0.72?assister(s,sh):null;s.contrib[sh].g++;if(as)s.contrib[as].a++;
          m.fx.ev.push({t:'g',side:s===m.home?'h':'a',pid:sh,as,min:dm});
          push(m,dm,'goal',fill(pick(COM.goal),{p:nm(sh)})+(as?fill(pick(COM.assist),{a:nm(as)}):''),s===m.home?'h':'a');}
        else{o.saves++;if(m.live&&R()<0.6)push(m,dm,'save',fill(pick(COM.save),{p:nm(sh),k:nm(keeper(o))}),s===m.home?'h':'a');}}
      else if(m.live&&R()<0.45)push(m,dm,'miss',fill(pick(COM.miss),{p:nm(sh)}),s===m.home?'h':'a');}
    if(R()<0.021){const pl=pick(onPitch(s));if(pl){s.yellows[pl]=(s.yellows[pl]||0)+1;
      if(s.yellows[pl]>=2){s.red.add(pl);m.fx.ev.push({t:'r',pid:pl,min:dm});push(m,dm,'card-r',fill(COM.red[1],{p:nm(pl)}),s===m.home?'h':'a');}
      else push(m,dm,'card-y',fill(pick(COM.yellow),{p:nm(pl)}),s===m.home?'h':'a');}}
    if(R()<0.0006){const pl=pick(onPitch(s).filter(id=>slotOf(s,id)!=='POR'));if(pl){s.red.add(pl);s.straight=(s.straight||[]).concat(pl);m.fx.ev.push({t:'r',pid:pl,min:dm});push(m,dm,'card-r',fill(COM.red[0],{p:nm(pl)}),s===m.home?'h':'a');}}
    if(R()<0.0016){const pl=pick(onPitch(s));if(pl){s.injured=(s.injured||[]).concat(pl);push(m,dm,'inj',fill(COM.inj[0],{p:nm(pl)}),s===m.home?'h':'a');autoSub(m,s,pl,true);}}
  });
  // posesión
  const mh=midStr(m.home),ma=midStr(m.away);m.home.pt=(m.home.pt||0)+mh/(mh+ma);m.away.pt=(m.away.pt||0)+ma/(mh+ma);
  // cambios IA
  [m.home,m.away].forEach(s=>{if(s.isUser&&m.live)return;if([58,68,78].includes(min)&&s.subs<5){const tired=onPitch(s).filter(id=>slotOf(s,id)!=='POR').sort((a,b)=>s.fit[a]-s.fit[b]);if(tired.length&&s.fit[tired[0]]<80)autoSub(m,s,tired[0],false);}});
  if(m.half===1&&min>=45+m.st1){m.half=2;m.min=45;push(m,45,'info','Descanso. '+scoreStr(m),'');if(m.live){m.halftimeShown=true;m.paused=true;}}
  else if(m.half===2&&min>=90+m.st2){m.ended=true;push(m,90,'info','¡Final del partido! '+scoreStr(m),'');}
}
function midStr(s){let sum=0,n=0;s.xi.forEach((id,i)=>{if(!id||s.red.has(id))return;if(GROUP[s.slots[i]]==='MED'){sum+=P(id).ovr;n++;}});return Math.max(1,(n?sum/n:60)-55+n*3);}
function scoreStr(m){return `${S.clubs[m.home.cid].short} ${m.home.goals}-${m.away.goals} ${S.clubs[m.away.cid].short}`;}
function autoSub(m,s,outId,forced){
  if(s.subs>=5||!s.bench.length){if(forced){s.red.add(outId);}return false;}
  const pos=slotOf(s,outId);const inId=s.bench.slice().sort((a,b)=>(P(b).ovr-posPen(P(b).pos,pos))-(P(a).ovr-posPen(P(a).pos,pos)))[0];
  doSub(m,s,outId,inId);return true;}
function doSub(m,s,outId,inId){const i=s.xi.indexOf(outId);if(i<0)return;const min=m.half===1?Math.min(45,m.min):Math.min(90,m.min);
  s.mins[outId]=(s.mins[outId]||0)+(min-s.on[outId]);delete s.on[outId];
  s.xi[i]=inId;s.bench=s.bench.filter(x=>x!==inId);s.on[inId]=min;s.fit[inId]=P(inId).fitness;s.contrib[inId]=s.contrib[inId]||{g:0,a:0};s.subs++;s.used=(s.used||[]).concat(outId);
  push(m,min,'sub',fill(COM.sub[0],{t:S.clubs[s.cid].short,i:nm(inId),o:nm(outId)}),s===m.home?'h':'a');}
function simToEnd(m){let g=0;while(!m.ended&&g++<200){m.paused=false;stepMinute(m);}}

function finalizeMatch(m){
  const fx=m.fx;fx.hg=m.home.goals;fx.ag=m.away.goals;fx.played=true;
  const ratings={};
  [[m.home,m.away,'h'],[m.away,m.home,'a']].forEach(([s,o,k])=>{
    onPitch(s).forEach(id=>{s.mins[id]=(s.mins[id]||0)+(90-s.on[id]);});
    s.red.forEach(id=>{if(s.on[id]!=null){const ev=fx.ev.find(e=>e.t==='r'&&e.pid===id);s.mins[id]=(s.mins[id]||0)+((ev?ev.min:90)-s.on[id]);}});
    const res=s.goals>o.goals?1:s.goals<o.goals?-1:0;
    Object.keys(s.mins).forEach(k2=>{const id=+k2;const p=P(id);if(!p)return;const mins=s.mins[id];if(mins<=0)return;
      const c=s.contrib[id]||{g:0,a:0};const pos=s.slots[s.xi.indexOf(id)]||p.pos;const g=GROUP[p.pos];
      let r=6.1+gauss()*0.35+c.g*1.0+c.a*0.6+res*0.35+(p.ovr-72)*0.02;
      if(g==='DEF'||g==='POR'){r+=o.goals===0?0.6:-0.18*o.goals;}
      if(g==='POR')r+=s===m.home?m.home.saves*0.12:m.away.saves*0.12;
      if(s.yellows[id])r-=0.2;if(s.red.has(id)&&!(s.injured||[]).includes(id))r-=1.5;
      if(mins<25)r=6.2+(r-6.2)*0.5;r=clamp(Math.round(r*10)/10,3,10);ratings[id]=r;
      p.stats.apps++;p.stats.goals+=c.g;p.stats.assists+=c.a;p.stats.rsum+=r;
      if((g==='DEF'||g==='POR')&&o.goals===0&&mins>=60)p.stats.cs++;
      p.fitness=clamp(Math.round(s.fit[id]??p.fitness),15,100);
      p.morale=clamp(p.morale+(r>=7.5?4:r<6?-3:1),15,100);
      p.played=true;
    });
    Object.entries(s.yellows).forEach(([id,n])=>{const p=P(+id);if(!p)return;p.stats.yel++;p.yellows++;if(n<2&&p.yellows%5===0)p.susp=Math.max(p.susp,1);});
    s.red.forEach(id=>{const p=P(id);if(!p||(s.injured||[]).includes(id))return;p.stats.red++;p.susp=Math.max(p.susp,(s.straight||[]).includes(id)?2:1);});
    (s.injured||[]).forEach(id=>{const p=P(id);if(p){p.injury=ri(1,6);}});
    // moral del equipo
    squad(s.cid).forEach(p=>{p.morale=clamp(p.morale+res*2,15,100);});
  });
  fx.ratings=ratings;
  return ratings;
}
function quickSim(fx){const m=createMatch(fx,false);simToEnd(m);finalizeMatch(m);return m;}

function playRoundOthers(){const rd=S.fixtures[S.round];rd.forEach(f=>{if(!f.played)quickSim(f);});}
function advanceWeek(userMatch){
  const fx=nextFixture();
  const myGoals=fx?(fx.h===S.user.clubId?[fx.hg,fx.ag]:[fx.ag,fx.hg]):null;
  playRoundOthers();
  // forma, lesiones, sanciones
  const tr=TRAIN[S.training];const myLvl=clubLevel(S.user.clubId);const myXI=me().lineup||[];
  Object.values(S.players).forEach(p=>{
    const club=p.clubId!=null?S.clubs[p.clubId]:null;
    const isMine=p.clubId===S.user.clubId;
    if(p.played){p.played=false;}else if(club&&club.active&&!p.youth&&p.susp>0)p.susp--;
    if(p.injury>0)p.injury--;
    p.fitness=clamp(p.fitness+(isMine?tr.fit:24),15,100);
    // desarrollo
    develop(p,isMine?tr.grow:1);
    // moral de suplentes
    if(isMine&&!p.youth){if(!myXI.includes(p.id)&&p.ovr>=myLvl-1)p.morale=clamp(p.morale-2,15,100);}
  });
  // las sanciones: los jugadores sancionados que no jugaron cumplen partido
  // confianza de la directiva
  if(myGoals){const d=myGoals[0]-myGoals[1];const pos=myPosition();
    let delta=d>0?2:d<0?-1.5:0.3;if(pos<=S.board.target)delta+=0.5;else if(pos>S.board.target+3)delta-=0.5;
    S.board.conf=clamp(S.board.conf+delta,0,100);}
  // mercado
  if(windowOpen()){aiOffers();aiTransfers();}
  expireOffers();
  scoutTick();
  if(S.round===17||S.round===30){const exp=squad(S.user.clubId).filter(p=>p.contract<=1);if(exp.length)addNews('Contratos a punto de expirar',`Estos jugadores terminan contrato a final de temporada y se irán gratis si no los renuevas:<br>${exp.map(p=>`${esc(p.name)} (${p.pos}, ${p.ovr})`).join('<br>')}`,'info');}
  // contratos expirando: aviso
  S.round++;
  if(S.round>=S.fixtures.length){S.seasonDone=true;}
  if(S.board.conf<=4&&S.round>=15&&!S.seasonDone){fired('La directiva ha perdido la confianza en tu proyecto tras una racha de malos resultados.');}
  save();
}
function develop(p,mult){
  const a=p.age;const af=a<=18?1.1:a<=20?1:a<=22?0.8:a<=24?0.6:a<=26?0.4:a<=28?0.22:a<=30?0.1:0;
  if(p.ovr<p.pot&&af>0){p.prog+=(p.pot-p.ovr)*af*0.85*mult*(0.6+R()*0.8)*(p.youth?0.9:1);
    while(p.prog>=100&&p.ovr<p.pot){p.prog-=100;p.ovr++;}}
  if(a>=32&&R()<0.03*(a-31))p.ovr=Math.max(45,p.ovr-1);
}

function isStarter(p){if(p.clubId==null)return false;const c=S.clubs[p.clubId];const xi=bestXI(c.id,c.formation,true);return xi.includes(p.id);}
function askingPrice(p){if(p.clubId==null)return 0;const key=S.season+'-'+(S.round<18?'v':'i')+'-'+p.id;
  if(!S.neg[key]){S.neg[key]={ask:roundMoney(valueOf(p)*(1.08+(isStarter(p)?0.25:0)+R()*0.15)*(p.contract<=1?0.85:1)),tries:0,agreed:0};}
  return S.neg[key];}
function wageDemand(p){const buyer=me();const curRep=p.clubId!=null?S.clubs[p.clubId].rep:buyer.rep;
  return Math.max(Math.round(p.wage*1.05/500)*500,Math.round(wageFor(p,buyer.rep)*(1.1+Math.max(0,curRep-buyer.rep)*0.12)/500)*500);}
function willingness(p){const lvl=clubLevel(S.user.clubId);const c=me();const cur=p.clubId!=null?S.clubs[p.clubId]:null;
  if(cur&&cur.rep>c.rep+1.5&&p.ovr>lvl+3)return 'No quiere bajar de categoría de club.';
  if(p.ovr>lvl+9&&c.rep<4)return 'Considera que tu proyecto no está a su nivel.';

function wageBill(cid){return squad(cid,true).reduce((s,p)=>s+p.wage,0);}
function signPlayer(p,fee,wage,years){
  const c=me();const from=p.clubId!=null?S.clubs[p.clubId]:null;
  c.budget-=fee;if(from)from.budget+=fee;
  p.clubId=c.id;p.youth=false;p.wage=wage;p.contract=years;p.listed=false;p.morale=80;p.num=0;p.joined=S.season;p.yellows=0;
  assignNumbers(c.id);if(from)assignNumbers(from.id);

function sellPlayer(p,toCid,fee){const c=me();const to=S.clubs[toCid];c.budget+=fee;to.budget-=fee;p.clubId=toCid;p.listed=false;p.wage=wageFor(p,to.rep);p.contract=ri(2,5);p.num=0;
  if(c.lineup)c.lineup=c.lineup.map(id=>id===p.id?null:id);
  assignNumbers(toCid);addNews('Venta cerrada: '+p.name,`${p.name} deja ${c.name} rumbo a ${to.name} por <b>${money(fee)}</b>.`,'info');}
function buyerClubFor(p){const cands=S.clubs.filter(c=>c.id!==S.user.clubId&&c.budget>valueOf(p)*0.8);if(!cands.length)return null;
  return wpick(cands,c=>{const l=c.lvl0;return Math.max(0.1,6-Math.abs(l-p.ovr+2)/2);});}
function aiOffers(){
  squad(S.user.clubId).forEach(p=>{
    const already=S.news.some(n=>n.type==='offer'&&!n.done&&n.data.pid===p.id);if(already)return;
    let chance=p.listed?0.35:(p.ovr>=clubLevel(S.user.clubId)+2?0.05:0.012);
    if(R()<chance){const b=buyerClubFor(p);if(!b)return;const fee=roundMoney(valueOf(p)*(p.listed?0.75+R()*0.3:1.05+R()*0.35));
      addNews(`Oferta de ${b.name} por ${p.name}`,`${b.name} ofrece <b>${money(fee)}</b> por ${p.name} (${p.pos}, ${p.ovr}). Valor de mercado: ${money(valueOf(p))}. La oferta caduca en 2 jornadas.`,'offer',{pid:p.id,cid:b.id,fee,exp:S.round+2});}
  });
}
function expireOffers(){S.news.forEach(n=>{if(n.type==='offer'&&!n.done&&n.data.exp<S.round+1&&n.season===S.season){n.done='Caducada';}});}
function aiTransfers(){
  for(let k=0;k<3;k++){const buyer=pick(S.clubs.filter(c=>c.id!==S.user.clubId));
    const cands=Object.values(S.players).filter(p=>p.clubId!==S.user.clubId&&p.clubId!==buyer.id&&!p.youth&&p.ovr>=buyer.lvl0-1&&p.ovr<=buyer.lvl0+4&&valueOf(p)*1.15<buyer.budget&&(p.clubId==null||S.clubs[p.clubId].rep<=buyer.rep));
    if(!cands.length)continue;const p=pick(cands);const from=p.clubId!=null?S.clubs[p.clubId]:null;const fee=from?roundMoney(valueOf(p)*1.15):0;
    buyer.budget-=fee;if(from)from.budget+=fee;p.clubId=buyer.id;p.wage=wageFor(p,buyer.rep);p.contract=ri(2,5);p.num=0;assignNumbers(buyer.id);
    if(buyer.active&&(!from||from.active)&&p.ovr>=72)addNews(`${p.name} ficha por ${buyer.name}`,`${buyer.name} incorpora a ${p.name} (${p.ovr})${from?' desde '+from.name+' por '+money(fee):' como agente libre'}.`,'rumor');
    maintainSquad(buyer.id);if(from)maintainSquad(from.id);}
}
function maintainSquad(cid){if(cid===S.user.clubId)return;const c=S.clubs[cid];const sq=squad(cid);
  const need={POR:2,DEF:7,MED:7,DEL:5};const cnt={POR:0,DEF:0,MED:0,DEL:0};sq.forEach(p=>cnt[GROUP[p.pos]]++);
  Object.keys(need).forEach(g=>{while(cnt[g]<need[g]){const pos=pick(POS.filter(x=>GROUP[x]===g));makePlayer({pos,ovr:c.lvl0-3+ri(-3,2),age:ri(19,30),clubId:cid});cnt[g]++;}});
  const sq2=squad(cid).sort((a,b)=>a.ovr-b.ovr);while(sq2.length>28){const p=sq2.shift();p.clubId=null;p.contract=0;}

function endSeason(){
  const tb=table();const pos=myPosition();const c=me();
  const champion=S.clubs[tb[0].id];
  const top=Object.values(S.players).filter(p=>p.clubId!=null&&S.clubs[p.clubId].active).sort((a,b)=>b.stats.goals-a.stats.goals)[0];
  const met=pos<=S.board.target;
  S.board.conf=clamp(S.board.conf+(met?15+(S.board.target-pos)*3:-(pos-S.board.target)*6),0,100);
  if(pos===1)S.user.trophies++;
  S.user.history.push({season:seasonLabel(),club:c.name,pos,pts:tb[pos-1].pts,objective:S.board.objective,met});
  const summary={pos,champion:champion.name,top:top?`${top.name} (${S.clubs[top.clubId].short}) · ${top.stats.goals} goles`:'—',met,objective:S.board.objective,conf:Math.round(S.board.conf)};
  // descenso / ascenso
  const relegated=tb.slice(-3).map(r=>r.id);const pool=shuffle(S.clubs.filter(cl=>!cl.active));const promoted=pool.slice(0,3);
  relegated.forEach(id=>S.clubs[id].active=false);promoted.forEach(cl=>cl.active=true);
  summary.relegated=relegated.map(id=>S.clubs[id].name);summary.promoted=promoted.map(cl=>cl.name);
  // reputación
  tb.forEach((r,i)=>{const cl=S.clubs[r.id];cl.rep=clamp(cl.rep+(i<4?0.15:i>15?-0.15:0),1,5);});
  // jugadores: historial, edad, retiros, contratos
  const left=[];
  Object.values(S.players).forEach(p=>{
    if(p.stats.apps)p.hist.push({s:seasonLabel(),c:p.clubId!=null?S.clubs[p.clubId].short:'—',...p.stats});
    p.stats=newStats();p.yellows=0;p.susp=0;p.age++;
    if(p.age>=30){p.ovr=Math.max(45,p.ovr-ri(0,Math.min(4,p.age-29)));p.pot=Math.min(p.pot,p.ovr+1);}
    if(p.age>=27)p.pot=Math.min(p.pot,Math.max(p.ovr,p.pot-ri(0,1)));
    if(p.youth&&p.age>=19){p.youth=false;p.contract=Math.max(p.contract,2);p.wage=wageFor(p,me().rep);}
    if(p.age>=34&&R()<0.3+(p.age-34)*0.2){if(p.clubId===S.user.clubId)left.push(p.name+' se retira');delete S.players[p.id];return;}
    if(p.clubId!=null&&!p.youth){p.contract--;
      if(p.contract<=0){if(p.clubId===S.user.clubId){left.push(p.name+' (fin de contrato)');p.clubId=null;p.contract=0;}
        else if(R()<0.75){p.contract=ri(1,4);}else{p.clubId=null;p.contract=0;}}}
    p.fitness=100;p.injury=0;p.morale=clamp(p.morale,55,85);
  });
  summary.left=left;
  // nuevos juveniles para la IA y mantenimiento
  S.clubs.forEach(cl=>{if(cl.id===S.user.clubId)return;for(let i=0;i<2;i++)makePlayer({pos:pick(POS),ovr:cl.lvl0-12+ri(-3,3),age:17,clubId:cl.id});maintainSquad(cl.id);
    const b={5:[70e6,130e6],4:[20e6,45e6],3:[7e6,18e6],2:[3e6,8e6],1:[1e6,3e6]}[Math.round(cl.rep)];cl.budget=Math.max(cl.budget*0.3,0)+roundMoney(b[0]+R()*(b[1]-b[0]));
    cl.lvl0=Math.round(clubLevel(cl.id));});
  // agentes libres nuevos
  for(let i=0;i<10;i++)makePlayer({pos:pick(POS),ovr:ri(58,72),age:ri(22,34),clubId:null,contract:0});
  // presupuesto del usuario
  const base={5:80e6,4:30e6,3:12e6,2:5e6,1:2e6}[Math.round(c.rep)];const bonus=met?1.3:0.8;const prize=(21-pos)*1.2e6;
  c.budget=Math.max(0,c.budget)+roundMoney(base*bonus+prize);c.wageBudget=Math.round(Math.max(c.wageBudget,wageBill(c.id)*1.12)/1000)*1000;
  summary.budget=c.budget;summary.prize=prize;
  const userRelegated=relegated.includes(S.user.clubId);
  summary.fired=userRelegated||S.board.conf<25;
  if(summary.fired)summary.reason=userRelegated?'El equipo ha descendido. La directiva prescinde de tus servicios.':'No has cumplido el objetivo y la directiva ha decidido destituirte.';
  S.lastSummary=summary;
  return summary;
}
function fillFromReserves(){const c=me();const sq=squad(c.id);const added=[];const lvl=c.lvl0||70;
  const need={POR:2,DEF:6,MED:6,DEL:4};const cnt={POR:0,DEF:0,MED:0,DEL:0};sq.forEach(p=>cnt[GROUP[p.pos]]++);
  Object.keys(need).forEach(g=>{while(cnt[g]<need[g]){const p=makePlayer({pos:pick(POS.filter(x=>GROUP[x]===g)),ovr:lvl-9+ri(-3,2),age:ri(18,22),clubId:c.id,contract:2});added.push(p);cnt[g]++;}});
  while(squad(c.id).length<18){const p=makePlayer({pos:pick(POS.filter(x=>x!=='POR')),ovr:lvl-9+ri(-3,2),age:ri(18,22),clubId:c.id,contract:2});added.push(p);}
  if(added.length){assignNumbers(c.id);addNews('Refuerzos del filial',`La plantilla se había quedado corta. Suben desde el filial: ${added.map(p=>`${esc(p.name)} (${p.pos}, ${p.ovr})`).join(', ')}.`,'info');}}
function beginNextSeason(){S.season++;S.lastSummary=null;fillFromReserves();me().lineup=null;startSeason(false);

function fired(reason){S.over=true;S.firedReason=reason;save();}
function jobOffers(){const tb=activeClubs().filter(c=>c.id!==S.user.clubId).sort((a,b)=>a.rep-b.rep);return shuffle(tb.slice(0,10)).slice(0,3);}
function takeJob(cid){S.over=false;S.user.clubId=cid;const c=me();c.lineup=null;c.ment=2;S.board.conf=55;

function bidModal(id,stage,extra){
  const p=P(id);const c=me();const club=p.clubId!=null?S.clubs[p.clubId]:null;
  if(!windowOpen()){modal(`<h2>Mercado cerrado</h2><p>Podrás negociar por ${esc(p.name)} cuando abra el mercado (${S.round<18?'jornadas 19 a 22':'el próximo verano'}).</p><button class="btn" data-close>Cerrar</button>`);return;}
  const refuse=willingness(p);
  if(refuse){modal(`<h2>${esc(p.name)}</h2><p>El jugador rechaza negociar: <b>${refuse}</b></p><button class="btn" data-close>Cerrar</button>`);return;}
  if(squad(c.id).length>=32){modal(`<h2>Plantilla completa</h2><p>Tienes 32 jugadores en el primer equipo. Vende o rescinde a alguno antes de fichar.</p><button class="btn" data-close>Cerrar</button>`);return;}
  if(club&&stage!=='contract'){
    const neg=askingPrice(p);const val=valueOf(p);
    if(neg.agreed){bidModal(id,'contract',{fee:neg.agreed});return;}
    const sug=[0.9,1,1.15,1.3].map(x=>roundMoney(val*x));
    modal(`<h2>Oferta por ${esc(p.name)}</h2><div class="small muted">${esc(club.name)} · ${p.pos} · ${p.ovr} · ${p.age} años · Valor ${money(val)}</div>
     <p>Intentos restantes con ${esc(club.short)}: <b>${3-neg.tries}</b>. Presupuesto disponible: <b>${money(c.budget)}</b>.</p>
     ${extra&&extra.msg?`<p style="color:${extra.ok?'var(--good)':'var(--warn)'}">${extra.msg}</p>`:''}
     <label class="label" for="fee">Traspaso ofrecido (€)</label>
     <div class="row" style="margin:6px 0 10px"><input type="number" id="fee" value="${extra&&extra.counter?extra.counter:sug[1]}" step="100000" min="0" style="flex:1"></div>
     <div class="row" style="margin-bottom:14px">${sug.map(s=>`<button class="btn sm" data-setfee="${s}">${money(s)}</button>`).join('')}</div>
     <div class="row"><button class="btn primary" data-act="sendBid" data-id="${p.id}" ${neg.tries>=3?'disabled':''}>Enviar oferta</button>${extra&&extra.counter?`<button class="btn" data-act="acceptCounter" data-id="${p.id}" data-fee="${extra.counter}">Aceptar ${money(extra.counter)}</button>`:''}<button class="btn" data-close style="margin-left:auto">Cancelar</button></div>`);
    return;}
  // contrato
  const fee=extra?extra.fee||0:0;const dem=wageDemand(p);

   <p>Pretensiones del jugador: <b>${money(dem)}/sem</b>. Margen salarial: <b>${money(c.wageBudget-wageBill(c.id))}/sem</b>.</p>
   ${extra&&extra.msg?`<p style="color:var(--warn)">${extra.msg}</p>`:''}

   <label class="label" for="years">Años</label><select id="years">${[1,2,3,4,5].map(y=>`<option ${y===4?'selected':''}>${y}</option>`).join('')}</select></div>

let timer=null;
function startMatch(live){
  const fx=nextFixture();if(!fx)return;
  const m=createMatch(fx,live);UI.match=m;m.speed=1;
  if(!live){simToEnd(m);m.ended=true;}
  else{push(m,0,'info',`¡Empieza el partido en ${esc(S.clubs[fx.h].stadium)}!`,'');}
  render();if(live)runTimer();
}
const SPEEDS=[500,220,70];
function runTimer(){clearInterval(timer);const m=UI.match;if(!m)return;timer=setInterval(()=>{if(!UI.match||m.paused||m.ended){if(m.ended){clearInterval(timer);renderMatch();}return;}stepMinute(m);renderMatch();},SPEEDS[m.speed]);}
function renderMatch(){
  const m=UI.match;let el=document.getElementById('matchView');if(!el){el=document.createElement('div');el.id='matchView';el.className='match';document.body.appendChild(el);}
  const h=S.clubs[m.home.cid],a=S.clubs[m.away.cid];const user=m.home.isUser?m.home:m.away;
  const ptH=m.home.pt||1,ptA=m.away.pt||1;const possH=Math.round(100*ptH/(ptH+ptA));
  const statRow=(l,x,y)=>{const t=(x+y)||1;return `<span class="num">${x}</span><div><div class="small muted" style="text-align:center">${l}</div><div class="b"><i style="width:${100*x/t}%"></i><em style="width:${100*y/t}%"></em></div></div><span class="num">${y}</span>`;};
  const minShown=m.ended?'Final':m.half===2&&m.min===45?'Descanso':m.half===1?(m.min>45?"45+"+(m.min-45):m.min+"'"):(m.min>90?"90+"+(m.min-90):m.min+"'");
  const seen=m.seen||0;m.seen=m.ev.length;const feed=m.ev.map((e,i)=>[e,i]).reverse().map(([e,i])=>`<div class="ev ${e.type}${i>=seen?' new':''}"><span class="m">${e.min}'</span><span>${e.side?crest(S.clubs[e.side==='h'?m.home.cid:m.away.cid]).replace('class="crest"','class="crest" style="transform:scale(.7);vertical-align:middle"'):''} ${esc(e.text)}</span></div>`).join('');
  let ratings='';
  if(m.ended&&m.fx.ratings){const rows=Object.entries(user.mins).filter(([id,mn])=>mn>0).map(([id])=>P(+id)).filter(Boolean).sort((x,y)=>m.fx.ratings[y.id]-m.fx.ratings[x.id]);
    ratings=`<div class="card"><h3>Notas de tus jugadores</h3><div class="tbl-wrap"><table><thead><tr><th>Pos</th><th>Jugador</th><th>Min</th><th>G</th><th>A</th><th>Nota</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${posTag(p.pos)}</td><td>${esc(p.name)}</td><td>${user.mins[p.id]}</td><td>${user.contrib[p.id]?.g||0}</td><td>${user.contrib[p.id]?.a||0}</td><td><b style="color:${m.fx.ratings[p.id]>=7.5?'var(--good)':m.fx.ratings[p.id]<6?'var(--bad)':'var(--fg)'}">${m.fx.ratings[p.id].toFixed(1)}</b></td></tr>`).join('')}</tbody></table></div></div>`;}
  el.innerHTML=`<div class="inner">
   <div class="scoreboard"><div class="t">${crest(h)}<span>${esc(h.name)}</span></div><div><div class="score num">${m.home.goals} - ${m.away.goals}</div><span class="clock" style="text-align:center">${minShown}</span></div><div class="t away"><span>${esc(a.name)}</span>${crest(a)}</div></div>
   ${m.ended?`<div class="row" style="justify-content:center"><button class="btn primary" data-act="finishMatch">Continuar</button></div>`:
   `<div class="row" style="justify-content:center">
     <button class="btn ${m.paused?'primary':''}" data-act="pause">${m.paused?(m.half===2&&m.min===45?'Segunda parte':'Reanudar'):'Pausa'}</button>
     <button class="btn" data-act="speed">Velocidad ${['×1','×2','×4'][m.speed]}</button>
     <button class="btn" data-act="subs">Cambios (${user.subs}/5)</button>
     <label class="label" for="liveMent">Mentalidad</label><select id="liveMent" data-change="liveMent">${MENT.map((x,i)=>`<option value="${i}" ${i===user.ment?'selected':''}>${x}</option>`).join('')}</select>
     <button class="btn" data-act="simEnd">Simular hasta el final</button></div>`}
   ${ratings}
   <div class="grid g2"><div class="card"><h3>Retransmisión</h3><div class="feed">${feed}</div></div>
    <div class="card"><h3>Estadísticas</h3><div class="mstats">${statRow('Posesión %',possH,100-possH)}${statRow('Tiros',m.home.shots,m.away.shots)}${statRow('Tiros a puerta',m.home.sot,m.away.sot)}${statRow('Paradas',m.home.saves,m.away.saves)}${statRow('Amarillas',Object.values(m.home.yellows).reduce((s,x)=>s+x,0),Object.values(m.away.yellows).reduce((s,x)=>s+x,0))}${statRow('Rojas',m.home.red.size,m.away.red.size)}</div>
    <div class="small muted" style="margin-top:12px">Goles: ${m.fx.ev.filter(e=>e.t==='g').map(e=>`${esc(S.clubs[e.side==='h'?m.home.cid:m.away.cid].short)} ${esc(nm(e.pid))} ${e.min}'`).join(' · ')||'—'}</div></div></div>
  </div>`;
}
function subsModal(){
  const m=UI.match;const s=m.home.isUser?m.home:m.away;m.paused=true;renderMatch();
  const out=UI.pendingSubOut;
  modal(`<h2>Cambios (${s.subs}/5)</h2>${s.subs>=5?'<p>Ya has hecho los 5 cambios.</p>':`
   <p class="small muted">${out?'Ahora elige quién entra por '+esc(nm(out))+'.':'Elige el jugador que sale.'}</p>
   <div class="grid g2"><div><div class="label" style="margin-bottom:6px">En el campo</div>${onPitch(s).map(id=>{const p=P(id);return `<button class="btn" style="display:flex;width:100%;justify-content:space-between;margin-bottom:6px;${out===id?'border-color:var(--accent)':''}" data-subout="${id}"><span>${posTag(slotOf(s,id))} ${esc(p.name)}</span><span class="num muted">${Math.round(s.fit[id])}% ${s.yellows[id]?'🟨':''}</span></button>`;}).join('')}</div>
   <div><div class="label" style="margin-bottom:6px">Banquillo</div>${s.bench.map(id=>{const p=P(id);return `<button class="btn" style="display:flex;width:100%;justify-content:space-between;margin-bottom:6px" data-subin="${id}" ${out?'':'disabled'}><span>${posTag(p.pos)} ${esc(p.name)}</span><span class="num">${p.ovr}</span></button>`;}).join('')}</div></div>`}
   <div class="row" style="margin-top:10px"><button class="btn" data-close style="margin-left:auto">Volver al partido</button></div>`);
}
function finishUserMatch(){
  const m=UI.match;clearInterval(timer);
  if(!m.fx.played)finalizeMatch(m);
  me().ment=(m.home.isUser?m.home:m.away).ment;
  const my=m.home.isUser?m.home:m.away,op=m.home.isUser?m.away:m.home;
  const res=my.goals>op.goals?'Victoria':my.goals<op.goals?'Derrota':'Empate';
  advanceWeek(true);
  UI.match=null;const el=document.getElementById('matchView');if(el)el.remove();
  toast(`${res} ${my.goals}-${op.goals} ante ${esc(S.clubs[op.cid].name)}`);
  UI.view='home';render();
}

/* ---------- modal ---------- */
function modal(html){closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.id='modal';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg)closeModal();});}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();if(UI.match&&UI.pendingSubOut==null){}}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-player],[data-slot],[data-benchp],[data-sort],[data-ltab],[data-round],[data-msg],[data-pick],[data-train],[data-close],[data-page],[data-setfee],[data-subout],[data-subin],[data-job]');
  if(!t)return;const d=t.dataset;
  if(d.close!==undefined){closeModal();UI.pendingSubOut=null;return;}
  if(d.go){UI.view=d.go;UI.selSlot=null;closeModal();render();window.scrollTo(0,0);return;}
  if(d.pick){UI.newClub=+d.pick;const nmv=document.getElementById('mgr')?.value;renderStart();if(nmv)document.getElementById('mgr').value=nmv;return;}
  if(d.job){takeJob(+d.job);UI.view='home';render();return;}
  if(d.player){playerModal(+d.player);return;}
  if(d.sort){UI.sqSort=d.sort;render();return;}
  if(d.ltab){UI.leagueTab=d.ltab;UI.round=null;render();return;}
  if(d.round){UI.round=+d.round;render();return;}
  if(d.msg){openMsg(+d.msg);return;}
  if(d.train){S.training=d.train;save();render();return;}
  if(d.page){UI.mk.page=Math.max(0,UI.mk.page+ +d.page);render();return;}
  if(d.setfee){const f=document.getElementById('fee');if(f)f.value=d.setfee;return;}
  if(d.slot!==undefined){const i=+d.slot;const xi=userLineup();
    if(UI.selSlot==null)UI.selSlot=i;else if(UI.selSlot===i)UI.selSlot=null;else{[xi[UI.selSlot],xi[i]]=[xi[i],xi[UI.selSlot]];UI.selSlot=null;save();}
    render();return;}
  if(d.benchp){const id=+d.benchp;if(UI.selSlot==null){playerModal(id);return;}const xi=userLineup();xi[UI.selSlot]=id;UI.selSlot=null;save();render();return;}
  if(d.subout){UI.pendingSubOut=+d.subout;subsModal();return;}
  if(d.subin){const m=UI.match;const s=m.home.isUser?m.home:m.away;if(UI.pendingSubOut&&s.subs<5){doSub(m,s,UI.pendingSubOut,+d.subin);}UI.pendingSubOut=null;subsModal();return;}
  if(d.act)act(d.act,t);
});
document.addEventListener('change',e=>{
  const t=e.target;const d=t.dataset;
  if(d.change==='formation'){const c=me();c.formation=t.value;c.lineup=bestXI(c.id,c.formation);UI.selSlot=null;save();render();}
  else if(d.change==='ment'){me().ment=+t.value;save();}
  else if(d.change==='liveMent'){const m=UI.match;(m.home.isUser?m.home:m.away).ment=+t.value;}
  else if(d.mk){UI.mk[d.mk]=t.type==='checkbox'?t.checked:(d.mk==='q'||d.mk==='pos'?t.value:+t.value);UI.mk.page=0;render();}
  else if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.clubs||!data.players)throw 0;S=data;save();UI.view='home';render();toast('Partida importada');}catch(err){toast('El archivo no es una partida válida.');}};r.readAsText(t.files[0]);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal')){closeModal();UI.pendingSubOut=null;}});

function act(a,t){
  const id=t.dataset.id?+t.dataset.id:null;
  switch(a){
  case 'start':{const name=(document.getElementById('mgr').value||'').trim()||'Míster';newGame(name,UI.newClub);UI.view='home';render();break;}
  case 'continue':S=load();UI.view='home';render();break;
  case 'newCareer':modal(`<h2>¿Nueva carrera?</h2><p>Se borrará la partida guardada en este navegador.</p><div class="row"><button class="btn danger" data-act="confirmNew">Sí, empezar de cero</button><button class="btn" data-close>Cancelar</button></div>`);break;
  case 'confirmNew':try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=null;UI.newClub=null;closeModal();render();break;
  case 'play':startMatch(true);break;
  case 'sim':startMatch(false);break;
  case 'pause':{const m=UI.match;m.paused=!m.paused;renderMatch();if(!m.paused)runTimer();break;}
  case 'speed':{const m=UI.match;m.speed=(m.speed+1)%3;runTimer();renderMatch();break;}
  case 'subs':UI.pendingSubOut=null;subsModal();break;
  case 'simEnd':{const m=UI.match;m.live=false;simToEnd(m);finalizeMatch(m);clearInterval(timer);renderMatch();break;}
  case 'finishMatch':{const m=UI.match;if(!m.fx.played)finalizeMatch(m);finishUserMatch();break;}
  case 'autoXI':{const c=me();c.lineup=bestXI(c.id,c.formation);UI.selSlot=null;save();render();break;}
  case 'endSeason':endSeason();save();render();break;
  case 'nextSeason':beginNextSeason();render();break;
  case 'toFired':fired(S.lastSummary.reason);render();break;
  case 'toggleList':{const p=P(id);p.listed=!p.listed;save();render();playerModal(id);break;}
  case 'renew':{const p=P(id);const dem=Math.round(Math.max(p.wage*1.1,wageFor(p,me().rep))/500)*500;
    if(p.morale<35){modal(`<h2>${esc(p.name)}</h2><p>Su moral es demasiado baja: no quiere renovar ahora mismo.</p><button class="btn" data-close>Cerrar</button>`);break;}
    modal(`<h2>Renovar a ${esc(p.name)}</h2><p>Pide <b>${money(dem)}/sem</b> (ahora cobra ${money(p.wage)}).</p><div class="row"><label class="label" for="ryears">Años</label><select id="ryears">${[1,2,3,4,5].map(y=>`<option ${y===3?'selected':''}>${y}</option>`).join('')}</select>
     <button class="btn primary" data-act="doRenew" data-id="${p.id}" data-w="${dem}">Firmar renovación</button><button class="btn" data-close>Cancelar</button></div>`);break;}
  case 'doRenew':{const p=P(id);const w=+t.dataset.w;const c=me();if(wageBill(c.id)-p.wage+w>c.wageBudget){toast('Superas el límite salarial.');break;}p.wage=w;p.contract=+document.getElementById('ryears').value;p.morale=clamp(p.morale+8,0,100);save();closeModal();toast(`${esc(p.name)} renueva hasta ${2026+S.season-1+p.contract}`);render();break;}
  case 'release':{const p=P(id);const cost=Math.round(p.wage*38*p.contract*0.5);modal(`<h2>Rescindir a ${esc(p.name)}</h2><p>La indemnización cuesta <b>${money(cost)}</b> del presupuesto de fichajes.</p><div class="row"><button class="btn danger" data-act="doRelease" data-id="${id}" data-cost="${cost}">Rescindir</button><button class="btn" data-close>Cancelar</button></div>`);break;}
  case 'doRelease':{const p=P(id);const c=me();c.budget-=+t.dataset.cost;p.clubId=null;p.contract=0;p.listed=false;if(c.lineup)c.lineup=c.lineup.map(x=>x===id?null:x);addNews('Rescisión: '+p.name,`${p.name} queda libre tras rescindir su contrato.`,'info');save();closeModal();render();break;}
  case 'promote':{const p=P(id);p.youth=false;p.contract=3;p.wage=Math.max(2000,wageFor(p,me().rep));assignNumbers(p.clubId);save();closeModal();toast(`${esc(p.name)} sube al primer equipo`);render();break;}
  case 'releaseYouth':{delete S.players[id];save();closeModal();render();break;}
  case 'scout':{const lv=+document.getElementById('sc-lv').value;const region=document.getElementById('sc-region').value;const c=me();const cost=SCOUT_LV[lv].cost;
    if(c.budget<cost){toast('Presupuesto insuficiente.');break;}c.budget-=cost;S.scout={lv,region,weeks:3};save();render();toast('Ojeador enviado a '+REGIONS[region]);break;}
  case 'bid':closeModal();bidModal(id);break;
  case 'sendBid':{const p=P(id);const neg=askingPrice(p);const fee=Math.max(0,Math.round(+document.getElementById('fee').value||0));const c=me();
    if(fee>c.budget){bidModal(id,null,{msg:'No tienes presupuesto suficiente para esa oferta.'});break;}
    neg.tries++;
    if(fee>=neg.ask){neg.agreed=fee;save();bidModal(id,'contract',{fee});}
    else if(fee>=neg.ask*0.6&&neg.tries<3){const counter=roundMoney(Math.max(neg.ask*0.97,(fee+neg.ask)/2+neg.ask*0.06));bidModal(id,null,{msg:`${S.clubs[p.clubId].name} rechaza la oferta, pero pediría ${money(counter)}.`,counter});}
    else bidModal(id,null,{msg:neg.tries>=3?`${S.clubs[p.clubId].name} da por cerradas las negociaciones hasta el próximo mercado.`:`${S.clubs[p.clubId].name} considera la oferta insuficiente.`});
    save();break;}
  case 'acceptCounter':{const p=P(id);const fee=+t.dataset.fee;if(fee>me().budget){toast('Presupuesto insuficiente.');break;}askingPrice(p).agreed=fee;save();bidModal(id,'contract',{fee});break;}
  case 'sendContract':{const p=P(id);const fee=+t.dataset.fee;const w=Math.round(+document.getElementById('wage').value||0);const y=+document.getElementById('years').value;const c=me();const dem=wageDemand(p);
    if(wageBill(c.id)+w>c.wageBudget){bidModal(id,'contract',{fee,msg:'Ese salario supera tu límite salarial semanal.'});break;}
    if(w<dem*0.9){const k='w'+p.id;S.neg[k]=(S.neg[k]||0)+1;if(S.neg[k]>=3){closeModal();toast(`${esc(p.name)} rompe las negociaciones.`);if(fee)askingPrice(p).agreed=0;break;}bidModal(id,'contract',{fee,msg:`${p.name} rechaza la propuesta. Quiere cerca de ${money(dem)}/sem.`});break;}
    if(fee>c.budget){toast('Presupuesto insuficiente.');break;}
    signPlayer(p,fee,w,y);closeModal();toast(`¡${esc(p.name)} es nuevo jugador de ${esc(c.name)}!`);render();break;}
  case 'acceptOffer':{const n=S.news.find(x=>x.id===id);const p=P(n.data.pid);sellPlayer(p,n.data.cid,n.data.fee);n.done='Aceptada · '+money(n.data.fee);save();closeModal();render();break;}
  case 'rejectOffer':{const n=S.news.find(x=>x.id===id);n.done='Rechazada';const p=P(n.data.pid);if(p)p.morale=clamp(p.morale-(p.listed?0:4),0,100);save();closeModal();render();break;}
  case 'counterOffer':{const n=S.news.find(x=>x.id===id);const p=P(n.data.pid);const ask=roundMoney(n.data.fee*1.25);
    if(R()<0.5){sellPlayer(p,n.data.cid,ask);n.done='Contraoferta aceptada · '+money(ask);toast(`${esc(S.clubs[n.data.cid].name)} acepta pagar ${money(ask)}`);}else{n.done='El club comprador se retira';toast('El club comprador se retira de la negociación');}
    save();closeModal();render();break;}
  case 'export':{const box=document.getElementById('exportBox');const txt=JSON.stringify(S);box.hidden=false;box.value=txt;box.select();
    try{const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='modo-carrera-'+seasonLabel().replace('/','-')+'.json';a.click();}catch(e){}
    try{navigator.clipboard.writeText(txt).then(()=>toast('Partida copiada al portapapeles'),()=>{});}catch(e){}break;}
  }
}

/* arranque */
render();
</script>
</body>
</html>
