<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modo Carrera Míster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: consola de retransmisión — barra lateral de navegación (abajo en móvil), panel principal con tarjetas tipo grafismo de TV */
:root{
  --bg:#0d1117;
  --panel:#161c26;
  --panel2:#1d2531;
  --line:#2a3443;
  --fg:#e9edf3;
  --muted:#8b97a8;
  --accent:#f2b134;      /* oro marcador */
  --accent-ink:#1a1204;
  --pitch:#1f6b45;
  --pitch2:#1a5c3b;
  --good:#3fbf74;
  --warn:#e8a33a;
  --bad:#e5534b;
  --info:#5aa6e8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font:600 12px/1 var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.nav button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{font-size:20px;margin-bottom:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font:600 12px/1.5 var(--display);letter-spacing:.05em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.ovr{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:6px;font:700 16px/1 var(--display);background:var(--panel2)}
.ovr.o80{background:#c9a227;color:#1a1204}.ovr.o75{background:#9aa6b4;color:#111}.ovr.o70{background:#8a5a2b;color:#fff}
.pos{font:700 12px/1 var(--display);letter-spacing:.06em;padding:4px 6px;border-radius:5px;display:inline-block;min-width:36px;text-align:center}
.pos.POR{background:#7a5a10;color:#ffe9a8}.pos.DEF{background:#173f6b;color:#bfe0ff}.pos.MED{background:#1d5a37;color:#c6f2d6}.pos.DEL{background:#6b1f22;color:#ffd0cf}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th.sort{cursor:pointer}
td{padding:7px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:700 11px/1 var(--display);flex:none;border:2px solid}
.crest{display:inline-grid;place-items:center;width:30px;height:34px;border-radius:6px 6px 14px 14px;font:800 10px/1 var(--display);flex:none;border:2px solid rgba(255,255,255,.25)}
.crest.long{font-size:8px}
.crest.big{width:58px;height:66px;font-size:20px;border-radius:10px 10px 26px 26px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}

/* App shell */
#app{display:flex;min-height:100%}
.nav{width:210px;flex:none;align-self:flex-start;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font:800 22px/1 var(--display);letter-spacing:.02em;padding:4px 10px 14px;text-transform:uppercase}
.brand span{color:var(--accent)}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font:600 16px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);position:relative}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:var(--fg);background:var(--panel2)}
.nav button.on{color:var(--fg);background:var(--panel2)}
.nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.nav .src{margin-top:auto;padding:10px 12px 0;font-size:11px}
.nav .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:2px 6px}
main{flex:1;min-width:0;padding-inline:24px;padding-block:20px 40px;max-width:1200px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:32px;text-transform:uppercase}
.topbar .meta{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap}
.stat .v{font:700 20px/1.1 var(--display)}
@media (max-width:760px){
  .nav .src{display:none}
  #app{flex-direction:column}
  .nav{order:2;position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:2px}
  .brand{display:none}
  .nav button{flex-direction:column;gap:4px;font-size:11px;padding:8px 10px;flex:none}
  .nav button.on::before{left:10px;right:10px;top:0;bottom:auto;width:auto;height:3px}
.nav .dot{position:absolute;top:2px;right:2px;margin:0}
  main{padding-inline:16px;padding-block:16px 96px}
  .topbar h1{font-size:26px}
  .topbar .meta{margin-left:0}
}

/* Next match hero */
.fixture-hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center;padding:10px 0}
.fixture-hero .team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.fixture-hero .name{font:700 20px/1.1 var(--display);text-transform:uppercase}
.vs{font:800 28px/1 var(--display);color:var(--muted)}

/* Pitch */
.pitch{position:relative;aspect-ratio:68/80;max-width:100%;width:100%;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch2) 10% 20%);border:2px solid rgba(255,255,255,.18)}
.pitch::before{content:"";position:absolute;left:22%;right:22%;bottom:0;height:14%;border:2px solid rgba(255,255,255,.25);border-bottom:0}
.pitch::after{content:"";position:absolute;left:0;right:0;top:0;height:0;border-top:2px solid rgba(255,255,255,.25)}
.pitch .circle{position:absolute;left:50%;top:0;width:26%;aspect-ratio:1;border:2px solid rgba(255,255,255,.25);border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:84px;text-align:center}
.slot .chip{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--display);background:var(--panel);border:2px solid var(--fg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .chip.oop{border-color:var(--warn)}
.slot .chip.bad{border-color:var(--bad)}
.slot.sel .chip{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}
.slot .nm{font:600 12px/1.1 var(--display);background:rgba(0,0,0,.55);padding:2px 5px;border-radius:4px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sp{font:700 10px/1 var(--display);color:rgba(255,255,255,.75)}
@media (max-width:460px){.slot{width:64px}.slot .chip{width:36px;height:36px;font-size:14px}.slot .nm{font-size:11px;max-width:64px}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,10,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px}
.modal h2{font-size:26px;margin-bottom:6px;text-transform:uppercase}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
.statgrid b{display:block;font:700 22px/1 var(--display)}

/* Match */
.match{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.match .inner{max-width:900px;margin:0 auto;display:grid;gap:14px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.scoreboard .t{display:flex;align-items:center;gap:10px;font:700 20px/1.1 var(--display);text-transform:uppercase;min-width:0}
.scoreboard .t.away{justify-content:flex-end;text-align:right}
.score{font:800 46px/1 var(--display);text-align:center;letter-spacing:.04em}
.clock{display:block;font:700 15px/1 var(--display);color:var(--accent);margin-top:4px}
.feed{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
.ev{display:flex;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel2);align-items:flex-start}
.ev .m{font:700 15px/1.3 var(--display);color:var(--muted);min-width:30px}
.ev.goal{background:color-mix(in srgb,var(--accent) 22%,var(--panel2));}
.ev.goal .m{color:var(--accent)}
.ev.card-y .m{color:#f5d64a}.ev.card-r .m{color:var(--bad)}
.mstats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.mstats .b{height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}
.mstats .b i{background:var(--accent)}
.mstats .b em{background:var(--info);margin-left:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.start{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:28px}
.start .box{width:min(980px,100%);display:grid;gap:18px}
.hero-title{font:800 clamp(44px,9vw,92px)/.9 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.hero-title em{font-style:italic;color:var(--accent)}
.clubpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.clubpick button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.clubpick button:hover,.clubpick button.on{border-color:var(--accent)}
.clubpick button:focus-visible{outline:2px solid var(--accent)}
.stars{color:var(--accent);letter-spacing:1px;font-size:12px}
.form span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:700 11px/1 var(--display);margin-right:2px;color:#0d1117}
.form .W{background:var(--good)}.form .D{background:#9aa6b4}.form .L{background:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;border-radius:99px;font:600 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.msg{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.msg.unread .t{font-weight:700}
.msg.unread::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.msg:not(.unread)::before{content:"";width:8px;flex:none}
@media (prefers-reduced-motion:no-preference){.ev.new{animation:in .35s ease}@keyframes in{from{opacity:.2;transform:translateY(-4px)}}}
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
