<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07111f" />
  <meta name="application-name" content="CIFRA" />
  <meta name="description" content="CIFRA — a party guessing game: slide your number, closest answer wins." />
  <link rel="icon" href="favicon-32.png" type="image/png" />
  <title>CIFRA</title>
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <script src="i18n.js"></script>
  <script src="cg.js"></script>
  <style>
    :root{
      --bg:#07111f; --panel:#0d1a2b; --panel2:#10233a; --text:#f5f7fb; --muted:#91a0b8;
      --line:rgba(255,255,255,.10); --blue:#2e8cff; --blue2:#57a5ff; --green:#2ad276; --green2:#62e69f;
      --red:#ff4f5e; --gold:#ffd66b; --radius:22px; --shadow:0 18px 50px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:radial-gradient(circle at 50% -20%,#17335a 0,#07111f 52%);min-height:100%;color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    input{user-select:text;-webkit-user-select:text}
    button,input,select{font:inherit}
    button{border:0}
    #app{min-height:100svh;display:flex;justify-content:center}
    .phone{width:100%;max-width:520px;min-height:100svh;padding:18px 16px 24px;display:flex;flex-direction:column}
    .screen{display:none;flex:1;flex-direction:column;gap:16px}
    .screen.active{display:flex}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(160deg,#1c4d89,#112b4a);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
    .logo-mark{width:18px;height:26px;border-radius:9px;border:3px solid #fff;position:relative}
    .logo-mark:after{content:"";position:absolute;left:5px;top:4px;width:4px;height:12px;border-radius:4px;background:#fff}
    .brand h1{font-size:19px;margin:0;letter-spacing:.05em}
    .brand p{font-size:11px;color:var(--muted);margin:2px 0 0}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
    .hero{margin-top:16px;padding:8px 2px 4px}
    .hero .eyebrow{color:#71aefc;text-transform:uppercase;letter-spacing:.16em;font-weight:700;font-size:11px}
    .hero h2{font-size:42px;line-height:.94;margin:8px 0 12px;letter-spacing:-.045em}
    .hero p{color:var(--muted);line-height:1.5;margin:0;max-width:420px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .card.pad{padding:18px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
    .field input,.field select{width:100%;background:#0a1626;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:15px;outline:none}
    .field input:focus,.field select:focus{border-color:#3d8eff;box-shadow:0 0 0 3px rgba(46,140,255,.12)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .players-list{display:grid;gap:10px;margin-top:10px}
    .player-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px}
    .player-badge{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:950;background:rgba(46,140,255,.12);border:1px solid rgba(87,165,255,.25);color:#9bc9ff}
    .player-remove{width:38px;height:42px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:18px}
    .player-remove:hover{color:#fff;background:rgba(255,255,255,.08)}
    .add-player{width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(46,140,255,.08);border:1px dashed rgba(87,165,255,.35);color:#8fc4ff;font-weight:800;cursor:pointer}
    .add-player:disabled{opacity:.4;cursor:not-allowed}
    .primary{background:linear-gradient(180deg,#3999ff,#2274e5);color:white;padding:15px 18px;border-radius:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 26px rgba(46,140,255,.24)}
    .secondary{background:rgba(255,255,255,.06);color:var(--text);padding:15px 18px;border-radius:16px;font-weight:750;cursor:pointer;border:1px solid var(--line)}
.ghost{background:transparent;color:var(--muted);padding:10px;border-radius:12px;cursor:pointer}
    .spacer{flex:1}
    .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
    .mini{padding:12px;border-radius:17px;background:rgba(255,255,255,.035);border:1px solid var(--line);text-align:center}
    .mini b{font-size:18px;display:block;margin-bottom:4px}.mini span{font-size:11px;color:var(--muted);line-height:1.3}

    .progress{display:flex;align-items:center;gap:10px}
    .progress-line{height:7px;background:rgba(255,255,255,.09);border-radius:20px;overflow:hidden;flex:1}.progress-line>span{display:block;height:100%;background:linear-gradient(90deg,#2e8cff,#73b6ff);border-radius:20px;transition:width .3s ease}
    .round-label{font-size:12px;color:var(--muted);white-space:nowrap}
    .question-card{padding:18px}
    .category{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
    .question{font-size:26px;line-height:1.08;letter-spacing:-.03em;margin:8px 0 7px}
    .hint{font-size:12px;color:var(--muted);line-height:1.45}
    .player-turn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
    .turn-name{font-size:14px;font-weight:850}.turn-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}.blue{background:var(--blue)}.green{background:var(--green)}

    .scale-wrap{flex:1;display:flex;align-items:stretch;justify-content:center;min-height:370px;padding:2px 0 0}
    .scale{position:relative;width:min(100%,380px);height:calc(100svh - 420px);min-height:360px;max-height:590px;touch-action:none;user-select:none;-webkit-user-select:none}
    .axis{position:absolute;inset:10px 0 12px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.075));border:1px solid rgba(255,255,255,.10);overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,.20)}
    .axis:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0,transparent calc(16.666% - 1px),rgba(255,255,255,.075) calc(16.666% - 1px),rgba(255,255,255,.075) 16.666%);pointer-events:none}
    .fill{position:absolute;left:0;right:0;bottom:0;border-radius:25px 25px 0 0;min-height:0;transform-origin:bottom;transition:height .08s linear;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
    .fill.blueFill{background:linear-gradient(180deg,#49a2ff 0%,#1475ed 42%,#0755c5 100%)}.fill.greenFill{background:linear-gradient(180deg,#55e99a 0%,#16b86b 42%,#0c8d50 100%)}
    .thumb{position:absolute;left:50%;width:min(82%,310px);height:58px;transform:translate(-50%,50%);border-radius:17px;border:2px solid rgba(255,255,255,.92);box-shadow:0 10px 30px rgba(0,0,0,.42);z-index:5;display:flex;align-items:center;justify-content:center;cursor:grab;transition:bottom .08s linear;backdrop-filter:blur(7px)}
    .thumb:active{cursor:grabbing}.thumb.blueThumb{background:rgba(23,122,239,.94)}.thumb.greenThumb{background:rgba(20,184,105,.94)}
    .thumb .thumb-value{font-size:21px;font-weight:950;text-align:center;line-height:1;letter-spacing:-.03em;padding:0 10px;white-space:nowrap}
    .answer-readout{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;color:var(--muted)}
    .answer-readout strong{color:var(--text);font-size:22px;font-variant-numeric:tabular-nums}

    .answer-box-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 10px 22px;flex:1;min-height:300px}
    .answer-entry{width:min(100%,360px);display:flex;align-items:center;justify-content:center;gap:10px}
    .answer-input{width:min(100%,300px);box-sizing:border-box;background:#0b1728;border:2px solid rgba(255,255,255,.14);border-radius:20px;color:var(--text);font-size:38px;font-weight:950;text-align:center;padding:20px 16px;outline:none;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 20px rgba(0,0,0,.18),0 8px 30px rgba(0,0,0,.12);transition:border-color .18s,box-shadow .18s}
    .answer-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(46,140,255,.12),inset 0 0 20px rgba(0,0,0,.18)}
    .answer-input::placeholder{color:rgba(255,255,255,.2)}
    .answer-unit{font-size:16px;font-weight:850;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
    .entry-hint{font-size:12px;color:var(--muted);text-align:center;max-width:320px;line-height:1.45}
    .pass-card{text-align:center;padding:28px 20px}.pass-icon{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin:2px auto 18px;font-size:36px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
    .pass-card h3{font-size:28px;margin:0 0 8px}.pass-card p{color:var(--muted);line-height:1.5;margin:0 auto;max-width:350px}

    .reveal-card{padding:16px}.reveal-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.target{font-size:37px;font-weight:950;letter-spacing:-.04em}.target small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
    .reveal-scale{height:clamp(170px,calc(100svh - 530px),430px);position:relative;margin-top:12px;border-radius:24px;background:rgba(4,10,18,.35);border:1px solid rgba(255,255,255,.06);overflow:hidden}
    .reveal-scale:before{content:"";position:absolute;left:50%;top:18px;bottom:18px;width:1px;background:rgba(255,255,255,.07);transform:translateX(-50%)}
    .result-columns{height:100%;display:grid;grid-template-columns:repeat(var(--result-count,2),minmax(0,1fr));gap:clamp(4px,1.5vw,10px);padding:18px 6px 0}
    .result-column{position:relative;height:100%;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;padding:0 clamp(2px,1vw,10px)}
    .result-bar{width:100%;height:0;min-height:7px;border-radius:20px 20px 0 0;box-shadow:0 -12px 28px rgba(0,0,0,.15);transition:height .45s cubic-bezier(.2,.8,.2,1);position:relative}
    .result-bar.result-c0{background:linear-gradient(180deg,#49a2ff 0%,#1475ed 45%,#0755c5 100%)}
    .result-bar.result-c1{background:linear-gradient(180deg,#55e99a 0%,#16b86b 45%,#0c8d50 100%)}
    .result-bar.result-c2{background:linear-gradient(180deg,#c18cff 0%,#8b4de8 45%,#6330b7 100%)}
    .result-bar.result-c3{background:linear-gradient(180deg,#ffb35b 0%,#ef7c20 45%,#bd4d09 100%)}
    .result-bar.result-c4{background:linear-gradient(180deg,#ff78a8 0%,#ed3e79 45%,#b51f58 100%)}
    .result-labels{display:grid;grid-template-columns:repeat(var(--result-count,2),minmax(0,1fr));gap:clamp(4px,1.5vw,10px);margin:12px 0 0}.result-label{font-size:12px;font-weight:900;white-space:nowrap;padding:9px 7px;border-radius:14px;background:#0d1a2b;border:1px solid rgba(255,255,255,.15);text-align:center;overflow:hidden;text-overflow:ellipsis}.result-label .result-estimate{display:block;color:#fff;font-size:13px;margin-top:2px}.result-label .result-player-name{display:block;overflow:hidden;text-overflow:ellipsis}.result-name{font-size:11px;font-weight:800;color:rgba(255,255,255,.75);padding:8px 0 12px;z-index:4;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .diffs{display:grid;grid-template-columns:repeat(var(--result-count,2),minmax(0,1fr));gap:7px;margin-top:10px}.diff{padding:10px 6px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;text-align:center;min-width:0}.diff span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.diff strong{font-size:15px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media (max-width:430px){.result-label{font-size:10px;padding:7px 4px}.result-label .result-estimate{font-size:11px}.result-name{font-size:9px}.diff strong{font-size:12px}}
    @media (max-width:360px){.result-label .result-estimate{font-size:10px}.diff{padding:8px 3px}.diff strong{font-size:11px}}
    .source{font-size:10px;color:#74839b;line-height:1.4;margin-top:10px}.source b{color:#8ebcff;font-weight:600}

    .scoreboard{display:grid;grid-template-columns:repeat(var(--player-count,2),minmax(0,1fr));gap:8px}.score{padding:12px 8px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.035);min-width:0}.score .name{font-size:11px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score b{font-size:27px;display:block;margin-top:2px}.score .muted{font-size:10px;display:block}.score.score-c0{box-shadow:inset 0 0 0 1px rgba(46,140,255,.12)}.score.score-c1{box-shadow:inset 0 0 0 1px rgba(42,210,118,.12)}.score.score-c2{box-shadow:inset 0 0 0 1px rgba(193,140,255,.12)}.score.score-c3{box-shadow:inset 0 0 0 1px rgba(255,179,91,.12)}.score.score-c4{box-shadow:inset 0 0 0 1px rgba(255,120,168,.12)}
    .final-card{text-align:center;padding:24px}.final-card h2{font-size:36px;letter-spacing:-.04em;margin:4px 0 8px}.final-card p{color:var(--muted);line-height:1.5}.winner-name{font-size:18px;font-weight:900}.statline{margin-top:16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.statline span{font-size:11px;color:var(--muted);padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
    .fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .danger{color:#ff9ca6}.muted{color:var(--muted)}
    .entity-link{padding:0;margin:0;border:0;background:transparent;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.65);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer;border-radius:4px;transition:background .15s,color .15s}.entity-link:hover,.entity-link:focus{background:rgba(255,255,255,.09);outline:none}.entity-link:active{background:rgba(255,255,255,.14)}
  .entity-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:100;background:rgba(2,7,15,.72);backdrop-filter:blur(8px)}.entity-modal.open{display:flex}.entity-modal-card{width:min(100%,390px);background:linear-gradient(180deg,#15263c,#0d1a2b);border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:22px;animation:entityPop .2s ease}.entity-modal-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#74b5ff;font-weight:850;margin-bottom:7px}.entity-modal-title{font-size:25px;font-weight:900;letter-spacing:-.03em;margin:0 0 9px}.entity-modal-text{font-size:14px;line-height:1.55;color:#b9c5d7;margin:0}.entity-modal-close{width:100%;margin-top:18px;padding:13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#fff;font-weight:800;cursor:pointer}.entity-modal-source{font-size:10px;color:#718199;margin-top:10px;line-height:1.4}@keyframes entityPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .online-card{margin-top:12px;padding:14px}
  .online-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .online-head b{font-size:15px}.online-head span:last-child{font-size:12px;color:var(--muted)}
  .online-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s ease-in-out infinite}
  .online-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .online-actions .secondary{padding:13px 10px}
  .online-box{display:flex;flex-direction:column;gap:14px}
  .online-box h3{margin:0;font-size:26px;letter-spacing:-.02em}
  .online-error{min-height:18px;margin:-4px 0 0;color:#ff9ca6;font-size:13px}
  .code-input{width:100%;background:#0a1626;border:2px solid var(--line);border-radius:18px;color:var(--text);font-size:46px;font-weight:950;letter-spacing:.3em;text-align:center;padding:14px 0 14px .3em;outline:none;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .code-input:focus{border-color:var(--blue)}
  .lobby-code-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;border-radius:22px;background:linear-gradient(180deg,rgba(46,140,255,.16),rgba(46,140,255,.05));border:1px solid rgba(87,165,255,.3)}
  .lobby-code-card span{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
  .lobby-code{background:transparent;color:var(--text);cursor:pointer;padding:0}
  .lobby-code b{font-size:54px;letter-spacing:.22em;font-weight:950;padding-left:.22em}
  .lobby-code-card small{font-size:12px;color:var(--muted)}
  .lobby-list{display:grid;gap:9px}
  .lobby-slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.02);min-height:54px}
  .lobby-slot.filled{border-style:solid;border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05);animation:fade .3s ease}
  .lobby-slot.me{box-shadow:inset 0 0 0 2px var(--slot-color)}
  .lobby-num{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:950;font-size:13px;background:rgba(255,255,255,.06);color:var(--muted)}
  .lobby-slot.filled .lobby-num{background:var(--slot-color);color:#fff}
  .lobby-name{font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lobby-tag{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:4px 7px;border-radius:999px;background:rgba(255,214,107,.15);color:var(--gold)}
  .lobby-tag.you{background:rgba(46,140,255,.16);color:#8fc4ff}
  .lobby-empty{color:rgba(255,255,255,.3);font-size:14px;animation:pulse 1.8s ease-in-out infinite}
  .dots i{font-style:normal;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{opacity:.15}30%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .lobby-waiting{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;font-weight:700}
  .lobby-spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--blue);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lobby-wait-host{text-align:center;color:var(--muted);font-size:14px;margin:0}
  #lobbyRoundsWrap[hidden],#lobbyStart[hidden],#againBtn[hidden],#lobbyInvite[hidden]{display:none}
  .wait-box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
  .wait-title{font-size:24px;line-height:1.25;margin:0;padding:0 8px}.wait-title b{color:var(--player-color,#57a5ff)}
  .wait-ticker{width:100%;height:76px;display:flex;align-items:center;justify-content:flex-end;gap:10px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
  .wait-ticker span{flex:0 0 auto;font-size:44px;font-weight:950;color:var(--c);font-variant-numeric:tabular-nums;animation:tick-in .3s ease-out;text-shadow:0 0 18px var(--c)}
  @keyframes tick-in{from{opacity:0;transform:translateY(16px) scale(.6)}to{opacity:1;transform:none}}
  .wait-info{color:var(--muted);margin:0;font-size:14px}
  .lobby-kick{margin-left:auto;padding:7px 10px;border-radius:10px;background:rgba(255,79,94,.12);border:1px solid rgba(255,79,94,.35);color:#ff9ca6;font-size:12px;font-weight:800;cursor:pointer}
  .lobby-tag+.lobby-kick,.lobby-name+.lobby-kick{margin-left:6px}
  .turn-timer{display:flex;align-items:center;gap:10px;margin:-4px 2px 0}
  .turn-timer[hidden],.wait-timer[hidden]{display:none}
  .turn-timer span{font-weight:950;font-size:18px;font-variant-numeric:tabular-nums;min-width:52px;color:var(--text)}
  .turn-timer-track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .turn-timer-track i{display:block;height:100%;background:var(--player-color,#2e8cff);transform-origin:left;transition:transform .5s linear}
  .turn-timer.urgent span{color:var(--red);animation:pulse .8s ease-in-out infinite}
  .turn-timer.urgent .turn-timer-track i{background:var(--red)}
  .wait-timer{margin:0;font-size:16px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .wait-timer.urgent{color:#ff9ca6}
  .online-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#14243a;border:1px solid rgba(255,255,255,.16);color:var(--text);padding:12px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:calc(100% - 32px);text-align:center}
  .online-toast.show{opacity:1;transform:translate(-50%,0)}
  .entity-link{display:inline;white-space:normal;text-align:inherit;line-height:inherit;letter-spacing:inherit;font-weight:inherit;font-size:inherit}
  .question-tip{text-align:center;font-size:12px;color:var(--muted);margin-top:-6px}
  @media (max-width:380px){.hero h2{font-size:36px}.question{font-size:23px}.scale{min-height:330px}.thumb{width:68px;height:68px}.target{font-size:31px}}
  .confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti-piece{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;opacity:0;animation:confetti-fall var(--dur) cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--delay);transform:translate3d(0,0,0) rotate(0deg)}
  @keyframes confetti-fall{0%{opacity:0;transform:translate3d(0,-30px,0) rotate(0deg)}10%{opacity:1}100%{opacity:1;transform:translate3d(var(--drift),110vh,0) rotate(var(--rot))}}
  .final-actions{display:grid;gap:10px;width:100%;max-width:520px;margin:0 auto}

    /* Tarjeta de la pregunta, cifra grande y regla deslizante. */
    .turn-player{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:850;font-size:15px}
    .turn-dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--player-color,#2e8cff);box-shadow:0 0 12px var(--player-color,#2e8cff)}
    .q-card{background:#fff;color:#0b0f17;border-radius:26px;padding:34px 22px;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .q-card .question{font-size:25px;font-weight:900;line-height:1.18;letter-spacing:-.02em;margin:0}
    .q-card .entity-link{text-decoration-color:rgba(11,15,23,.45)}
    .q-card .entity-link:hover,.q-card .entity-link:focus{background:rgba(11,15,23,.07)}
    .answer-block{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px}
    .your-answer{font-size:14px;color:var(--muted);font-weight:600}
    .answer-value{background:transparent;color:var(--text);font-size:52px;font-weight:950;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;cursor:text;padding:0 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .answer-type{width:min(100%,300px);background:#0b1728;border:2px solid var(--player-color,#2e8cff);border-radius:16px;color:var(--text);font-size:38px;font-weight:950;text-align:center;padding:6px 12px;outline:none;font-variant-numeric:tabular-nums}
    .answer-type[hidden],.answer-value[hidden]{display:none}
    .answer-unit{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em;min-height:16px}
    .tape{position:relative;height:118px;margin:8px -16px 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
    .tape:active{cursor:grabbing}
    .tape:focus-visible{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
    .tape canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .tape-hint{text-align:center;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-top:6px}
    .done-btn{align-self:center;min-width:132px;background:#fff;color:#0b0f17;padding:15px 34px;border-radius:999px;font-weight:850;font-size:17px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.3)}
    .done-btn:disabled{opacity:.6}
    #targetValue{color:#2ee66b}
    .ui-dialog{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,7,15,.72);backdrop-filter:blur(6px);animation:fade .2s ease}
    .ui-dialog-card{width:min(100%,420px);max-height:calc(100% - 20px);overflow:auto;background:linear-gradient(180deg,#15263c,#0d1a2b);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
    .ui-dialog-card p{margin:0 0 16px;line-height:1.5;color:#c9d4e4;white-space:pre-line;font-size:15px}
    .ui-dialog-actions{display:flex;gap:10px;justify-content:flex-end}.ui-dialog-actions button{padding:12px 18px}
    body.ad-running #app{pointer-events:none}
    .version-tag{text-align:center;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:.1em}
    /* Pantallas bajas (iframe 16:9 de CrazyGames en escritorio, móvil en horizontal). */
    @media (max-height:640px){
      .phone{padding:10px 14px 12px}.screen{gap:9px}
      .hero{margin-top:2px;padding:0}.hero h2{font-size:28px;margin:4px 0 6px}.hero p{font-size:13px}
      .card.pad{padding:12px}.players-list{gap:6px;margin-top:4px}.field input,.field select{padding:9px 12px}.field label{font-size:10px}
      .rules{display:none}.online-card{margin-top:4px;padding:10px}.online-head{margin-bottom:6px}
      .primary,.secondary{padding:11px 16px}.ghost{padding:6px}
      .q-card{padding:14px 16px;min-height:0;border-radius:20px}.q-card .question{font-size:19px}
      .question-tip{margin-top:-4px;font-size:11px}.answer-block{margin-top:0}.your-answer{font-size:12px}
      .answer-value{font-size:36px}.answer-type{font-size:28px;padding:2px 10px}.tape{height:78px;margin-top:2px}.tape-hint{margin-top:2px;font-size:10px}
      .done-btn{padding:11px 30px;font-size:16px}
      .reveal-card{padding:12px}.target{font-size:28px}.reveal-scale{height:150px;margin-top:8px}.result-labels{margin-top:8px}.diffs{margin-top:6px}.diff{padding:6px}
      .winner h3{margin:8px 0 2px;font-size:17px}.winner p{margin:0;font-size:13px}.source{margin-top:6px}
      .final-card{padding:16px}.final-card h2{font-size:28px;margin:2px 0 4px}.final-card p{margin:6px 0}.statline{margin-top:8px}
      .lobby-code-card{padding:10px;gap:2px}.lobby-code b{font-size:38px}.lobby-list{gap:6px}.lobby-slot{min-height:40px;padding:7px 12px}
      .online-box{gap:10px}.online-box h3{font-size:22px}.code-input{font-size:36px;padding:8px 0 8px .3em}
      .wait-box{gap:14px}.wait-ticker{height:56px}.wait-ticker span{font-size:34px}
      .pass-card{padding:18px}.pass-icon{width:56px;height:56px;margin-bottom:10px;font-size:28px}
    }
    /* Horizontal y bajo (escritorio en CrazyGames): dos columnas para que todo quepa sin desplazar. */
    @media (max-height:640px) and (orientation:landscape){
      .phone{max-width:780px}
      #home.active{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"top top" "hero players" "online players" "start players" "how players";column-gap:16px;row-gap:8px;align-content:start}
      #home>.topbar{grid-area:top}#home>.hero{grid-area:hero}#home>.home-players{grid-area:players;margin-top:0!important;align-self:start}
      #home>.online-card{grid-area:online;align-self:start}#home>#startBtn{grid-area:start}#home>#howBtn{grid-area:how}
      #home>.rules,#home>.spacer,#home>.version-tag{display:none}
      .home-players .field label{display:none}.home-players .row .field label{display:block}
      .home-players .players-list{gap:5px}.home-players .field input{padding:8px 12px}.home-players .player-remove{height:36px}.home-players .add-player{margin-top:6px;padding:8px}
      .home-players .row{margin-top:6px!important}.home-players .row .field{flex-direction:row;align-items:center;gap:10px}.home-players .row select{padding:7px 10px}
      #lobby.active{display:grid;grid-template-columns:1fr 1.2fr;grid-template-rows:auto auto auto 1fr auto auto;grid-template-areas:"top top" "code list" "wait list" "rounds list" "start list" "host list";column-gap:16px;row-gap:8px;align-content:start}
      #lobby>.topbar{grid-area:top}#lobby>.lobby-code-card{grid-area:code}#lobby>.lobby-list{grid-area:list;align-self:start}#lobby>.lobby-waiting{grid-area:wait}
      #lobby>.spacer{display:none}#lobby>#lobbyRoundsWrap{grid-area:rounds;align-self:end}#lobby>#lobbyStart{grid-area:start}#lobby>#lobbyWaitHost{grid-area:host;align-self:end}
      .result-labels{display:none}.result-name-val{display:inline}
      .reveal-scale{height:120px}
    }
    .result-name-val{display:none}
    .winner h3{margin:14px 0 4px}.winner p{margin:0;color:var(--muted);line-height:1.4}
    @media (max-height:480px){
      .hero p,.hero .eyebrow{display:none}.hero h2{font-size:22px}
      .q-card .question{font-size:17px}.reveal-scale{height:110px}
    }
  </style>
</head>
<body>
<div id="app"><main class="phone">
  <section id="home" class="screen active fade">
    <div class="topbar"><div class="brand"><div class="logo"><div class="logo-mark"></div></div><div><h1>CIFRA</h1><p data-i18n="tagline">How close can you get?</p></div></div><div class="pill" id="playerCountPill">2 players</div></div>
    <div class="hero"><div class="eyebrow" data-i18n="heroEyebrow">local game</div><h2 data-i18n-html="heroTitle"></h2><p data-i18n="heroText"></p></div>
    <div class="card pad home-players" style="margin-top:14px">
      <div id="playersList" class="players-list">
      </div>
      <button type="button" class="add-player" id="addPlayerBtn">＋</button>
      <div class="row" style="margin-top:10px">
        <div class="field" style="width:100%"><label data-i18n="rounds">Rounds</label><select id="rounds"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option></select></div>
      </div>
    </div>
    <div class="rules"><div class="mini"><b>01</b><span data-i18n="rule1"></span></div><div class="mini"><b>02</b><span data-i18n="rule2"></span></div><div class="mini"><b>03</b><span data-i18n="rule3"></span></div></div>
    <div class="card pad online-card">
      <div class="online-head"><span class="online-dot"></span><b data-i18n="playOnline"></b><span data-i18n="playOnlineSub"></span></div>
      <div class="online-actions"><button type="button" class="secondary" id="createRoomBtn" data-i18n="createRoom"></button><button type="button" class="secondary" id="joinRoomBtn" data-i18n="joinRoom"></button></div>
    </div>
    <div class="spacer"></div>
    <button type="button" class="primary" id="startBtn" data-i18n="startGame"></button>
    <button type="button" class="ghost" id="howBtn" data-i18n="howToPlay"></button>
    <div class="version-tag">CIFRA · v1</div>
  </section>

  <section id="turn" class="screen">
    <div class="topbar"><div class="round-label" id="turnRound"></div><div class="pill" id="turnCategory"></div></div>
    <div class="turn-player"><span id="turnDot" class="turn-dot"></span><span id="turnPlayer"></span></div>
    <div class="turn-timer" id="turnTimer" hidden><span id="turnTimerText">1:00</span><div class="turn-timer-track"><i id="turnTimerBar"></i></div></div>
    <div class="q-card"><div class="question" id="turnQuestion"></div></div>
    <div class="question-tip" data-i18n="tapUnderlined"></div>
    <div class="answer-block">
      <div class="your-answer" data-i18n="yourAnswer"></div>
      <button type="button" id="answerValue" class="answer-value" data-i18n-aria="tapToType">0</button>
      <input id="answerInput" class="answer-type" type="text" inputmode="decimal" autocomplete="off" maxlength="20" enterkeyhint="done" data-i18n-aria="typeNumber" hidden>
      <div id="answerUnit" class="answer-unit"></div>
    </div>
    <div id="tape" class="tape" role="slider" tabindex="0" data-i18n-aria="rulerLabel"><canvas id="tapeCanvas"></canvas></div>
    <div class="tape-hint" data-i18n="rulerHint"></div>
    <div class="spacer"></div>
    <button type="button" class="done-btn" id="confirmBtn" data-i18n="done"></button>
  </section>

  <section id="pass" class="screen">
    <div class="spacer"></div>
    <div class="card pass-card fade"><div id="passIcon" class="pass-icon">↔</div><h3 id="passTitle"></h3><p id="passText"></p></div>
    <div class="spacer"></div><button type="button" class="primary" id="passBtn"></button>
  </section>

  <section id="reveal" class="screen">
    <div class="topbar"><div class="round-label" id="revealRound"></div></div>
    <div class="card reveal-card"><div class="reveal-head"><div><div class="target"><small data-i18n="correctAnswer"></small><span id="targetValue">0</span></div><div class="hint" id="targetLabel">—</div></div></div>
      <div class="result-labels" id="resultLabels"></div><div id="revealScale" class="reveal-scale">
        <div class="result-columns" id="resultColumns"></div>
      </div>
      <div class="diffs" id="resultDiffs"></div>
      <div class="winner"><h3 id="winnerTitle">—</h3><p id="winnerText">—</p></div>
      <div class="source"><span data-i18n="source"></span> <b id="sourceName">—</b><br><span id="sourceDate"></span></div>
    </div>
    <div class="spacer"></div><button type="button" class="primary" id="nextBtn"></button>
  </section>

  <section id="final" class="screen">
    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
    <div class="spacer"></div>
    <div class="card final-card fade"><div class="eyebrow" data-i18n="gameOver"></div><h2 id="finalTitle">🏆</h2><div class="winner-name" id="finalWinner">—</div><p id="finalSub">—</p><div class="scoreboard" id="finalScoreboard"></div><div class="statline"><span id="statQuestions"></span><span id="statRounds"></span><span id="statSource" data-i18n="officialData"></span></div></div>
    <div class="spacer"></div><div class="final-actions"><button type="button" class="primary" id="againBtn" data-i18n="playAgain"></button><button type="button" class="ghost" id="homeBtn" data-i18n="backHome"></button></div>
  </section>
  <section id="onlineName" class="screen">
    <div class="topbar"><button type="button" class="ghost" id="onlineNameBack" data-i18n="back"></button></div>
    <div class="spacer"></div>
    <div class="card pad online-box fade">
      <div class="eyebrow" data-i18n="onlineGame"></div>
      <h3 id="onlineNameTitle"></h3>
      <div class="field"><label for="onlineNameInput" data-i18n="yourName"></label><input id="onlineNameInput" maxlength="18" autocomplete="nickname" enterkeyhint="done" data-i18n-placeholder="namePlaceholder"></div>
      <p class="online-error" id="onlineNameError"></p>
      <p class="hint" data-i18n="privacyNote"></p>
      <button type="button" class="primary" id="onlineNameConfirm" data-i18n="confirm"></button>
    </div>
    <div class="spacer"></div>
  </section>

  <section id="onlineCode" class="screen">
    <div class="topbar"><button type="button" class="ghost" id="onlineCodeBack" data-i18n="back"></button></div>
    <div class="spacer"></div>
    <div class="card pad online-box fade">
      <div class="eyebrow" data-i18n="joinARoom"></div>
      <h3 data-i18n="roomCode"></h3>
      <input id="onlineCodeInput" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="····" data-i18n-aria="roomCode">
      <p class="online-error" id="onlineCodeError"></p>
      <button type="button" class="primary" id="onlineCodeConfirm" data-i18n="enter"></button>
    </div>
    <div class="spacer"></div>
  </section>

  <section id="lobby" class="screen">
    <div class="topbar"><button type="button" class="ghost" id="lobbyLeave" data-i18n="leave"></button><div class="pill" id="lobbyCount"></div></div>
    <div class="lobby-code-card">
      <span data-i18n="roomCode"></span>
      <button type="button" id="lobbyCodeBtn" class="lobby-code" data-i18n-aria="copyCode"><b id="lobbyCode">····</b></button>
      <small data-i18n="shareCode"></small>
      <button type="button" class="secondary" id="lobbyInvite" data-i18n="inviteFriends" hidden></button>
    </div>
    <div class="lobby-list" id="lobbyList"></div>
    <div class="lobby-waiting"><span class="lobby-spinner"></span><span data-i18n="waitingPlayers"></span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    <div class="spacer"></div>
    <div class="field" id="lobbyRoundsWrap"><label for="lobbyRounds" data-i18n="rounds"></label><select id="lobbyRounds"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option></select></div>
    <button type="button" class="primary" id="lobbyStart" data-i18n="begin"></button>
    <p class="lobby-wait-host" id="lobbyWaitHost" data-i18n="hostWillStart" hidden></p>
  </section>

  <section id="onlineWait" class="screen">
    <div class="topbar"><div class="round-label" id="waitRound"></div><button type="button" class="ghost" id="waitLeave" data-i18n="leaveShort"></button></div>
    <div class="spacer"></div>
    <div class="wait-box fade">
      <p class="wait-title" id="waitTitle" data-i18n="waitingOthers"></p>
      <div class="wait-ticker" id="waitTicker" aria-hidden="true"></div>
      <p class="wait-timer" id="waitTimer" hidden></p>
      <p class="wait-info" id="waitInfo"></p>
    </div>
    <div class="spacer"></div>
  </section>
</main></div>
<div id="entityModal" class="entity-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="entity-modal-card" role="document">
    <div class="entity-modal-kicker" data-i18n="whatIsIt"></div>
    <h3 id="entityModalTitle" class="entity-modal-title">—</h3>
    <p id="entityModalText" class="entity-modal-text">—</p>
    <div id="entityModalSource" class="entity-modal-source"></div>
    <button type="button" id="entityModalClose" class="entity-modal-close" data-i18n="close"></button>
  </div>
</div>

let contextQuestionText='';

function escapeHtml(s){return String(s).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));}
function contextCaseSensitive(name){
  const first=(name||'').trim().charAt(0);
  return /[A-ZÁÉÍÓÚÑÜ]/.test(first);
}
function CTX(){return getLang()==='en'?CONTEXT_INFO_EN:CONTEXT_INFO;}
function qText(item){return getLang()==='en'?item.textEn:item.text;}
function getContextInfo(name){
  const raw=CTX()[name];
  return typeof raw==='string' ? {text:raw} : raw;
}
function shouldMatchContextOccurrence(){return true;}
function renderQuestion(text){
  contextQuestionText=String(text||'');
  const candidates=Object.keys(CTX())
    .filter(n=>text.toLowerCase().includes(n.toLowerCase()))
    .sort((a,b)=>b.length-a.length);
  if(!candidates.length)return escapeHtml(text);

  const hits=[];
  const haystack=text.toLowerCase();
  for(const name of candidates){
    const needle=name.toLowerCase();
    let from=0;
    while(true){
      const idx=haystack.indexOf(needle,from);
      if(idx<0)break;
      const end=idx+needle.length;
      const before=idx>0?text[idx-1]:'';
      const after=end<text.length?text[end]:'';
      const isWordBoundary=(c)=>!c||!(/[\p{L}\p{N}]/u.test(c));
      const exactCase=!contextCaseSensitive(name)||text.slice(idx,end)===name;
      if(exactCase&&isWordBoundary(before)&&isWordBoundary(after)&&shouldMatchContextOccurrence(name,text,idx,end)){
        hits.push({idx,end,name});
      }
      from=idx+Math.max(1,needle.length);
    }
  }
  hits.sort((a,b)=>a.idx-b.idx||(b.end-b.idx)-(a.end-a.idx));
  const kept=[];
  for(const h of hits){
    if(kept.some(k=>h.idx<k.end&&h.end>k.idx)) continue;
    kept.push(h);
  }
  kept.sort((a,b)=>a.idx-b.idx);

  let out='',pos=0;
  for(const h of kept){
    // Si el nombre va entre comillas, las comillas van con él para que no queden sueltas al partir la línea.
    if(text[h.idx-1]==='«'&&text[h.end]==='»'&&h.idx-1>=pos){h.idx--;h.end++;}
    out+=escapeHtml(text.slice(pos,h.idx));
    const shown=text.slice(h.idx,h.end);
    out+=`<button type="button" class="entity-link" data-entity="${escapeHtml(h.name)}">${escapeHtml(shown)}</button>`;
    pos=h.end;
  }
  out+=escapeHtml(text.slice(pos));
  return out;
}
function openEntityModal(name){
  const info=getContextInfo(name); if(!info)return;
  const modal=el('entityModal'); if(!modal)return;
  el('entityModalTitle').textContent=name;
  el('entityModalText').textContent=info.text;
  el('entityModalSource').textContent=t('contextNote');
  modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
  el('entityModalClose')?.focus();
}
function closeEntityModal(){
  const modal=el('entityModal'); if(!modal)return;
  modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');
}

  if(a>=1e6) return `${trimNumber(v/1e6)}M`;

  if(Math.abs(v)<1 && v!==0) return Number(v).toFixed(2);
  return new Intl.NumberFormat(numberLocale(),{maximumFractionDigits:0,useGrouping:false}).format(v);
}
function trimNumber(v){
  return new Intl.NumberFormat(numberLocale(),{maximumFractionDigits:v<10?1:0,useGrouping:false}).format(v).replace(',0','');
}
function valueLabel(v,unit=''){
  // La cifra que está estimando el jugador siempre se muestra exacta. K/M se reservan para las marcas de escala.
  return fmt(v,unit);
}
function norm(item,value){
  const min=item.min,max=item.max;if(item.log){const lo=Math.max(min,1e-40),hi=Math.max(max,lo*1.0001),v=Math.max(value,lo);return (Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo));}
  return (value-min)/(max-min);
}
function denorm(item,t){
  const min=item.min,max=item.max;t=Math.min(1,Math.max(0,t));
  if(item.log){const lo=Math.max(min,1e-40),hi=Math.max(max,lo*1.0001);return Math.exp(Math.log(lo)+t*(Math.log(hi)-Math.log(lo)));}
  return min+t*(max-min);
}
function roundStep(v,step){return Math.round(v/step)*step;}
function currentScaleMax(){return state.scaleMax ?? state.current?.max ?? Math.max(100,state.current?.answer*1.25||100);}
function compactExact(v){
  v=Math.max(0,Math.round(v));
  if(v===0)return '0';
  if(v>=1e9 && v%1e9===0)return `${v/1e9}B`;
  if(v>=1e6 && v%1e6===0)return `${v/1e6}M`;
  if(v>=1e3 && v%1e3===0)return `${v/1e3}K`;
  // Fuera de esos hitos se conserva el entero exacto: 1001, 1002, 1003...
  return String(v);
}
function visualPct(v){
  if(v<=0)return 0;
  // Escala visual continua: conserva sensibilidad en cifras pequeñas y sigue creciendo
  // suavemente cuando entramos en miles, millones y más.
  const mag=Math.max(100, Math.pow(10,Math.ceil(Math.log10(Math.max(1,v)))));
  const t=Math.log10(v+1)/Math.log10(mag+1);
  return Math.max(1.5,Math.min(96,6+90*t));
}
function displayUnit(item){
  if(getLang()==='en')return item?.unitEn||t('units');
  const unit=item?.unit;
  const map={
    'goles/partido':'g/p',
    'latidos/min':'lpm',
    'batidos/s':'bat/s',
    'zancadas/s':'zanc/s',
    'huevos/día':'huevos/día',
    'km²':'km²'
  };
  return map[unit]||unit||t('units');
}
function fmtValue(v,item){
  if(item?.year)return String(Math.round(v));
  if(item?.dec)return new Intl.NumberFormat(numberLocale(),{maximumFractionDigits:item.dec,useGrouping:true}).format(v);
  return fmt(v);
}
// ───────── Regla deslizante ─────────
// La cifra se elige arrastrando una regla horizontal bajo un marcador fijo central.
// La zona a la izquierda del marcador se rellena con el color del jugador.
// Tocar la cifra grande permite escribirla a mano si se quiere un valor exacto.
const PLAYER_COLORS=['#2e8cff','#2ad276','#a066ff','#ff8a2a','#ff4f8b'];
const TICK_SPACING=11; // px entre marcas
const YEAR_MAX=2100, YEAR_START=0;
const ruler={vals:[],unit:1,pos:0,vel:0,raf:0,dragging:false,lastX:0,samples:[],lastIdx:-1,lastBuzz:0,color:PLAYER_COLORS[0],typed:null};

function niceStepDown(x){
  if(x<=1)return 1;
  const p=Math.pow(10,Math.floor(Math.log10(x)));
  const m=x/p;
  return (m>=5?5:m>=2?2:1)*p;
}
function buildRulerValues(item){
  // Todas las cifras se manejan como enteros de «unidad mínima» para evitar errores de coma flotante.
  if(item.year){
    ruler.unit=1;
    // De 10 en 10 hasta el año 1000, de 5 en 5 hasta 1500 y de 1 en 1 a partir de ahí.
    const vals=[];
    for(let v=0;v<1000;v+=10)vals.push(v);
    for(let v=1000;v<1500;v+=5)vals.push(v);
    for(let v=1500;v<=YEAR_MAX;v++)vals.push(v);
    return vals;
  }
  const unit=Math.pow(10,-(item.dec||0));
  ruler.unit=unit;
  const maxValue=Math.max(item.dec?1000:1e7,item.answer*10);
  const maxU=Math.round(maxValue/unit);
  const vals=[];let v=0;
  while(v<=maxU){
    vals.push(v);
    const step=niceStepDown(v*0.05);
    v=Math.floor(v/step)*step+step;
  }
  return vals;
}
function rulerValueAt(idx){return ruler.vals[Math.max(0,Math.min(ruler.vals.length-1,idx))]*ruler.unit;}
function rulerNearestIndex(value){
  const target=value/ruler.unit;let lo=0,hi=ruler.vals.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(ruler.vals[mid]<target)lo=mid+1;else hi=mid;}
  if(lo>0&&Math.abs(ruler.vals[lo-1]-target)<=Math.abs(ruler.vals[lo]-target))lo--;
  return lo;
}
function isMajorTick(idx){
  if(state.current?.year){const v=ruler.vals[idx];return v<1500?v%100===0:v%10===0;}
  const v=ruler.vals[idx];if(v===0)return true;
  const step=niceStepDown(v*0.05);
  return v%(step*10)===0;
}
function isMidTick(idx){
  if(state.current?.year){const v=ruler.vals[idx];return v<1500?v%50===0:v%5===0;}
  const v=ruler.vals[idx];const step=niceStepDown(v*0.05);
  return v%(step*5)===0;
}
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

function drawRuler(){
  const canvas=el('tapeCanvas');if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  const w=rect.width,h=rect.height;if(!w||!h)return;
  const dpr=window.devicePixelRatio||1;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const cx=w/2;
  const zeroX=cx-ruler.pos*TICK_SPACING;
  // Relleno a la izquierda del marcador (desde el inicio de la regla).
  const fillStart=Math.max(0,zeroX);
  if(cx>fillStart){ctx.fillStyle=hexToRgba(ruler.color,.30);ctx.fillRect(fillStart,0,cx-fillStart,h);}
  // Marcas
  const first=Math.max(0,Math.floor(ruler.pos-cx/TICK_SPACING)-1);
  const last=Math.min(ruler.vals.length-1,Math.ceil(ruler.pos+cx/TICK_SPACING)+1);
  const base=h-4;
  for(let i=first;i<=last;i++){
    const x=Math.round(zeroX+i*TICK_SPACING)+.5;
    const major=isMajorTick(i),mid=!major&&isMidTick(i);
    const th=major?h*.62:mid?h*.42:h*.30;
    ctx.strokeStyle=x<cx?'rgba(255,255,255,.85)':'rgba(255,255,255,.42)';
    ctx.lineWidth=major?2.5:2;
    ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x,base-th);ctx.stroke();
  }
  // Marcador central
  ctx.fillStyle=ruler.color;
  ctx.fillRect(cx-1.5,0,3,h);
}
function updateAnswerDisplay(){
  const item=state.current;if(!item)return;
  const value=ruler.typed!=null?ruler.typed:rulerValueAt(Math.round(ruler.pos));
  state.estimate=value;
  el('answerValue').textContent=fmtValue(value,item);
  const tape=el('tape');if(tape){tape.setAttribute('aria-valuenow',String(value));tape.setAttribute('aria-valuetext',fmtValue(value,item));}
}
function rulerTick(){
  const idx=Math.round(ruler.pos);
  if(idx!==ruler.lastIdx){
    ruler.lastIdx=idx;
    const now=performance.now();
    if(now-ruler.lastBuzz>45){ruler.lastBuzz=now;try{navigator.vibrate?.(3);}catch(_e){}}
  }
  updateAnswerDisplay();drawRuler();
}
function clampRulerPos(){
  const max=ruler.vals.length-1;
  if(ruler.pos<0){ruler.pos=0;ruler.vel=0;}
  if(ruler.pos>max){ruler.pos=max;ruler.vel=0;}
}
function stopRulerAnimation(){if(ruler.raf){cancelAnimationFrame(ruler.raf);ruler.raf=0;}}
function animateRuler(){
  stopRulerAnimation();
  let last=performance.now();
  const stepFn=now=>{
    const dt=Math.min(40,now-last);last=now;
    if(Math.abs(ruler.vel)>0.002){
      ruler.pos+=ruler.vel*dt;
      ruler.vel*=Math.pow(0.94,dt/16);
      clampRulerPos();rulerTick();
      ruler.raf=requestAnimationFrame(stepFn);return;
    }
    // Encaje suave en la marca más cercana
    const target=Math.round(ruler.pos);const d=target-ruler.pos;
    if(Math.abs(d)>0.01){ruler.pos+=d*Math.min(1,dt/60);rulerTick();ruler.raf=requestAnimationFrame(stepFn);return;}
    ruler.pos=target;ruler.raf=0;rulerTick();
  };
  ruler.raf=requestAnimationFrame(stepFn);
}
function setRulerFromValue(value){ruler.pos=rulerNearestIndex(value);ruler.lastIdx=Math.round(ruler.pos);}
function resetRuler(){
  const item=state.current;if(!item)return;
  stopRulerAnimation();
  ruler.vals=buildRulerValues(item);
  ruler.vel=0;ruler.typed=null;ruler.dragging=false;
  ruler.color=PLAYER_COLORS[state.turn%PLAYER_COLORS.length];
  setRulerFromValue(item.year?YEAR_START:0);
  closeTypedEntry(false);
  el('answerUnit').textContent=item.year?t('year'):displayUnit(item);
  document.documentElement.style.setProperty('--player-color',ruler.color);
  updateAnswerDisplay();
  requestAnimationFrame(drawRuler);
}
function bindRuler(){
  const tape=el('tape');if(!tape)return;
  tape.addEventListener('pointerdown',e=>{
    if(!state.current)return;
    closeTypedEntry(true);
    stopRulerAnimation();ruler.dragging=true;ruler.vel=0;ruler.typed=null;
    ruler.lastX=e.clientX;ruler.samples=[{x:e.clientX,t:performance.now()}];
    tape.setPointerCapture?.(e.pointerId);e.preventDefault();
  });
  tape.addEventListener('pointermove',e=>{
    if(!ruler.dragging)return;
    const dx=e.clientX-ruler.lastX;ruler.lastX=e.clientX;
    ruler.pos-=dx/TICK_SPACING;clampRulerPos();
    const now=performance.now();ruler.samples.push({x:e.clientX,t:now});
    while(ruler.samples.length>2&&now-ruler.samples[0].t>90)ruler.samples.shift();
    rulerTick();
  });
  const end=e=>{
    if(!ruler.dragging)return;ruler.dragging=false;
    const s=ruler.samples;const a=s[0],b=s[s.length-1];
    const dt=b&&a?b.t-a.t:0;
    ruler.vel=dt>0&&performance.now()-b.t<80?-((b.x-a.x)/dt)/TICK_SPACING:0;
    animateRuler();
  };
  tape.addEventListener('pointerup',end);tape.addEventListener('pointercancel',end);
  tape.addEventListener('wheel',e=>{
    if(!state.current)return;e.preventDefault();closeTypedEntry(true);ruler.typed=null;
    stopRulerAnimation();ruler.pos+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)/TICK_SPACING;clampRulerPos();rulerTick();animateRuler();
  },{passive:false});
  tape.addEventListener('keydown',e=>{
    const k={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:10,PageDown:-10}[e.key];
    if(!k)return;e.preventDefault();ruler.typed=null;stopRulerAnimation();
    ruler.pos=Math.round(ruler.pos)+k;clampRulerPos();rulerTick();
  });
  window.addEventListener('resize',drawRuler);
  // Escribir la cifra a mano
  el('answerValue')?.addEventListener('click',openTypedEntry);
  const input=el('answerInput');
  input?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();closeTypedEntry(true);}if(e.key==='Escape'){e.preventDefault();closeTypedEntry(false);}});
  input?.addEventListener('blur',()=>closeTypedEntry(true));
}
function parseTypedNumber(raw){
  let s=String(raw||'').replace(/\s/g,'');
  if(!s)return null;
  // Español: punto = miles y coma = decimales. Inglés: coma = miles y punto = decimales.
  if(getLang()==='es')s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/,/g,'');
  if(!/^\d+(?:\.\d+)?$/.test(s))return null;
  const v=Number(s);
  return Number.isFinite(v)&&v>=0&&v<=Number.MAX_SAFE_INTEGER?v:null;
}
function openTypedEntry(){
  const item=state.current;if(!item)return;
  const input=el('answerInput'),big=el('answerValue');
  stopRulerAnimation();
  input.value=item.year?String(Math.round(state.estimate)):'';
  input.placeholder=fmtValue(state.estimate,item);
  big.hidden=true;input.hidden=false;input.focus();
}
function closeTypedEntry(apply){
  const input=el('answerInput'),big=el('answerValue');
  if(!input||input.hidden)return;
  if(apply){
    const v=parseTypedNumber(input.value);
    if(v!==null){
      const item=state.current;
      const value=item?.dec?Number(v.toFixed(item.dec)):Math.round(v);
      ruler.typed=value;setRulerFromValue(value);
    }
  }
  input.hidden=true;big.hidden=false;
  updateAnswerDisplay();drawRuler();
}

const USED_QUESTIONS_KEY='cifra-used-questions-v46';
let usedQuestionsMemory=new Set();
function loadUsedQuestionIds(){
  try{const raw=localStorage.getItem(USED_QUESTIONS_KEY);if(raw===null)return new Set(usedQuestionsMemory);const arr=JSON.parse(raw);return new Set(Array.isArray(arr)?arr.map(Number).filter(Number.isFinite):[]);}catch(_e){return new Set(usedQuestionsMemory);}
}
function saveUsedQuestionIds(set){
  usedQuestionsMemory=new Set(set);
  try{localStorage.setItem(USED_QUESTIONS_KEY,JSON.stringify([...set]));}catch(_e){}
}
function pickDeck(){
  // El mazo de una partida se construye pregunta a pregunta. Así, si el ciclo
  // de preguntas termina en mitad de una partida, el siguiente turno
  // puede reiniciar automáticamente el banco y continuar sin bloquear la partida.
  state.deck=[];
}
function pickNextQuestion(){
  const pool=bank.filter(x=>state.category==='Todas'||x.category===state.category);
  if(!pool.length) throw new Error('No hay preguntas disponibles para esta categoría.');

  let used=loadUsedQuestionIds();
  // Limpiamos del historial cualquier ID que ya no pertenezca al banco actual.
  const validIds=new Set(pool.map(x=>x.id));
  used=new Set([...used].filter(id=>validIds.has(id)));

  let available=pool.filter(x=>!used.has(x.id));

  // CICLO AGOTADO: justo cuando se necesita la siguiente pregunta,
  // se vacía el historial y se vuelve a barajar todo el banco. Las preguntas
  // que ya han salido en esta misma partida no vuelven a salir en ella.
  if(!available.length){
    used.clear();
    saveUsedQuestionIds(used);
    const inThisGame=new Set(state.deck.filter(Boolean).map(x=>x.id));
    available=pool.filter(x=>!inThisGame.has(x.id));
    if(!available.length)available=pool.slice();
  }

  // Elegimos una pregunta aleatoria del conjunto todavía no utilizado.
  const index=Math.floor(Math.random()*available.length);
  const item=available[index];
  used.add(item.id);
  saveUsedQuestionIds(used);
  return item;
}
function resetEstimate(){
  const item=state.current;
  if(!item) throw new Error('No hay una pregunta disponible para esta ronda.');
  state.estimate=0;
}
function startRound(){
  if(!state.deck[state.idx]) state.deck[state.idx]=pickNextQuestion();
  if(!state.deck[state.idx]) throw new Error('No hay una pregunta disponible para esta ronda.');
  state.turn=0;
  state.answers=Array(state.players.length).fill(null);
  state.current=state.deck[state.idx];
  resetEstimate();updateTurnUI();el('confirmBtn').disabled=false;show('turn');resetRuler();
}
function startNextPlayerTurn(){
  if(!state.current || state.answers[state.turn-1]===null) throw new Error('La respuesta del jugador anterior no está fijada.');
  resetEstimate();updateTurnUI();el('confirmBtn').disabled=false;show('turn');resetRuler();
}
function updateTurnUI(){
  const item=state.current;
  el('turnRound').textContent=t('roundOf',{i:state.idx+1,n:state.rounds});
  el('turnCategory').textContent=categoryName(item.category);
  el('turnQuestion').innerHTML=renderQuestion(qText(item));
  el('turnPlayer').textContent=state.players[state.turn]||t('player',{n:state.turn+1});
  document.documentElement.style.setProperty('--player-color',PLAYER_COLORS[state.turn%PLAYER_COLORS.length]);
  const confirm=el('confirmBtn');
  if(confirm)confirm.disabled=false;
}
function confirmAnswer(){
  if(actionBusy)return;
  const btn=el('confirmBtn');
  if(btn?.disabled)return;
  actionBusy=true;
  try{
    closeTypedEntry(true);stopRulerAnimation();
    if(!ruler.typed&&ruler.typed!==0)ruler.pos=Math.round(ruler.pos);
    updateAnswerDisplay();
    const value=state.estimate;
    if(!Number.isFinite(value)||value<0)return;
    if(window.CifraOnline?.active){window.CifraOnline.submitAnswer(value);return;}
    if(!state.current || state.turn<0 || state.turn>=state.players.length) throw new Error('El turno actual no es válido.');
    state.estimate=value;
    state.answers[state.turn]=value;
    try{navigator.vibrate?.(35);}catch(_e){}
    if(btn)btn.disabled=true;
    if(state.turn < state.players.length-1){
      const currentName=state.players[state.turn];
      state.turn++;
      const nextName=state.players[state.turn];
      el('passTitle').textContent=t('passTitle');
      el('passText').textContent=t('passText',{next:nextName,cur:currentName});
      el('passBtn').textContent=t('continueWith',{name:nextName});
      el('passIcon').textContent='↔';
      show('pass');
    }else{
      showReveal();
    }
  }catch(err){
    console.error('Error al confirmar cifra:',err);
    uiAlert(`${t('errorConfirm')}\n\n${err?.message||t('unknownError')}`);
  }finally{
    actionBusy=false;
    if(document.getElementById('turn')?.classList.contains('active')){const c=el('confirmBtn');if(c)c.disabled=false;}
    else if(document.getElementById('pass')?.classList.contains('active')){const b=el('passBtn');if(b)b.disabled=false;}
    else if(document.getElementById('reveal')?.classList.contains('active')){const n=el('nextBtn');if(n)n.disabled=false;}
  }
}

function signedDiffLabel(estimate,target,item){
  const d=estimate-target;
  if(Math.abs(d)<1e-9)return t('nailedIt');
  return `${d>0?'+':'−'}${fmtValue(Math.abs(d),item.year?null:item)}`;
}
function sourceName(key){
  const src=SOURCES[key];if(!src)return '—';
  return getLang()==='en'?(SOURCES_EN[key]||src.name):src.name;
}
function resultColorClass(index){return `result-c${index%5}`;}
function showReveal(){
  const item=state.current;
  const target=item.answer;
  const diffs=state.players.map((_,i)=>Math.abs(state.answers[i]-target));
  const minDiff=Math.min(...diffs);
  const winners=diffs.map((d,i)=>d===minDiff?i:-1).filter(i=>i>=0);
  if(winners.length===1)state.scores[winners[0]]++;

  el('revealRound').textContent=t('roundOfLong',{i:state.idx+1,n:state.rounds});
  el('targetValue').textContent=`${item.approx?'≈ ':''}${fmtValue(target,item)}${item.year?'':' '+displayUnit(item)}`;
  el('targetLabel').textContent=qText(item);

  const count=state.players.length;
  const labels=el('resultLabels');
  const columns=el('resultColumns');
  const diffsEl=el('resultDiffs');
  const scale=el('revealScale');
  if(!labels||!columns||!diffsEl||!scale)throw new Error('No se ha podido construir el gráfico de resultados.');
  [labels,columns,diffsEl].forEach(node=>node.style.setProperty('--result-count',String(count)));
  scale.style.setProperty('--result-count',String(count));
  labels.innerHTML='';columns.innerHTML='';diffsEl.innerHTML='';
  const maxVal=Math.max(1,target,...state.answers);
  state.players.forEach((name,i)=>{
    const label=document.createElement('div');label.className='result-label';
    label.innerHTML=`<span class="result-player-name">${escapeHtml(name)}</span><span class="result-estimate">${escapeHtml(fmtValue(state.answers[i],item))}</span>`;
    labels.appendChild(label);

    const col=document.createElement('div');col.className='result-column';
    const bar=document.createElement('div');bar.className=`result-bar ${resultColorClass(i)}`;
    bar.style.height=`${Math.max(4,(state.answers[i]/maxVal)*100)}%`;
    const nm=document.createElement('div');nm.className='result-name';nm.textContent=name;
    const nv=document.createElement('span');nv.className='result-name-val';nv.textContent=` · ${fmtValue(state.answers[i],item)}`;nm.appendChild(nv);
    col.appendChild(bar);col.appendChild(nm);columns.appendChild(col);

    const diff=document.createElement('div');diff.className='diff';
    const diffName=document.createElement('span');diffName.textContent=name;
    const diffValue=document.createElement('strong');diffValue.textContent=signedDiffLabel(state.answers[i],target,item);
    diff.appendChild(diffName);diff.appendChild(diffValue);diffsEl.appendChild(diff);
  });

  if(winners.length===1){
    const nm=state.players[winners[0]];
    el('winnerTitle').textContent=t('roundWinner',{name:nm});
    el('winnerText').textContent=minDiff<1e-9?t('nailedExact'):t('missedBy',{diff:`${fmtValue(minDiff,item.year?null:item)} ${item.year?(minDiff===1?t('year'):t('years')):displayUnit(item)}`});
    if(minDiff<1e-9)window.CG?.happy();
  }else{
    const names=winners.map(i=>state.players[i]);
    el('winnerTitle').textContent=t('roundTie');
    el('winnerText').textContent=t('tieText',{names:joinNames(names)});
  }
  el('sourceName').textContent=sourceName(item.source);
  const note=getLang()==='en'?item.noteEn:item.note;
  el('sourceDate').textContent=note||(item.approx?t('roundedNote'):'');
  el('nextBtn').textContent=state.idx+1>=state.rounds?t('seeFinal'):t('nextRound');el('nextBtn').disabled=false;show('reveal');
}

let finishing=false;
function next(){
  if(window.CifraOnline?.active){window.CifraOnline.next();return;}
  if(finishing||actionBusy)return;
  const btn=el('nextBtn');
  finishing=true;
  actionBusy=true;
  if(btn)btn.disabled=true;
  try{
    if(state.idx+1>=state.rounds){
      window.CG?.gameplay(false);
      window.CG?.adBreak().then(()=>{try{showFinal();}catch(err){console.error(err);show('home');}});
      return;
    }else{
      state.idx++;
      startRound();
    }
    window.scrollTo?.(0,0);
  }catch(err){
    console.error('Error al continuar:',err);
    uiAlert(`${t('errorContinue')}\n\n${err?.message||t('unknownError')}`);
    // Recuperación dura: si algo falla, dejamos la partida en un estado jugable.
    if(document.getElementById('reveal')?.classList.contains('active')){
      if(btn)btn.disabled=false;
    }
  }finally{
    actionBusy=false;
    finishing=false;
    if(btn && document.getElementById('reveal')?.classList.contains('active'))btn.disabled=false;
  }
}

function launchConfetti(){
  const layer=el('confettiLayer');
  if(!layer)return;
  layer.innerHTML='';
  const pieces=90;
  const shapes=['#49a2ff','#55e99a','#ffd166','#ff6b8a','#b18cff','#ffffff'];
  for(let i=0;i<pieces;i++){
    const piece=document.createElement('span');
    piece.className='confetti-piece';
    piece.style.left=`${Math.random()*100}%`;
    piece.style.background=shapes[i%shapes.length];
    piece.style.width=`${6+Math.random()*7}px`;
    piece.style.height=`${8+Math.random()*9}px`;
    piece.style.setProperty('--dur',`${2.8+Math.random()*2.2}s`);
    piece.style.setProperty('--delay',`${Math.random()*0.45}s`);
    piece.style.setProperty('--drift',`${-140+Math.random()*280}px`);
    piece.style.setProperty('--rot',`${360+Math.random()*900}deg`);
    layer.appendChild(piece);
  }
  setTimeout(()=>{if(layer)layer.innerHTML='';},6000);
}
function showFinal(){
  const scoreboard=el('finalScoreboard');
  if(!scoreboard)throw new Error('No se ha encontrado el marcador final.');
  scoreboard.innerHTML='';
  scoreboard.style.setProperty('--player-count',String(state.players.length));
  state.players.forEach((name,i)=>{
    const card=document.createElement('div');card.className=`score ${resultColorClass(i).replace('result-','score-')}`;
    card.innerHTML=`<span class="name">${escapeHtml(name)}</span><b>${state.scores[i]}</b><span class="muted">${escapeHtml(t('roundsWon'))}</span>`;
    scoreboard.appendChild(card);
  });
  el('statQuestions').textContent=t('questionsStat',{n:bank.length});
  el('statRounds').textContent=t('roundsStat',{n:state.rounds});
  const top=Math.max(...state.scores);
  const leaders=state.players.map((name,i)=>i).filter(i=>state.scores[i]===top);
  let title=t('totalTie'),sub=t('tieSub'),win=t('evenGame');
  if(leaders.length===1){
    const i=leaders[0];title=t('gameFinished');win=state.players[i];sub=t('winsScore',{name:state.players[i],a:state.scores[i],b:Math.max(0,...state.scores.filter((_,j)=>j!==i))});
    if(state.scores[i]===state.rounds)sub+=t('perfectGame');
  }else{
    win=leaders.map(i=>state.players[i]).join(' · ');
    sub=t('tieAt',{n:top});
  }
  el('finalTitle').textContent=title;
  el('finalWinner').textContent=win;
  el('finalSub').textContent=sub;
  show('final');
  launchConfetti();
}

function syncHomePlayersUI(){
  const list=el('playersList');if(!list)return;
  list.innerHTML='';
  state.players.forEach((name,i)=>{
    const row=document.createElement('div');row.className='player-row';row.dataset.playerRow=String(i);
    const badge=document.createElement('span');badge.className='player-badge';badge.textContent=String(i+1);
    const field=document.createElement('div');field.className='field';
    const label=document.createElement('label');label.textContent=t('player',{n:i+1});
    const input=document.createElement('input');input.id=`p${i+1}Input`;input.maxLength=18;input.value=name;
    field.appendChild(label);field.appendChild(input);row.appendChild(badge);row.appendChild(field);
    if(i>=2){
      const remove=document.createElement('button');remove.type='button';remove.className='player-remove';remove.textContent='×';remove.setAttribute('aria-label',t('removePlayer',{n:i+1}));
      remove.addEventListener('click',()=>{state.players=readHomePlayers();state.players.splice(i,1);syncHomePlayersUI();});
      row.appendChild(remove);
    }
    list.appendChild(row);
  });
  const count=el('playerCountPill');if(count)count.textContent=t('players',{n:state.players.length});
  const add=el('addPlayerBtn');if(add){add.disabled=state.players.length>=5;add.textContent=state.players.length>=5?t('maxPlayers'):t('addPlayer');}
}
function readHomePlayers(){
  return state.players.map((fallback,i)=>{
    const input=el(`p${i+1}Input`);
    return (input?.value||fallback||t('player',{n:i+1})).trim()||t('player',{n:i+1});
  });
}
function bindGameControls(){
  state.players=[t('player',{n:1}),t('player',{n:2})];
  syncHomePlayersUI();
  const add=el('addPlayerBtn');
  add?.addEventListener('click',()=>{
    if(state.players.length>=5)return;
    state.players=readHomePlayers();
    state.players.push(t('player',{n:state.players.length+1}));
    syncHomePlayersUI();
    el(`p${state.players.length}Input`)?.focus();
  });
  const start=()=>{
    try{
      state.players=readHomePlayers();
      state.rounds=parseInt(el('rounds').value,10)||10;
      state.category='Todas';
      state.idx=0;state.scores=Array(state.players.length).fill(0);state.turn=0;state.current=null;state.answers=[];state.estimate=0;
      pickDeck();startRound();
    }catch(err){console.error('Error al comenzar la partida:',err);uiAlert(`${t('errorStart')}\n\n${err?.message||t('unknownError')}`);}
  };
  const bind=(id,fn)=>{const node=el(id);if(!node)return;node.addEventListener('click',e=>{e.preventDefault();fn(e);});};
  bind('startBtn',start);
  bind('confirmBtn',confirmAnswer);
  bindRuler();
  bind('passBtn',()=>{
    if(actionBusy)return;const b=el('passBtn');if(b?.disabled)return;actionBusy=true;if(b)b.disabled=true;
    try{startNextPlayerTurn();}catch(err){console.error(err);uiAlert(`${t('errorNextPlayer')}\n\n${err?.message||t('unknownError')}`);}
    finally{actionBusy=false;if(document.getElementById('pass')?.classList.contains('active')){if(b)b.disabled=false;}else if(document.getElementById('turn')?.classList.contains('active')){const c=el('confirmBtn');if(c)c.disabled=false;}}
  });
  bind('nextBtn',next);
  bind('againBtn',()=>{
    if(window.CifraOnline?.active){window.CifraOnline.again();return;}
    try{
      finishing=false;actionBusy=false;state.category='Todas';state.idx=0;state.turn=0;state.scores=Array(state.players.length).fill(0);state.current=null;state.answers=[];state.estimate=0;
      const confirm=el('confirmBtn');if(confirm)confirm.disabled=false;
      pickDeck();startRound();window.scrollTo?.(0,0);
    }catch(err){console.error(err);uiAlert(`${t('errorNewGame')}\n\n${err?.message||t('unknownError')}`);}
  });
  bind('homeBtn',()=>{
    if(window.CifraOnline?.active){window.CifraOnline.leave();return;}
    finishing=false;actionBusy=false;state.current=null;state.answers=[];
    const confirm=el('confirmBtn');if(confirm)confirm.disabled=false;
    syncHomePlayersUI();show('home');window.scrollTo?.(0,0);
  });
  bind('howBtn',()=>uiAlert(t('howToPlayText')));
};

function recoverUIFromUnexpectedError(){
  actionBusy=false;
  finishing=false;
  try{
    if(document.getElementById('turn')?.classList.contains('active')){
      const c=el('confirmBtn'); if(c)c.disabled=false;
    }else if(document.getElementById('pass')?.classList.contains('active')){
      const b=el('passBtn'); if(b)b.disabled=false;
    }else if(document.getElementById('reveal')?.classList.contains('active')){
      const n=el('nextBtn'); if(n)n.disabled=false;
    }
  }catch(_e){}
}
window.addEventListener('error',recoverUIFromUnexpectedError);
window.addEventListener('unhandledrejection',recoverUIFromUnexpectedError);

// Arranque: primero el SDK de CrazyGames (para saber el idioma), luego la interfaz.
async function boot(){
  try{await window.CG?.init();}catch(_e){}
  setLang(new URLSearchParams(location.search).get('lang')||window.CG?.locale()||(navigator.languages&&navigator.languages[0])||navigator.language);
  applyStaticTexts();
  bindGameControls();
  window.CifraOnline?.boot?.();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
</script>
