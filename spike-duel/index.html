<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spike Duel: Volleyball</title>
<meta name="description" content="Spike Duel is a fast 1v1 volleyball game: jump, spike and charge your super smash to beat 8 rivals or a friend on the same keyboard.">
<link rel="stylesheet" href="style.css?v=20261005c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0d1b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <button id="btnPause" class="iconBtn" aria-label="Pause">II</button>
  </div>

  <div id="touch" class="hidden">
    <div class="pad left">
      <button data-p="0" data-k="left" aria-label="Left"></button>
      <button data-p="0" data-k="right" aria-label="Right"></button>
      <button data-p="0" data-k="jump" class="jump p1jump" aria-label="Jump"></button>
    </div>
    <div class="pad right">
      <button data-p="1" data-k="left" class="p2" aria-label="Left"></button>
      <button data-p="1" data-k="right" class="p2" aria-label="Right"></button>
      <button data-p="0" data-k="jump" class="jump solojump" aria-label="Jump"></button>
      <button data-p="1" data-k="jump" class="jump p2" aria-label="Jump"></button>
    </div>
  </div>

  <div id="menu" class="screen hidden">
    <button id="btnControls" class="chip topleft hidden" data-t="controlsBtn"></button>
    <div class="logo"><span>SPIKE</span><span class="accent">DUEL</span></div>
    <div class="sub" data-t="tagline"></div>
    <div class="col">
      <button class="big career" id="btnCareer" data-t="career"></button>
      <button class="big" id="btnTour" data-t="tour"></button>
      <div class="row small">
        <button class="big alt" id="btn2p" data-t="twoPlayers"></button>
        <button class="big ghost" id="btnShop" data-t="shop"></button>
      </div>
      <div class="row small online">
        <button class="big alt" id="btnCreate" data-t="createRoom"></button>
        <button class="big alt" id="btnJoin" data-t="joinRoom"></button>
      </div>
    </div>
    <div class="topbar"><span class="coins"></span><button id="btnFull" class="iconBtn" aria-label="Fullscreen">&#x26F6;</button><button id="btnMute" class="iconBtn" aria-label="Sound"></button></div>
    <div class="hint" data-t="controls"></div>
  </div>

  <div id="tour" class="screen hidden">
    <h2 data-t="tour"></h2>
    <div class="note" id="tourNote"></div>
    <div class="grid" id="rivals"></div>
    <button class="ghost" data-back data-t="back"></button>
  </div>

  <div id="career" class="screen hidden">
    <h2 data-t="career"></h2>
    <div class="topbar"><span class="coins"></span></div>
    <div class="worldbar">
      <button class="iconBtn" id="worldPrev" aria-label="Previous world">&#9664;</button>
      <div id="worldName"></div>
      <button class="iconBtn" id="worldNext" aria-label="Next world">&#9654;</button>
    </div>
    <canvas id="careerMap"></canvas>
    <button class="ghost" data-back data-t="back"></button>
  </div>

  <div id="shop" class="screen hidden">
    <h2 data-t="shop"></h2>
    <div class="topbar"><span class="coins"></span></div>
    <div class="tabs"><button id="tabChars" class="tab on" data-t="characters"></button><button id="tabBalls" class="tab" data-t="balls"></button><button id="tabSupers" class="tab" data-t="supers"></button></div>
    <div class="grid" id="items"></div>
    <button class="ghost" data-back data-t="back"></button>
  </div>

  <div id="pause" class="screen dim hidden">
    <h2 data-t="paused"></h2>
    <div class="col">
      <button class="big" id="btnResume" data-t="resume"></button>
      <button class="big ghost" id="btnQuit" data-t="menu"></button>
    </div>
  </div>

  <div id="result" class="screen dim hidden">
    <h2 id="resTitle"></h2>
    <div id="resScore" class="score"></div>
    <div id="resCoins" class="coinsWon"></div>
    <div id="resNote" class="note"></div>
    <div class="row" id="rewardRow">
      <button class="big reward" id="btnDouble"></button>
      <button class="big ghost" id="btnNoThanks" data-t="noThanks"></button>
    </div>
    <div class="row" id="nextRow">
      <button class="big" id="btnNext"></button>
      <button class="big ghost" id="btnMenu" data-t="menu"></button>
    </div>
  </div>

  <div id="online" class="screen hidden">
    <h2 id="onTitle"></h2>
    <div id="onCode" class="roomcode"></div>
    <div class="row" id="onJoinRow"><input id="onInput" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD"><button class="big" id="btnJoinGo" data-t="join"></button></div>
    <div class="note" id="onNote"></div>
    <button class="ghost" id="btnOnBack" data-t="cancel"></button>
  </div>

  <div id="trophy" class="screen dim hidden">
    <canvas id="confetti"></canvas>
    <h2 data-t="champion"></h2>
    <canvas id="cup" width="320" height="320"></canvas>
    <div class="note" id="boxNote"></div>
    <div class="row hidden" id="boxes">
      <button class="box" data-i="0"><span class="lid"></span><span class="prize"></span></button>
      <button class="box" data-i="1"><span class="lid"></span><span class="prize"></span></button>
      <button class="box" data-i="2"><span class="lid"></span><span class="prize"></span></button>
    </div>
    <button class="big reward" id="btnClaim" data-t="claim"></button>
    <button class="big hidden" id="btnTrophyGo" data-t="cont"></button>
  </div>

  <div id="editor" class="hidden">
    <div class="panel">
      <h3 id="editorTitle"></h3>
      <div id="editorSliders"></div>
      <div class="row"><button class="ghost small" id="editorReset" data-t="reset"></button><button class="big small" id="editorDone" data-t="done"></button></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>
<div id="rotate"><div class="phone"></div><p data-t="rotate"></p></div>
<script src="sdk.js?v=20261005c"></script>
<script src="game.js?v=20261005c"></script>
<script>
  // Installable version only: CrazyGames serves its own wrapper.
  if ('serviceWorker' in navigator && !/crazygames/.test(location.hostname) && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
