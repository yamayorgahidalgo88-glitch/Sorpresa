<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Halloween</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:#000;font-family:"DejaVu Serif",Georgia,serif}
.shot{position:absolute;inset:0;opacity:0;overflow:hidden}
.shot svg{position:absolute;left:0;top:0;width:540px;height:960px}
.shot img.asset{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#vig{position:absolute;inset:0;pointer-events:none;z-index:50;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
#flash{position:absolute;inset:0;z-index:51;pointer-events:none;background:#fff;opacity:0}
#warm{position:absolute;inset:0;z-index:49;pointer-events:none;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 50% 55%,#ffcf6b 0%,#ff9a3c 35%,transparent 75%)}
#title{position:absolute;left:0;right:0;top:300px;z-index:60;text-align:center;color:#ff9a1f;font-weight:bold;font-size:58px;letter-spacing:1px;text-shadow:0 0 18px #ff6a00,0 0 40px #b33a00,0 4px 0 #3b1200;opacity:0}
#acct{position:absolute;left:0;right:0;top:400px;z-index:60;text-align:center;color:#ffe9b0;font:600 26px "DejaVu Sans",Arial,sans-serif;letter-spacing:3px;text-shadow:0 2px 10px #000;opacity:0}
.cur{display:inline-block;width:4px;height:50px;background:#ffb347;vertical-align:-6px;margin-left:4px}
</style>
</head>
<body>
<div id="stage">
  <div class="shot" id="s1"></div>
  <div class="shot" id="s2"></div>
  <div class="shot" id="s3"></div>
  <div class="shot" id="s4"></div>
  <div class="shot" id="s5"></div>
  <div class="shot" id="s6"></div>
  <div id="warm"></div>
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="black" style="position:absolute;inset:0;z-index:70;background:#000;opacity:1"></div>
  <div id="title"><span id="ttxt"></span><span class="cur" id="cur"></span></div>
  <div id="acct"></div>
</div>
<script>
// ---------- configuración ----------
const P = new URLSearchParams(location.search);
const ACCOUNT = P.get('cuenta') || '@tucuenta';
const DURATION = 21;
// imágenes opcionales por toma: assets/toma1.png ... toma6.png (las inyecta render.cjs)
window.ASSETS = window.ASSETS || {};

// ---------- utilidades ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k*k*(3-2*k);
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function rnd(seed){let s=seed;return()=>((s=(s*16807)%2147483647)/2147483647)}
const R=rnd(42);
function svg(vb,inner){return `<svg viewBox="${vb}" xmlns="${NS}">${inner}</svg>`}
function stars(n,w,h,maxY){let o='';for(let i=0;i<n;i++)o+=`<circle class="star" cx="${R()*w}" cy="${R()*maxY}" r="${.6+R()*1.4}" fill="#fff" opacity="${.3+R()*.6}"/>`;return o}

// ---------- personajes ----------
const vampire = `
<g id="vamp">
  <g id="vlegL"><rect x="-9" y="-30" width="9" height="30" fill="#111"/><rect x="-11" y="-4" width="13" height="5" fill="#000"/></g>
  <g id="vlegR"><rect x="1" y="-30" width="9" height="30" fill="#111"/><rect x="-1" y="-4" width="13" height="5" fill="#000"/></g>
  <path d="M-26 -88 L26 -88 L40 -14 L-40 -14 Z" fill="#7a0c1c"/>
  <path d="M-16 -88 L16 -88 L18 -32 L-18 -32 Z" fill="#14141c"/>
  <path d="M-22 -92 L-10 -112 L0 -92 L10 -112 L22 -92 Z" fill="#7a0c1c"/>
  <circle cx="0" cy="-110" r="17" fill="#e9e2dc"/>
  <path d="M-18 -112 Q-16 -134 0 -132 Q16 -134 18 -112 Q8 -122 0 -118 Q-8 -122 -18 -112Z" fill="#0a0a0f"/>
  <circle cx="-6" cy="-110" r="2.2" fill="#c01"/><circle cx="6" cy="-110" r="2.2" fill="#c01"/>
  <path d="M-5 -100 Q0 -96 5 -100" stroke="#600" stroke-width="1.5" fill="none"/>
  <path d="M-3 -99 l1.5 5 l1.5 -5 M1 -99 l1.5 5 l1.5 -5" fill="#fff"/>
</g>`;

function pumpkin(x,y,s,id){return `<g class="pump" data-i="${id}" transform="translate(${x} ${y}) scale(${s})">
 <ellipse cx="0" cy="-16" rx="60" ry="46" fill="#ff8a1c" opacity=".16" class="pglow"/>
 <ellipse cx="0" cy="-16" rx="26" ry="22" fill="#e86a00"/><ellipse cx="-12" cy="-16" rx="14" ry="22" fill="#f58a1a"/><ellipse cx="12" cy="-16" rx="14" ry="22" fill="#f58a1a"/>
 <rect x="-3" y="-42" width="6" height="9" fill="#3d5a1e"/>
 <path d="M-14 -22 l8 0 l-4 -8z M6 -22 l8 0 l-4 -8z M-12 -8 l6 5 l6 -4 l6 4 l6 -5 l-2 8 l-10 2 l-10 -2z" fill="#ffe27a"/></g>`}

const witch = `
<g id="witch">
  <path d="M-110 360 Q-120 150 -60 120 L60 120 Q120 150 110 360Z" fill="#2a1646"/>
  <path d="M-60 120 L0 200 L60 120Z" fill="#3b2063"/>
  <circle cx="0" cy="40" r="68" fill="#f3d2b0"/>
  <path d="M-70 36 Q-86 130 -56 150 Q-52 90 -60 56Z M70 36 Q86 130 56 150 Q52 90 60 56Z" fill="#4a2410"/>
  <ellipse cx="-62" cy="46" rx="9" ry="12" fill="#f3d2b0"/><ellipse cx="62" cy="46" rx="9" ry="12" fill="#f3d2b0"/>
  <ellipse cx="-24" cy="30" rx="8" ry="10" fill="#2b1a10"/><ellipse cx="24" cy="30" rx="8" ry="10" fill="#2b1a10"/>
  <circle cx="-21" cy="26" r="3" fill="#fff"/><circle cx="27" cy="26" r="3" fill="#fff"/>
  <circle cx="-40" cy="56" r="10" fill="#ff8f8f" opacity=".5"/><circle cx="40" cy="56" r="10" fill="#ff8f8f" opacity=".5"/>
  <path d="M-30 60 Q0 96 30 60 Q0 74 -30 60Z" fill="#9b1d2b"/><path d="M-22 64 Q0 80 22 64 Q0 70 -22 64Z" fill="#fff"/>
  <path d="M-92 -4 Q0 -34 92 -4 L84 14 Q0 -12 -84 14Z" fill="#241040"/>
  <path d="M-62 -6 Q-10 -150 38 -300 Q46 -150 62 -6Z" fill="#2f1658"/>
  <path d="M-62 -6 Q0 -24 62 -6 L60 8 Q0 -8 -60 8Z" fill="#ff8a1c"/>
  <rect x="-10" y="-14" width="20" height="18" fill="none" stroke="#ffd35a" stroke-width="4" transform="rotate(-3)"/>
</g>`;

// ---------- toma 1 : colegio de noche ----------
(function(){
  let win='';
  for(let r=0;r<3;r++)for(let c=0;c<6;c++){
    const lit=(r*7+c*3)%11===0;
    win+=`<rect x="${58+c*70}" y="${430+r*70}" width="26" height="38" fill="${lit?'#d9a441':'#10101c'}" opacity="${lit?.55:1}"/>`;
  }
  const pumps=[[80,830,1.1,0],[170,880,.8,1],[420,840,1.0,2],[480,900,1.3,3],[350,905,.7,4]].map(p=>pumpkin(...p)).join('');
  $('s1').innerHTML = svg('0 0 540 960',`
  <defs><linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04040c"/><stop offset=".6" stop-color="#171030"/><stop offset="1" stop-color="#2a1a3a"/></linearGradient>
  <radialGradient id="moonG"><stop offset="0" stop-color="#fff8dc"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></radialGradient></defs>
  <g id="cam1">
  <rect width="540" height="960" fill="url(#sky1)"/>
  ${stars(60,540,960,420)}
  <circle cx="400" cy="170" r="110" fill="url(#moonG)" opacity=".35"/><circle cx="400" cy="170" r="46" fill="#fff4cf"/>
  <path d="M30 760 L30 440 L270 330 L510 440 L510 760Z" fill="#0b0b18"/>
  <rect x="236" y="250" width="68" height="130" fill="#0b0b18"/><path d="M230 252 L270 196 L310 252Z" fill="#0b0b18"/>
  <circle cx="270" cy="296" r="20" fill="#d9c98a" opacity=".5"/>
  ${win}
  <rect x="236" y="620" width="68" height="140" fill="#05050a"/><rect x="268" y="622" width="4" height="138" fill="#ffb347" opacity=".7"/>
  <rect x="0" y="760" width="540" height="200" fill="#0a0912"/>
  <path d="M250 760 L290 760 L420 960 L120 960Z" fill="#14121f"/>
  ${pumps}
  <g id="mist"><ellipse cx="150" cy="800" rx="200" ry="26" fill="#9aa" opacity=".08"/><ellipse cx="400" cy="830" rx="220" ry="30" fill="#9aa" opacity=".08"/></g>
  <g id="vwrap" transform="translate(-40 790)">${vampire}</g>
  </g>`);
})();

// ---------- toma 2 : mano llamando ----------
(function(){
  let planks='';for(let i=0;i<7;i++)planks+=`<rect x="${i*78}" y="0" width="76" height="960" fill="${i%2?'#3b2414':'#33200f'}"/><rect x="${i*78+30}" y="0" width="2" height="960" fill="#1b0f06" opacity=".6"/>`;
  $('s2').innerHTML = svg('0 0 540 960',`
  <defs><radialGradient id="lamp" cx=".2" cy=".15" r=".9"><stop offset="0" stop-color="#ffb04a" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".0"/></radialGradient></defs>
  <g id="door2"><rect width="540" height="960" fill="#26150a"/>${planks}
  <rect x="60" y="120" width="420" height="300" fill="none" stroke="#150a04" stroke-width="10"/><rect x="60" y="520" width="420" height="320" fill="none" stroke="#150a04" stroke-width="10"/>
  <circle cx="430" cy="500" r="16" fill="#8a6a2a"/><circle cx="430" cy="500" r="9" fill="#c9a24a"/>
  <rect width="540" height="960" fill="url(#lamp)"/></g>
  <g id="fist" transform="translate(0 0)">
    <path d="M-30 640 L-20 470 L120 470 L130 650Z" transform="translate(150 140)" fill="#0c0c12"/>
    <rect x="118" y="598" width="170" height="30" fill="#f1f1ee" transform="rotate(-6 200 610)"/>
    <rect x="156" y="470" width="190" height="150" rx="38" transform="translate(0 0)" fill="#e6c3a4"/>
    <g fill="#d8b190"><rect x="174" y="478" width="34" height="82" rx="16"/><rect x="214" y="472" width="34" height="86" rx="16"/><rect x="254" y="472" width="34" height="86" rx="16"/><rect x="294" y="480" width="34" height="78" rx="16"/></g>
    <g fill="#e9c9ad"><rect x="176" y="462" width="30" height="42" rx="15"/><rect x="216" y="456" width="30" height="44" rx="15"/><rect x="256" y="456" width="30" height="44" rx="15"/><rect x="296" y="464" width="30" height="40" rx="15"/></g>
    <rect x="150" y="530" width="48" height="34" rx="17" fill="#e0b995"/>
  </g>
  <circle id="impact" cx="270" cy="500" r="10" fill="none" stroke="#ffd9a0" stroke-width="5" opacity="0"/>`);
})();

// ---------- toma 3 : puerta y silueta ----------
(function(){
  $('s3').innerHTML = `
  <div id="bg3" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#1a1f33 0%,#07080f 60%,#000 100%)"></div>
  ${svg('0 0 540 960',`
    <defs><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f93c9" stop-opacity=".35"/><stop offset="1" stop-color="#7f93c9" stop-opacity="0"/></linearGradient></defs>
    <path d="M150 100 L390 100 L540 960 L0 960Z" fill="url(#beam)" opacity=".5"/>
    <g id="sil" transform="translate(270 900)">
      <path d="M-26 -560 Q-4 -640 18 -560 Q22 -520 8 -490 L40 -470 Q130 -400 150 -170 L120 -170 Q100 -330 60 -400 L48 -120 L60 0 L8 0 L0 -130 L-8 0 L-60 0 L-48 -120 L-60 -400 Q-100 -330 -120 -170 L-150 -170 Q-130 -400 -40 -470 L-8 -490 Q-22 -520 -26 -560Z" fill="#000" stroke="#232744" stroke-width="3"/>
    </g>`)}
  <div id="door3" style="position:absolute;left:0;top:0;width:540px;height:960px;transform-origin:0 50%;background:linear-gradient(90deg,#1c1008,#2c190c 40%,#1c1008);border-right:10px solid #0d0703;box-shadow:inset 0 0 60px #000">
    <div style="position:absolute;left:60px;top:110px;width:390px;height:300px;border:8px solid #120a05"></div>
    <div style="position:absolute;left:60px;top:500px;width:390px;height:330px;border:8px solid #120a05"></div>
    <div style="position:absolute;right:40px;top:470px;width:30px;height:30px;border-radius:50%;background:#b8913c"></div>
  </div>
  <div id="beat" style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#5a0010 100%);opacity:0;mix-blend-mode:multiply"></div>`;
})();

// ---------- toma 4 : se acerca, entra la luz, eres tú ----------
(function(){
  $('s4').innerHTML = `
  <div id="bg4" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#ffd77a 0%,#ff9a3c 45%,#7a2e0f 100%)"></div>
  ${svg('0 0 540 960',`
    <g id="sil4" transform="translate(270 900) scale(1)"><path d="M-26 -560 Q-4 -640 18 -560 Q22 -520 8 -490 L40 -470 Q130 -400 150 -170 L120 -170 Q100 -330 60 -400 L48 -120 L60 0 L8 0 L0 -130 L-8 0 L-60 0 L-48 -120 L-60 -400 Q-100 -330 -120 -170 L-150 -170 Q-130 -400 -40 -470 L-8 -490 Q-22 -520 -26 -560Z" fill="#000"/></g>
    <g id="w4" transform="translate(270 360)" opacity="0">${witch}</g>
    <g id="spark">${Array.from({length:14},(_,i)=>`<path class="sp" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5Z" fill="#fff4b0" transform="translate(${40+R()*460} ${100+R()*760})" opacity="0"/>`).join('')}</g>`)}`;
})();

// ---------- toma 5 : clase iluminada ----------
function kid(x,y,col,kind,i){
  const cards=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff'];
  const hat = kind==='pumpkin'?`<rect x="-3" y="-60" width="6" height="12" fill="#3d5a1e"/>`
    : kind==='cat'?`<path d="M-17 -44 L-14 -64 L-5 -50Z M17 -44 L14 -64 L5 -50Z" fill="#222"/>`
    : kind==='witch'?`<path d="M-26 -42 L26 -42 L4 -46 L0 -100 L-4 -46Z" fill="#4a2a7a"/>`
    : kind==='ghost'?`<path d="M-24 -10 Q-24 -62 0 -62 Q24 -62 24 -10Z" fill="#fff" opacity="0"/>`:'';
  return `<g class="kid" data-i="${i}" transform="translate(${x} ${y})">
    <ellipse cx="0" cy="62" rx="40" ry="8" fill="#000" opacity=".2"/>
    <path d="M-34 60 Q-34 0 0 0 Q34 0 34 60Z" fill="${col}"/>
    <circle cx="0" cy="-22" r="24" fill="${kind==='ghost'?'#fff':'#f1c9a5'}"/>
    ${hat}
    <circle cx="-8" cy="-24" r="3" fill="#222"/><circle cx="8" cy="-24" r="3" fill="#222"/>
    <path d="M-9 -12 Q0 -2 9 -12Z" fill="#a22"/>
    <g class="card" transform="translate(0 28)"><rect x="-20" y="-24" width="40" height="52" rx="5" fill="${cards[i%4]}" stroke="#fff" stroke-width="3"/><path d="M0 -12 L4 -2 L14 -2 L6 5 L9 15 L0 9 L-9 15 L-6 5 L-14 -2 L-4 -2Z" fill="#fff"/></g>
    <circle cx="-32" cy="40" r="8" fill="#f1c9a5"/><circle cx="32" cy="40" r="8" fill="#f1c9a5"/>
  </g>`}
(function(){
  let bunt='';for(let i=0;i<9;i++)bunt+=`<path d="M${i*64+4} 20 L${i*64+60} 20 L${i*64+32} 70Z" fill="${['#ff8a1c','#6a2fb0','#222'][i%3]}"/>`;
  $('s5').innerHTML = svg('0 0 540 960',`
  <rect width="540" height="960" fill="#f4dba8"/><rect x="0" y="640" width="540" height="320" fill="#b97b44"/>
  ${[0,1,2,3,4,5].map(i=>`<rect x="0" y="${650+i*55}" width="540" height="3" fill="#8b5a2b"/>`).join('')}
  <path d="M0 18 Q270 90 540 18" stroke="#3a2a1a" stroke-width="3" fill="none"/>
  <g transform="translate(0 6)">${bunt}</g>
  <rect x="50" y="150" width="440" height="230" rx="8" fill="#2f5d46" stroke="#b97b44" stroke-width="12"/>
  <text x="270" y="230" text-anchor="middle" fill="#f4f4ea" font-size="46" font-family="DejaVu Sans" opacity=".85">¡Hola, brujitos!</text>
  <text x="270" y="300" text-anchor="middle" fill="#f4f4ea" font-size="30" font-family="DejaVu Sans" opacity=".6">ABC · 123 · 🎃</text>
  <circle cx="470" cy="470" r="38" fill="#ffd9a0" stroke="#7a4a1c" stroke-width="5"/><path d="M470 470 L470 446 M470 470 L488 478" stroke="#333" stroke-width="4"/>
  ${pumpkin(80,640,.9,5)}${pumpkin(470,640,.8,6)}
  ${kid(110,680,'#ff8a1c','pumpkin',0)}${kid(270,730,'#444','cat',1)}${kid(430,690,'#7a3fc0','witch',2)}
  ${kid(190,850,'#eee','ghost',3)}${kid(360,870,'#c2410c','pumpkin',4)}
  <g id="ja"><text class="ja" x="90" y="560" font-size="30" font-weight="bold" fill="#e11d48" font-family="DejaVu Sans">¡Ja ja!</text><text class="ja" x="340" y="580" font-size="30" font-weight="bold" fill="#7c3aed" font-family="DejaVu Sans">¡Jiji!</text><text class="ja" x="220" y="610" font-size="34" font-weight="bold" fill="#ea580c" font-family="DejaVu Sans">¡Jajaja!</text></g>
  <rect width="540" height="960" fill="#ffd88a" opacity=".12"/>`);
})();

// ---------- toma 6 : la cámara asciende ----------
(function(){
  let bats='';for(let i=0;i<5;i++)bats+=`<path class="bat" data-i="${i}" d="M-16 0 Q-8 -12 0 0 Q8 -12 16 0 Q8 -4 0 6 Q-8 -4 -16 0Z" fill="#050509"/>`;
  let win='';for(let r=0;r<3;r++)for(let c=0;c<5;c++)win+=`<rect x="${52+c*86}" y="${1210+r*70}" width="40" height="46" fill="${(r+c)%2?'#ffd88a':'#e9a94a'}"/>`;
  $('s6').innerHTML = svg('0 0 540 960',`
  <defs><linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03030a"/><stop offset=".55" stop-color="#1a1036"/><stop offset="1" stop-color="#3a1f40"/></linearGradient>
  <radialGradient id="moon6"><stop offset="0" stop-color="#fff8dc"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></radialGradient></defs>
  <g id="cam6">
    <rect width="540" height="1500" fill="url(#sky6)"/>
    ${stars(110,540,1500,900)}
    <circle cx="380" cy="300" r="150" fill="url(#moon6)" opacity=".35"/><circle cx="380" cy="300" r="62" fill="#fff4cf"/>
    <g id="bats">${bats}</g>
    <path d="M0 1030 L0 1180 L540 1180 L540 1030 L270 940Z" fill="#0b0b18"/>
    <rect x="0" y="1180" width="540" height="320" fill="#0b0b18"/>
    ${win}
    <rect x="20" y="1170" width="500" height="12" fill="#150f2a"/>
    ${[40,150,280,400,490].map((x,i)=>pumpkin(x,1190,.55+(i%2)*.1,10+i)).join('')}
    <rect x="236" y="720" width="68" height="130" fill="#0b0b18"/><path d="M230 722 L270 666 L310 722Z" fill="#0b0b18"/>
    <rect x="0" y="1200" width="540" height="300" fill="#f4dba8" opacity="0"/>
  </g>`);
})();

// ---------- imágenes opcionales por toma ----------
// sin toma6 propia, el cierre reutiliza la toma 1 subiendo hacia la luna
if(window.ASSETS[1]&&!window.ASSETS[6]) window.ASSETS[6]=window.ASSETS[1];
for(const [k,src] of Object.entries(window.ASSETS)){
  const el=$('s'+k); if(!el) continue;
  const im=document.createElement('img'); im.className='asset'; im.src=src; im.id='asset'+k; el.prepend(im);
  // se ocultan los dibujos; se mantienen las capas de efecto (latido, etc.)
  el.querySelectorAll('svg,#door3,#bg3,#bg4').forEach(n=>n.style.display='none');
}

// ---------- línea de tiempo ----------
const TITLE='Feliz Halloween';
const knocks=[3.35,4.05,4.75];
const shots=[
  {id:'s1',a:0,b:3},{id:'s2',a:3,b:6},{id:'s3',a:6,b:9},{id:'s4',a:9,b:12},{id:'s5',a:12,b:17},{id:'s6',a:17,b:DURATION}
];
const nodes={};document.querySelectorAll('[id]').forEach(n=>nodes[n.id]=n);
function tf(el,v){el&&el.setAttribute('transform',v)}

window.render=function(t){
  // visibilidad: cortes secos en 3 y 6, fundidos de 0,3 s en 9, 12 y 17 (cada toma tapa a la anterior)
  for(const [i,s] of shots.entries()){
    const fi=(s.a===9||s.a===12||s.a===17)?.3:.001;
    nodes[s.id].style.opacity = (t>=s.a&&t<s.b+.3) ? clamp((t-s.a)/fi) : 0;
    nodes[s.id].style.zIndex = i;
  }
  const has=k=>!!window.ASSETS[k];
  // ----- toma 1 -----
  { const k=prog(t,0,3), e=ease(k);
    if(has(1)){ const a=nodes.asset1; a.style.transformOrigin='50% 45%'; a.style.transform=`scale(${1.04+.16*e}) translateY(${-10*e}px)`; }
    else{
      const x=lerp(-40,262,e), scale=lerp(1,1.35,e), bob=Math.sin(k*60)*3;
      tf(nodes.vwrap,`translate(${x} ${790+bob+e*26}) scale(${scale})`);
      const sw=Math.sin(k*60)*14; tf(nodes.vlegL,`rotate(${sw} -4 -30)`); tf(nodes.vlegR,`rotate(${-sw} 5 -30)`);
      tf(nodes.cam1,`translate(${-(270*.08)*k} ${-30*k}) scale(${1+.08*k}) translate(0 0)`);
      nodes.cam1.setAttribute('transform',`translate(270 700) scale(${1+.12*k}) translate(-270 -700)`);
      document.querySelectorAll('#s1 .pump').forEach(p=>{
        const f=.75+.25*Math.sin(t*9+ +p.dataset.i*2.1)+.1*Math.sin(t*23+ +p.dataset.i);
        p.querySelector('.pglow').setAttribute('opacity',(.12+.16*f).toFixed(3));
      });
      nodes.mist.setAttribute('transform',`translate(${Math.sin(t*.6)*18} 0)`);
    }
  }
  // ----- toma 2 -----
  { const lt=t-3; let kick=0,ring=0,flash=0;
    for(const kt of knocks){ const d=t-kt; if(d>=0&&d<.35){ kick=Math.max(kick,Math.exp(-d*14)); ring=Math.max(ring,d/.35); flash=Math.max(flash,Math.exp(-d*22)); } }
    // la mano se adelanta antes del golpe
    let reach=0; for(const kt of knocks){ const d=kt-t; if(d>0&&d<.18) reach=Math.max(reach,1-d/.18); }
    if(has(2)){ const a=nodes.asset2; a.style.transformOrigin='60% 45%';
      a.style.transform=`translate(${kick*(((t*1000)|0)%2?7:-7)}px,${kick*3}px) scale(${1.06+.08*prog(t,3,6)+.03*kick})`; }
    else{
      tf(nodes.fist,`translate(${-reach*22+kick*10} ${Math.sin(t*3)*2}) scale(${1+.02*lt})`);
      tf(nodes.door2,`translate(${kick*(((t*1000)|0)%2?4:-4)} 0)`);
      nodes.impact.setAttribute('r',10+ring*110); nodes.impact.setAttribute('opacity',(ring>0&&ring<1?(1-ring)*.8:0));
    }
    nodes.flash.style.opacity = (t>=3&&t<6)?(flash*.18):0;
  }
  // ----- toma 3 -----
  { const k=prog(t,6,9);
    if(has(3)){ const a=nodes.asset3; a.style.transformOrigin='50% 50%';
      // de la oscuridad aparece la silueta, la cámara se acerca despacio
      a.style.transform=`scale(${1.02+.14*ease(k)})`;
      a.style.filter=`brightness(${lerp(.25,1,ease(prog(t,6.2,7.8)))}) saturate(.85)`; }
    else{
      const open=ease(prog(t,6.0,8.3));
      nodes.door3.style.transform=`perspective(900px) rotateY(${-open*78}deg)`;
      nodes.door3.style.opacity = 1-prog(t,8.4,8.8);
      const sa=ease(prog(t,7.0,7.9));
      nodes.sil.setAttribute('opacity',sa);
      tf(nodes.sil,`translate(270 ${lerp(960,900,ease(k))}) scale(${lerp(.82,1.02,ease(k))})`);
    }
    // latido ~ 1.1 s
    const ph=((t-6)%1.05)/1.05; const b=Math.max(Math.exp(-Math.pow((ph-.05)*18,2)),.7*Math.exp(-Math.pow((ph-.25)*18,2)));
    nodes.beat.style.opacity = (t>=6&&t<9)? (b*.85):0;
  }
  // ----- toma 4 -----
  { const k=prog(t,9,12);
    if(has(4)){ const a=nodes.asset4; a.style.transformOrigin='50% 35%';
      // arranca en sombra y la luz cálida la revela
      const lightK=ease(prog(t,9.1,10.4));
      a.style.transform=`scale(${lerp(1.25,1.02,ease(prog(t,9,11.2)))})`;
      a.style.filter=`brightness(${lerp(.05,1,lightK)}) contrast(${lerp(1.6,1,lightK)})`; }
    else{
      const near=ease(prog(t,9,10.6));
      const lightK=ease(prog(t,9.2,10.4));
      nodes.bg4.style.opacity=lightK;
      tf(nodes.sil4,`translate(270 ${lerp(900,1100,near)}) scale(${lerp(1,2.1,near)})`);
      const sOp = 1-ease(prog(t,10.0,10.9)); nodes.sil4.setAttribute('opacity',sOp);
      const wk=ease(prog(t,10.2,11.1)); nodes.w4.setAttribute('opacity',wk);
      const wob=Math.sin(t*5)*3;
      tf(nodes.w4,`translate(270 ${340+(1-wk)*60+wob}) scale(${lerp(.85,1.05,wk)})`);
      document.querySelectorAll('#s4 .sp').forEach((s,i)=>{
        const o=clamp(Math.sin((t*2.2+i*.7))*1.3)*ease(prog(t,10.4,11));
        s.setAttribute('opacity',Math.max(0,o));
      });
    }
    // el tono cambia: de frío a cálido
    nodes.warm.style.opacity = (t>=9&&t<12.5) ? ease(prog(t,9.2,10.4))*.35*(1-prog(t,11.5,12.5)) : 0;
  }
  // ----- toma 5 -----
  { const k=prog(t,12,17);
    nodes.s5.style.transform=`scale(${1+.05*k})`;
    // con imagen apaisada: barrido de la profe a los niños
    if(has(5)) nodes.asset5.style.objectPosition=`${lerp(8,92,ease(k))}% 50%`;
    document.querySelectorAll('#s5 .kid').forEach(g=>{
      const i=+g.dataset.i, base=g.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\)/);
      const bx=+base[1], by=+base[2];
      const hop=Math.abs(Math.sin(t*5+i*1.3))*14;
      g.setAttribute('transform',`translate(${bx} ${by}) translate(0 ${-hop})`);
      const card=g.querySelector('.card'); const sx=Math.cos(t*3.2+i);
      card.setAttribute('transform',`translate(0 28) scale(${sx>=0?Math.max(.15,sx):Math.max(.15,-sx)} 1) rotate(${Math.sin(t*4+i)*8})`);
    });
    document.querySelectorAll('#s5 .pump').forEach(p=>p.querySelector('.pglow').setAttribute('opacity',.1+.08*Math.sin(t*8+ +p.dataset.i)));
    document.querySelectorAll('#s5 .ja').forEach((x,i)=>{
      const ph=((t*1.1+i*.37)%1.2)/1.2; x.setAttribute('opacity',ph<.15?ph/.15:(ph<.75?1:Math.max(0,1-(ph-.75)/.25)));
      x.setAttribute('transform',`translate(0 ${-ph*34})`);
    });
  }
  // ----- toma 6: asciende -----
  { const k=prog(t,17,21), e=ease(k);
    const camY=lerp(-540,0,e);
    if(has(6)){ const a=nodes.asset6; a.style.transformOrigin='50% 0';
      // grúa: de la puerta del cole sube hasta la luna
      a.style.transform=`translateY(${lerp(-560,0,e)}px) scale(1.6)`;
      a.style.filter=`brightness(${lerp(.95,.75,e)})`; }
    else{
      nodes.cam6.setAttribute('transform',`translate(0 ${camY})`);
      document.querySelectorAll('#s6 .bat').forEach(b=>{
        const i=+b.dataset.i, x=((t*40+i*140)%640)-50, y=300+i*90+Math.sin(t*3+i)*24-540*0+camY*0+ (camY*0);
        const fl=Math.sin(t*18+i)>0?1:.55;
        b.setAttribute('transform',`translate(${x} ${y}) scale(${1.1+i*.1} ${fl})`);
      });
      document.querySelectorAll('#s6 .star').forEach((s,i)=>s.setAttribute('opacity',(.35+.5*Math.abs(Math.sin(t*1.5+i))).toFixed(2)));
    }
  }
  // ----- texto máquina de escribir -----
  { const t0=17.9, per=.09; const n=clamp(Math.floor((t-t0)/per)+1,0,TITLE.length);
    nodes.ttxt.textContent=TITLE.slice(0,t<t0?0:n);
    nodes.title.style.opacity=t>=17.8?1:0;
    nodes.cur.style.visibility = (t>=17.8 && (Math.floor(t*2.5)%2===0 || t<t0+per*TITLE.length)) ? 'visible':'hidden';
    const a=ease(prog(t,19.7,20.4)); nodes.acct.textContent=ACCOUNT; nodes.acct.style.opacity=a;
    nodes.acct.style.transform=`translateY(${(1-a)*14}px)`;
    // el título se mueve con el aire, y la cuenta aparece debajo
    nodes.title.style.transform=`translateY(${Math.sin(t*2)*3}px)`;
  }
  // fundido de entrada y salida a negro
  nodes.black.style.opacity = Math.max(1-clamp(t/.4), clamp((t-(DURATION-.4))/.4));
};
window.render(0);
</script>
</body>
</html>
