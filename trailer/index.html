<style>
:root{--bg:#0d0814;--fg:#fff;--accent:#ffb347;--muted:#c9b8d9}

html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

 background:radial-gradient(ellipse at 50% 0%,#3a1450 0%,transparent 60%),radial-gradient(ellipse at 50% 100%,#5a2a10 0%,transparent 55%),var(--bg)}

</head>
