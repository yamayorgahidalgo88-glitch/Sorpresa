<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14173a">
<title>Batalla de Bestias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#16142e;--gold:#ffd84a;--p:#3d8bfd;--e:#ff4d5e;--panel1:#5b4a98;--panel2:#33285f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14173a;font-family:'Lilita One',system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
img{-webkit-user-drag:none}
.o{-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.hide{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;will-change:transform}
.lbl .st{font-size:11px;line-height:11px;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;letter-spacing:-1px;height:11px}
.lbl .hp{position:relative;width:42px;height:7px;background:#3a2330;border:2px solid var(--ink);border-radius:5px;overflow:hidden}
.lbl .hp i{position:absolute;left:0;top:0;bottom:0;background:#5be06a;transition:width .12s}
.lbl.e .hp i{background:#ff5470}
.lbl .hp b{position:absolute;left:0;top:0;bottom:0;background:#ffcf8a;z-index:1;opacity:.95}
.lbl .en{width:32px;height:4px;background:rgba(22,20,46,.6);border-radius:3px;overflow:hidden;border:1px solid var(--ink)}
.lbl .en i{display:block;height:100%;background:var(--gold);width:0}
.lbl.full .en i{background:#fff;box-shadow:0 0 6px #fff}
.lbl .sx{position:absolute;top:-16px;font-size:14px;display:none}
.lbl.stun .sx{display:block}
.ft{position:absolute;transform:translate(-50%,-50%);font-size:16px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;animation:ft .8s ease-out forwards;pointer-events:none}
.ft.e{color:#ffe1e1}.ft.heal{color:#7dff8a}.ft.big{font-size:22px;color:var(--gold)}.ft.sup{font-size:18px;color:#fff3a0}
@keyframes ft{0%{opacity:0;margin-top:6px;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-38px;scale:1}}

/* ---------- HUD batalla ---------- */
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:5;pointer-events:none}
.side{display:flex;align-items:center;gap:6px;background:rgba(22,20,46,.6);padding:5px 10px;border-radius:14px;border:2px solid rgba(22,20,46,.7)}
.side .nm{font-size:15px}
.pips{display:flex;gap:4px}.pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid var(--ink)}
.side.p .pips i.on{background:var(--p);box-shadow:0 0 6px var(--p)}.side.e .pips i.on{background:var(--e);box-shadow:0 0 6px var(--e)}
#mid{display:flex;flex-direction:column;align-items:center;gap:3px}
#roundLbl{font-size:18px}
.mini{pointer-events:auto;background:rgba(22,20,46,.6);border:2px solid var(--ink);color:#fff;border-radius:10px;font-size:12px;padding:2px 8px;font-family:inherit;cursor:pointer}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom) + 10px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#hint{font-size:13px;background:rgba(22,20,46,.65);padding:5px 12px;border-radius:12px;text-align:center;max-width:460px;min-height:26px}
#panel{pointer-events:auto;width:100%;max-width:480px;background:linear-gradient(var(--panel1),var(--panel2));border:3px solid var(--ink);border-radius:22px;padding:10px 8px 8px;box-shadow:0 6px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2)}
#shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;background:radial-gradient(circle at 50% 35%,#fff6e8,#e9d3b0);border:3px solid var(--ink);border-radius:14px;height:122px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:var(--ink);touch-action:none;cursor:grab;transition:transform .12s,filter .2s;box-shadow:0 4px 0 var(--ink);overflow:visible}
.card:active{transform:translateY(2px)}
.card img{position:absolute;top:6px;left:50%;transform:translateX(-50%);height:76px;max-width:92%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.card .band{width:100%;background:var(--fam);border-top:3px solid var(--ink);border-radius:0 0 10px 10px;text-align:center;padding:2px 2px 3px}
.card .nm{font-size:15px;line-height:16px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap}
.card .role{font:700 9.5px system-ui,sans-serif;color:rgba(22,20,46,.85);line-height:11px}
.card .cost{position:absolute;top:-9px;left:-9px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6b8ff,#c04dff 55%,#7a1fb0);border:3px solid var(--ink);display:grid;place-items:center;font-size:17px;color:#fff;z-index:2}
.card .up{position:absolute;top:4px;right:4px;background:var(--gold);color:var(--ink);font-size:12px;padding:1px 6px;border-radius:9px;border:2px solid var(--ink);z-index:2}
.card .inf{position:absolute;top:30px;right:4px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);color:var(--ink);font-size:13px;display:grid;place-items:center;z-index:3;cursor:pointer}
.card.poor{filter:grayscale(.85) brightness(.85)}
.card.empty{background:rgba(22,20,46,.35);border-style:dashed;box-shadow:none;justify-content:center;color:rgba(255,255,255,.55);font-size:14px;cursor:default}
.card.fresh{animation:deal .35s ease-out backwards}
.card:nth-child(2).fresh{animation-delay:.06s}.card:nth-child(3).fresh{animation-delay:.12s}
@keyframes deal{from{transform:translateY(40px) scale(.7);opacity:0}}
#row{display:flex;align-items:center;gap:8px;margin-top:10px}
#elixir .drop{width:44px;height:44px;background:radial-gradient(circle at 35% 30%,#f6b8ff,#c04dff 55%,#7a1fb0);border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:21px;box-shadow:0 0 12px rgba(192,77,255,.6)}
#elixir.bump .drop{animation:bump .3s}#elixir.no .drop{animation:shake .3s}
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{border:3px solid var(--ink);border-radius:14px;font:inherit;color:#fff;padding:9px 10px;font-size:15px;cursor:pointer;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.35);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;line-height:1.05;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn small{display:block;font-size:11px}
.btn.blue{background:linear-gradient(#69b8ff,#2f7de1)}.btn.green{background:linear-gradient(#86e866,#3fae2a)}.btn.gold{background:linear-gradient(#ffd863,#f0a020)}.btn.red{background:linear-gradient(#ff7a7a,#d93a4a)}.btn.gray{background:linear-gradient(#b7b7c9,#77778f)}.btn.purple{background:linear-gradient(#b48cff,#7a4fe0)}
.btn:disabled{filter:grayscale(1) brightness(.85);cursor:default}
#ready{flex:1;font-size:19px}
#reroll{min-width:70px}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;font-size:clamp(34px,10vw,58px);opacity:0}
#banner.show{animation:ban 1.5s ease-out forwards}
#banner.win{color:#ffe36b}#banner.lose{color:#ff8b8b}
@keyframes ban{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#ghost{position:fixed;left:0;top:0;width:90px;height:90px;object-fit:contain;pointer-events:none;z-index:20;display:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}

/* ---------- paneles ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(14,12,36,.6);backdrop-filter:blur(3px)}
.box{width:min(92vw,420px);background:linear-gradient(var(--panel1),var(--panel2));border:4px solid var(--ink);border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2)}
.box h1{margin:0;font-size:clamp(40px,12vw,60px);font-weight:400;line-height:1}
.box .score{font-size:40px;margin:6px 0 16px}
.box .btns{display:flex;gap:10px;justify-content:center}.box .btns .btn{font-size:20px;padding:11px 18px}
#info{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;background:rgba(14,12,36,.4);padding:0 10px calc(env(safe-area-inset-bottom) + 12px)}
#info .sheet{width:100%;max-width:480px;background:linear-gradient(#fffaf0,#efdcb8);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.3);margin-bottom:6px}
.ihead{display:flex;gap:10px;align-items:center}
.ihead img{width:84px;height:84px;object-fit:contain;background:radial-gradient(#fff,#e8d4ac);border:3px solid var(--ink);border-radius:16px;padding:4px}
.iname{font-size:24px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.itags{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}
.itags span{font:700 11px system-ui,sans-serif;background:#d8c49b;border:2px solid var(--ink);border-radius:8px;padding:1px 6px;color:var(--ink)}
.istars{color:#e8a400;font-size:18px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.istats{display:flex;gap:6px;margin:10px 0 6px}
.istats div{flex:1;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:5px 4px;text-align:center;font:700 12px system-ui,sans-serif}
.istats div b{display:block;font:400 17px 'Lilita One',system-ui}
.idesc{font:600 13.5px/1.4 system-ui,sans-serif;margin:6px 2px}
.idesc em{font-style:normal;color:#8a6a2a;font-size:12px}
.ibtns{display:flex;gap:8px;margin-top:10px}.ibtns .btn{flex:1}

/* ---------- pantallas (menú, bestiario, ficha) ---------- */
.page{position:fixed;inset:0;z-index:20;overflow:hidden auto;touch-action:pan-y;background:#14173a}
.page::before{content:"";position:fixed;inset:-30px;background:url(assets/tablero.webp) center/cover;filter:blur(10px) brightness(.45) saturate(1.2);z-index:-1}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 20px);min-height:100%;display:flex;flex-direction:column}
#home .wrap{justify-content:center;align-items:center;text-align:center;gap:14px}
.logo{font-size:clamp(42px,13vw,66px);line-height:.95;color:var(--gold);margin:0;font-weight:400}
.logo small{display:block;font-size:13px;color:#d8d2ff;-webkit-text-stroke:0;margin-top:8px;letter-spacing:.5px}
.heroes{display:flex;align-items:flex-end;justify-content:center;gap:0;margin:6px 0 2px;height:200px}
.heroes img{height:150px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5));animation:bob 3s ease-in-out infinite}
.heroes img:nth-child(2){height:190px;animation-delay:-1s;margin:0 -12px;z-index:1}.heroes img:nth-child(3){animation-delay:-2s}
@keyframes bob{50%{transform:translateY(-8px)}}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,86vw)}
.menu .btn{font-size:26px;padding:14px}
.menu .btn small{font-size:12px;margin-top:2px;-webkit-text-stroke:2px var(--ink)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{margin:0;font-weight:400;font-size:30px;flex:1}
.bar .btn{padding:7px 12px}
.count{font-size:14px;background:rgba(22,20,46,.6);border-radius:10px;padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bcard{position:relative;border:3px solid var(--ink);border-radius:18px;background:radial-gradient(circle at 50% 40%,#fff6e8,#d9c09a);height:200px;cursor:pointer;box-shadow:0 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.bcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.bcard img{position:absolute;left:50%;top:8px;transform:translateX(-50%);height:140px;max-width:94%;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}
.bcard .band{background:var(--fam);border-top:3px solid var(--ink);text-align:center;padding:4px 4px 6px;position:relative}
.bcard .nm{font-size:20px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.bcard .lv{position:absolute;top:8px;left:8px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:1px 8px;font-size:13px}
.bcard.locked{filter:grayscale(1) brightness(.5)}
.note{font:600 12.5px/1.4 system-ui,sans-serif;color:#cfc8f5;text-align:center;margin-top:16px}
#viewer{position:relative;height:min(48vh,440px);touch-action:none;cursor:grab;margin:0 -14px}
#viewer .plat{position:absolute;left:50%;bottom:7%;width:62%;height:16%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,216,74,.45),rgba(255,216,74,.12) 60%,transparent);box-shadow:0 0 0 3px rgba(255,216,74,.5) inset}
#viewer img{position:absolute;left:50%;bottom:13%;transform:translateX(-50%) scaleX(var(--m,1));transform-origin:50% 100%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.45));pointer-events:none}
#viewer .tip{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:13px;color:#e6e0ff;opacity:.85}
.views{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;margin:0 -2px;touch-action:pan-x;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{flex:0 0 auto;width:62px;height:62px;border-radius:14px;border:3px solid var(--ink);background:radial-gradient(#fff6e8,#d9c09a);padding:4px;cursor:pointer}
.views button.on{outline:3px solid var(--gold)}
.views img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.dpanel{background:linear-gradient(#fffaf0,#efdcb8);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.dpanel .ihead{justify-content:space-between}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#14173a;font-size:24px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="battleHud" class="hide">
  <div id="top">
    <div class="side p"><span class="nm o">Tú</span><div class="pips" id="pipsP"><i></i><i></i><i></i></div></div>
    <div id="mid"><div id="roundLbl" class="o">Ronda 1</div><div style="display:flex;gap:4px"><button class="mini" id="exit">🏠 Menú</button><button class="mini" id="mute">🔊</button></div></div>
    <div class="side e"><div class="pips" id="pipsE"><i></i><i></i><i></i></div><span class="nm o">Rival</span></div>
  </div>
  <div id="banner" class="o"></div>
  <div id="bottom">
    <div id="hint"></div>
    <div id="panel">
      <div id="shop"><div class="card" data-i="0"></div><div class="card" data-i="1"></div><div class="card" data-i="2"></div></div>
      <div id="row">
        <div id="elixir"><div class="drop o" id="elixirNum">6</div></div>
        <button class="btn blue" id="reroll">↻<small>Gratis</small></button>
        <button class="btn green" id="ready">¡A luchar!</button>
      </div>
    </div>
  </div>
</div>
<img id="ghost" alt="">
<div id="info" class="hide"><div class="sheet" id="sheet"></div></div>

<!-- MENÚ PRINCIPAL -->
<div id="home" class="page">
  <div class="wrap">
    <h1 class="logo o">BATALLA DE<br>BESTIAS<small>(nombre provisional)</small></h1>
    <div class="heroes"><img src="assets/bolab_pose.webp" alt=""><img src="assets/bushi_front.webp" alt=""><img src="assets/ogul_pose.webp" alt=""></div>
    <div class="menu">
      <button class="btn green" id="goBattle">⚔️ Batalla<small>Duelo contra la máquina</small></button>
      <button class="btn purple" id="goBestiary">📖 Bestiario<small>Tus criaturas</small></button>
    </div>
  </div>
</div>

<!-- BESTIARIO -->
<div id="bestiary" class="page hide">
  <div class="wrap">
    <div class="bar"><button class="btn gray" data-back="home">←</button><h2 class="o">Bestiario</h2><span class="count" id="bcount"></span></div>
    <div class="grid" id="bgrid"></div>
    <p class="note">Toca una criatura para verla en grande y girarla.</p>
  </div>
</div>

<!-- FICHA DE CRIATURA -->
<div id="detail" class="page hide">
  <div class="wrap">
    <div class="bar"><button class="btn gray" data-back="bestiary">←</button><h2 class="o" id="dName"></h2><span class="count" id="dLevel"></span></div>
    <div id="viewer"><div class="plat"></div><img id="vA" alt=""><img id="vB" alt=""><div class="tip">↔ Desliza para girar · ↕ para verla desde arriba o abajo</div></div>
    <div class="views" id="views"></div>
    <div class="dpanel" id="dInfo"></div>
  </div>
</div>

<div id="end" class="overlay hide">
  <div class="box">
    <h1 class="o" id="endTitle">¡VICTORIA!</h1>
    <div class="score o" id="endScore">3 - 1</div>
    <div class="btns"><button class="btn gray" id="endMenu">Menú</button><button class="btn green" id="again">Revancha</button></div>
  </div>
</div>
<div id="loading" class="o">Cargando…</div>

<script>
'use strict';
/* =========================================================
   DATOS
   ========================================================= */
// Estadísticas y habilidades PROVISIONALES: las definirá el diseñador.
const CHARS = {
  bushi: {
    name: 'Bushi', cost: 3, role: 'Luchador', color: '#2fbf86', hp: 600, atk: 75, range: 1, as: 0.95, ms: 0.6, abil: 'super',
    abilName: 'Tajo de jade', desc: 'Súper: un tajo giratorio de su espada de jade golpea a todos los enemigos a su alrededor.',
    h: 1.2, front: 'front', card: 'front', pose: 'pose',
    turn: [['front', 0], ['q', -45], ['bq', -135], ['back', 180]], up: 'top', down: 'bottom',
    all: ['pose', 'front', 'q', 'bq', 'back', 'top', 'bottom'],
  },
  bolab: {
    name: 'Bolab', cost: 2, role: 'Tanque', color: '#f08a2c', hp: 950, atk: 45, range: 1, as: 1.3, ms: 1.0, abil: 'clash',
    abilName: 'Coraza de lava', desc: 'Clash: al empezar el combate se cubre con una coraza de roca volcánica (35% de su vida).',
    h: 1.15, front: 'front', card: 'front', pose: 'pose',
    turn: [['front', 0], ['q', -45], ['side', -90], ['back', 180]], up: 'top', down: 'bottom',
    all: ['pose', 'front', 'q', 'side', 'back', 'top', 'fronttop', 'bottom'],
  },
  ogul: {
    name: 'Ogul', cost: 4, role: 'Mago', color: '#8b4fd8', hp: 400, atk: 70, range: 3, as: 1.5, ms: 0.8, abil: 'super', proj: '#ff7a4a',
    abilName: 'Ojo estelar', desc: 'Súper: su ojo lanza un orbe de energía que estalla y daña a los enemigos de alrededor.',
    h: 1.5, front: 'front', card: 'front', pose: 'pose', float: true,
    turn: [['front', 0], ['q', -45], ['side', -90], ['back', 180]], up: 'top', down: 'frontbottom',
    all: ['pose', 'front', 'q', 'side', 'back', 'top', 'top2', 'frontbottom'],
  },
};
const VIEW_NAMES = { pose: 'Pose', front: 'Frente', q: '3/4', bq: '3/4 espalda', side: 'Perfil', back: 'Espalda', top: 'Arriba', top2: 'Arriba 2', bottom: 'Abajo', fronttop: 'Abajo frente', frontbottom: 'Abajo frente' };
const TYPES = Object.keys(CHARS);
const COLS = 5, ROWS = 8, MAX_UNITS = 7, WIN_ROUNDS = 3, ROUND_CAP = 40, ELIXIR_CAP = 20;
const LVL_MULT = [0, 1, 1.6, 2.4];
const FRONT_ROLES = ['Tanque', 'Luchador'];
// Tablero: imagen y las 4 esquinas de la rejilla 5x8 (en píxeles de la imagen)
const BOARD = { src: 'assets/tablero.webp', w: 962, h: 1024, corners: [[280, 267], [694, 266], [742, 780], [225, 781]] };
const src = (t, v) => `assets/${t}_${v}.webp`;

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);

function solveHomography(dst) {

const canvas = $('#c'), ctx = canvas.getContext('2d');
let W = 0, Hs = 0, dpr = 1, S = 1, OX = 0, OY = 0, tileMax = 60;
const FR = {}; // fotogramas escalados: FR[tipo][vista] = {cv, white, w, h, k}

function imgToScreen(x, y) { return [OX + x * S, OY + y * S]; }
function gridToScreen(gx, gy) { const [x, y] = apply(Hm, gx / COLS, 1 - gy / ROWS); return imgToScreen(x, y); }

function downscale(img, tw, th) {

  while (cw / 2 > tw) {
    const c = document.createElement('canvas'); c.width = Math.ceil(cw / 2); c.height = Math.ceil(ch / 2);
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, c.width, c.height);
    cur = c; cw = c.width; ch = c.height;
  }
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(tw)); c.height = Math.max(1, Math.round(th));
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, c.width, c.height);
  return c;
}

  const x = c.getContext('2d'); x.drawImage(cv, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  return c;
}

  const topH = $('#top').offsetHeight || 60, botH = $('#bottom').offsetHeight || 230;
  const availH = Hs - topH - botH;
  const [x0, x1] = [225, 742], [y0, y1] = [267 - 95, 781];
  S = Math.min(W * 0.94 / (x1 - x0), availH * 0.98 / (y1 - y0));
  OX = W / 2 - (x0 + x1) / 2 * S;
  OY = topH + availH / 2 - (y0 + y1) / 2 * S;
  tileMax = tileW(0.5);
  for (const t of TYPES) {
    FR[t] = {};
    const ch = CHARS[t], fh = IMG[t + '_' + ch.front].height;
    const k = ch.h * tileMax * 1.12 / fh; // px de pantalla por px de imagen (tamaño máximo)
    for (const [v] of ch.turn) {
      const im = IMG[t + '_' + v], cv = downscale(im, im.width * k * dpr, im.height * k * dpr);
      FR[t][v] = { cv, white: whiteOf(cv), w: im.width, h: im.height };

}
// elige la vista dibujada según hacia dónde mira la criatura (0 = de frente a la cámara)

   ========================================================= */
let parts = [], fxs = [], shake = 0;
function burstAt(gx, gy, h, color, n = 10, o = {}) {
  const [x, y] = gridToScreen(gx, gy), tw = tileW(gy), base = y - h * tw;
  for (let i = 0; i < n; i++) {
    const sp = (o.spd ?? 2) * tw;
    parts.push({ x: x + rand(-.15, .15) * tw, y: base, vx: rand(-1, 1) * sp, vy: -rand(0.3, 1) * (o.up ?? 2) * tw, life: (o.life ?? .6) * rand(.7, 1.2), max: 1, color, size: (o.size ?? .07) * tw * rand(.7, 1.3), g: (o.g ?? 6) * tw, glow: o.glow });
    parts[parts.length - 1].max = parts[parts.length - 1].life;
  }
}
function updateParts(dt) {
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of fxs) f.t += dt;
  fxs = fxs.filter(f => f.t < f.dur);
}
function drawParts() {
  for (const p of parts) {
    const k = p.life / p.max;

    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.5, p.size * (.4 + .6 * k)), 0, Math.PI * 2); ctx.fill();
  }

    } else if (f.kind === 'slash') {

      const a0 = f.a - 1.1 + k * 1.2;

    } else if (f.kind === 'spin') {

      ctx.beginPath(); ctx.ellipse(x, y - tw * .3, tw * 1.3, tw * .6, 0, k * 8, k * 8 + 4.5); ctx.stroke();

}

  if (u.dragging && u.dragG) { u.gx += (u.dragG[0] - u.gx) * .5; u.gy += (u.dragG[1] - u.gy) * .5; hop = .35; }
  else if (u.move) {
    const t = Math.min(1, u.move.t), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    u.gx = u.move.fc + .5 + (u.move.c - u.move.fc) * e; u.gy = u.move.fr + .5 + (u.move.r - u.move.fr) * e; hop = Math.sin(Math.PI * t) * .18;
  } else if (u.dying <= 0) { const k = Math.min(1, dt * 14); u.gx += (u.c + .5 - u.gx) * k; u.gy += (u.r + .5 - u.gy) * k; }
  let lx = 0, ly = 0;
  if (u.lunge > 0) { u.lunge -= dt; if (u.faceT) { const k = Math.sin((1 - Math.max(0, u.lunge) / .3) * Math.PI) * .28, dx = u.faceT.gx - u.gx, dy = u.faceT.gy - u.gy, l = Math.hypot(dx, dy) || 1; lx = dx / l * k; ly = dy / l * k; } }
  if (u.cheer > 0) { u.cheer -= dt; hop = Math.max(hop, Math.abs(Math.sin(time * 9 + u.id)) * .25); }
  if (u.def.float) hop += .06 + Math.sin(time * 2.4 + u.id) * .05;
  u.hop = hop; u.lx = lx; u.ly = ly;
  // orientación: ángulo en pantalla hacia el objetivo (0 = mirando a cámara)
  let want = 0;
  if ((G.state === 'fight' || G.state === 'result') && u.faceT) {
    const a = gridToScreen(u.gx, u.gy), b = gridToScreen(u.faceT.gx, u.faceT.gy);
    if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 2) want = Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI; else want = u.face;
  } else if (G.state === 'fight' || G.state === 'result') want = u.face;
  u.face = lerpAng(u.face, want, Math.min(1, dt * 9));
  if (u.spin > 0) u.spin -= dt;
  if (u.flash > 0) u.flash -= dt;
  if (u.pop > 0) { u.pop += dt * 3; if (u.pop >= 1) u.pop = 0; }
  if (u.dying > 0) u.dying += dt * 2.6;
}
function drawUnit(u, time) {
  const [bx, by] = gridToScreen(u.gx + u.lx, u.gy + u.ly), tw = tileW(u.gy);
  const visible = !(u.dying >= 1);
  u.sx = bx; u.sy = by;
  if (!visible) return;
  const dk = u.dying > 0 ? Math.max(0, 1 - u.dying) : 1;
  // peana de equipo
  ctx.save(); ctx.globalAlpha = dk;
  ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(bx, by + tw * .1, tw * .42, tw * .17, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = u.team === 'p' ? '#4aa0ff' : '#ff4d5e'; ctx.lineWidth = Math.max(2, tw * .055);
  ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.ellipse(bx, by + tw * .1, tw * .4, tw * .16, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  // sprite
  const phi = u.face + (u.spin > 0 ? (1 - u.spin / .5) * 720 : 0);
  const f = frameFor(u.type, phi), fr = FR[u.type][f.v], ch = CHARS[u.type];
  const k = ch.h * tw / FR[u.type].fh;
  let sc = 1;
  if (u.pop > 0) { const p = Math.min(1, u.pop); sc = 1 + Math.sin(p * Math.PI) * .3 - (p < .25 ? (1 - p * 4) * .5 : 0); }
  const br = Math.sin(time * 3 + u.id) * .02;
  const dw = fr.w * k * sc * dk * (1 - br * .5), dh = fr.h * k * sc * dk * (1 + br);
  const footY = by + tw * .16 - u.hop * tw;
  u.dw = dw; u.top = footY - dh;
  ctx.save(); ctx.globalAlpha = dk; ctx.translate(bx, footY); if (f.mir) ctx.scale(-1, 1);
  ctx.drawImage(fr.cv, -dw / 2, -dh, dw, dh);
  if (u.flash > 0) { ctx.globalAlpha = Math.min(1, u.flash * 8) * .65; ctx.drawImage(fr.white, -dw / 2, -dh, dw, dh); }
  ctx.restore();
  // coraza (escudo)
  if (u.shield > 0 && u.alive) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .25 + Math.sin(time * 6) * .06;
    const g = ctx.createRadialGradient(bx, footY - dh * .45, dh * .2, bx, footY - dh * .45, dh * .62);
    g.addColorStop(0, 'rgba(255,140,40,0)'); g.addColorStop(.8, 'rgba(255,140,40,.6)'); g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, footY - dh * .45, dh * .62, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
function updateLabels() {
  for (const u of units) {
    const L = u.lbl, show = G.screen === 'battle' && u.dying <= 0 && !u.dragging;
    if (!show) { if (L.vis !== false) { L.el.style.display = 'none'; L.vis = false; } continue; }
    if (L.vis !== true) { L.el.style.display = ''; L.vis = true; }
    L.el.style.transform = `translate(${u.sx}px,${u.top - 2}px) translate(-50%,-100%)`;
    const stars = '★'.repeat(u.level); if (L.stars !== stars) { L.st.textContent = stars; L.stars = stars; }
    L.hp.style.width = Math.max(0, u.hp / u.maxHp * 100) + '%';
    L.sh.style.width = Math.min(100, u.shield / u.maxHp * 100) + '%';
    L.en.style.width = u.energy + '%';
    L.el.classList.toggle('full', u.energy >= 100);
    L.el.classList.toggle('stun', u.stun > 0 && u.alive);
  }
}
let last = performance.now(), time = 0;
function loop(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now; time += rdt;
  if (G.screen === 'battle' && IMG.board) {
    const dt = rdt * (G.state === 'fight' ? G.speed : 1);
    if (G.state === 'fight') { let left = dt; while (left > 0 && G.state === 'fight') { const s = Math.min(.03, left); combatStep(s); left -= s; } }
    for (const u of units) updateUnitVisual(u, dt, time);
    updateParts(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (shake > .2) { ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake); shake *= Math.pow(.02, rdt); } else shake = 0;
    drawBoard();
    for (const u of [...units].sort((a, b) => a.sy - b.sy)) drawUnit(u, time);
    drawProjectiles(); drawParts();
    updateLabels();
  }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { if (G.screen === 'battle') layout(); });

loadAll().then(() => { $('#loading').classList.add('hide'); show('home'); requestAnimationFrame(loop); })
  .catch(e => { $('#loading').textContent = 'Error al cargar ' + e; });

// gancho para pruebas automáticas
window.__game = { G, units: () => units, buy, reroll, startFight, setSpeed: s => { G.speed = s; }, openDetail };
</script>
