<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prueba · Sobre de recompensas</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#14173a;font-family:'Lilita One',system-ui,sans-serif;color:#fff}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  button{font:inherit;font-size:22px;padding:14px 28px;border:0;border-radius:16px;background:#8b4fd8;color:#fff;box-shadow:0 5px 0 #4b2290}
  p{opacity:.6;font-family:system-ui;font-size:13px}
</style>
</head>
<body>
<div class="c">
  <button id="b">Abrir sobre</button>
  <p>Página de prueba de la animación (todavía no está enlazada al juego).</p>
</div>
<script type="module">
import { abrirSobre, cerrarSobre, precargarSobre } from './js/sobre.js';
precargarSobre();
document.getElementById('b').onclick = async () => {
  await abrirSobre();
  // Aquí irán las recompensas. De momento, tocar para cerrar.
  setTimeout(() => addEventListener('pointerdown', () => cerrarSobre(), { once: true }), 300);
};
</script>
</body>
</html>
