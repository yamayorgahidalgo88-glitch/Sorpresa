<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 128">
  <!-- Moneda provisional de Batalla de Bestias: oro, contorno grueso de tinta y huella de garra -->
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset=".45" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#f0a020"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d98a12"/>
      <stop offset="1" stop-color="#a85a08"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f3a826"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
  </defs>
  <!-- canto (grosor) -->
  <ellipse cx="60" cy="68" rx="54" ry="54" fill="url(#edge)" stroke="#16142e" stroke-width="6"/>
  <!-- cara -->
  <circle cx="60" cy="58" r="54" fill="url(#face)" stroke="#16142e" stroke-width="6"/>
  <!-- aro interior hundido -->
  <circle cx="60" cy="58" r="40" fill="url(#inner)" stroke="#c97a10" stroke-width="4"/>
  <!-- huella de garra en relieve -->
  <g fill="#fff1a0" stroke="#16142e" stroke-width="3.5" stroke-linejoin="round">
    <path d="M60 58c-11 0-19 8-19 16 0 6 5 9 10 9 4 0 6-2 9-2s5 2 9 2c5 0 10-3 10-9 0-8-8-16-19-16z"/>
    <ellipse cx="41" cy="48" rx="6" ry="8" transform="rotate(-20 41 48)"/>
    <ellipse cx="53" cy="39" rx="6" ry="8.5" transform="rotate(-6 53 39)"/>
    <ellipse cx="67" cy="39" rx="6" ry="8.5" transform="rotate(6 67 39)"/>
    <ellipse cx="79" cy="48" rx="6" ry="8" transform="rotate(20 79 48)"/>
  </g>
  <!-- brillo -->
  <path d="M24 40a40 40 0 0 1 26-24" fill="none" stroke="#fffbe0" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <circle cx="22" cy="52" r="3.5" fill="#fffbe0" opacity=".85"/>
</svg>
