<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SUPERSTAR">
<meta name="description" content="Juego de ritmo personal: toca las notas al ritmo de tus canciones favoritas.">
<title>SUPERSTAR · ARMY Edition</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">
<div id="app">
  <div id="bg"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <header id="topbar" hidden></header>
  <main id="view"></main>
  <nav id="nav" hidden>
    <button data-go="lobby"><span>⌂</span>Inicio</button>
    <button data-go="songs"><span>♫</span>Canciones</button>
    <button data-go="deck"><span>▦</span>Cartas</button>
    <button data-go="shop"><span>✦</span>Tienda</button>
    <button data-go="settings"><span>⚙</span>Ajustes</button>
  </nav>

  <section id="play" hidden>
    <div class="play-bg"></div>
    <canvas id="cv"></canvas>
    <div class="play-info"><span id="playTitle"></span> <b id="playDiff"></b></div>
    <button id="pauseBtn" aria-label="Pausa">❚❚</button>
    <div id="pauseMenu" hidden>
      <div class="pm-box">
        <h2>PAUSA</h2>
        <button class="btn primary" id="pmResume">Continuar</button>
        <button class="btn ghost" id="pmRetry">Reintentar</button>
        <button class="btn ghost" id="pmQuit">Salir</button>
      </div>
    </div>
  </section>

  <div id="modal" hidden></div>
  <div id="loading" hidden><div class="spinner"></div><span></span></div>
  <div id="toast"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
