<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feliz Navidad cariño 💚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="casa/entrada.webp" fetchpriority="high">
<style>
:root{--night:#080d24;--ink:#fff3d6;--neon:#5d8cff;--gold:#ffcf6a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:"Press Start 2P",monospace}
body{display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:0}
#stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
#title{font-size:clamp(10px,2.2vw,16px);letter-spacing:1px;text-shadow:2px 2px 0 #7a1a1f;min-height:1.6em;text-align:center;padding:0 16px}
#view{position:relative;overflow:hidden;border-radius:3px;background:#120a06;
  box-shadow:0 0 0 2px #2d5bff,0 0 24px rgba(93,140,255,.55),0 0 60px rgba(93,140,255,.25)}
#world{position:absolute;left:0;top:0;width:500%;height:200%;transition:transform 1s cubic-bezier(.65,0,.35,1);will-change:transform}
.room{position:absolute;width:20%;height:50%;overflow:hidden}
.room img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;pointer-events:none}
/* glowing blue structure between rooms, like the house reference */
.room::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 3px #2d5bff,inset 0 0 0 5px rgba(159,192,255,.35),inset 0 0 22px rgba(0,0,0,.45)}
.room.garden{background:linear-gradient(#0f1838 0 50%,#1a2a58 50% 72%,#dfe8f7 72%)}
.arrow{position:absolute;z-index:3;border:0;background:none;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  -webkit-tap-highlight-color:transparent;outline:none;transition:opacity .3s}
.arrow svg{width:clamp(30px,5vw,56px);height:auto;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(0,0,0,.35))}
.arrow span{font:inherit;font-size:clamp(7px,1.25vw,11px);color:var(--ink);background:rgba(8,13,36,.78);padding:4px 5px;border:1px solid rgba(255,243,214,.35);white-space:nowrap}
.arrow.left{left:1.5%;top:50%;translate:0 -50%;flex-direction:row}
.arrow.right{right:1.5%;top:50%;translate:0 -50%;flex-direction:row-reverse}
.arrow.up,.arrow.down{translate:-50% -50%}
.arrow.down{flex-direction:column-reverse}
.arrow.left svg{animation:bobL 1.2s steps(2) infinite}
.arrow.right svg{animation:bobR 1.2s steps(2) infinite}
.arrow.up svg{animation:bobU 1.2s steps(2) infinite}
.arrow.down svg{animation:bobD 1.2s steps(2) infinite}
@keyframes bobL{50%{transform:translateX(-3px)}}
@keyframes bobR{50%{transform:translateX(3px)}}
@keyframes bobU{50%{transform:translateY(-3px)}}
@keyframes bobD{50%{transform:translateY(3px)}}
.arrow:hover svg,.arrow:focus-visible svg{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.arrow[hidden]{display:none}
#hint{font-size:8px;opacity:.6;text-align:center;padding:0 16px;line-height:1.8;min-height:1em}
#fade{position:fixed;inset:0;z-index:10;background:var(--night);display:grid;place-items:center;transition:opacity 1.2s}
#fade.out{opacity:0;pointer-events:none}
#fade p{font-size:12px;letter-spacing:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){#world{transition:none}.arrow svg{animation:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="stage">
  <div id="title" aria-live="polite"></div>
  <div id="view">
    <div id="world"></div>
    <button class="arrow left" data-dir="left"><span></span></button>
    <button class="arrow right" data-dir="right"><span></span></button>
    <button class="arrow up" data-dir="up"><span></span></button>
    <button class="arrow down" data-dir="down"><span></span></button>
  </div>
  <div id="hint"></div>
</div>
<div id="fade"><p>Entrando...</p></div>

<script>
/* World grid: 5 columns x 2 floors (row 0 = upstairs, row 1 = ground floor).
   upAt / downAt = where the stair arrow sits, in % of the room image. */
const ROOMS={
  dormitorio:{c:0,r:0,name:'Dormitorio',img:'dormitorio',right:'bano2'},
  bano2:     {c:1,r:0,name:'Baño del dormitorio',img:'bano-dormitorio',left:'dormitorio',right:'salita'},
  salita:    {c:2,r:0,name:'Salita',img:'salita',left:'bano2',right:'bano3',down:'entrada',downAt:[24,72]},
  bano3:     {c:3,r:0,name:'Baño',img:'bano',left:'salita',right:'ninos'},
  ninos:     {c:4,r:0,name:'Habitación de los niños',img:'ninos',left:'bano3'},
  cocina:    {c:0,r:1,name:'Cocina',img:'cocina',right:'aseo'},
  aseo:      {c:1,r:1,name:'Aseo',img:'aseo',left:'cocina',right:'entrada'},
  entrada:   {c:2,r:1,name:'Entrada',img:'entrada',left:'aseo',right:'salon',up:'salita',upAt:[55,40]},
  salon:     {c:3,r:1,name:'Salón',img:'salon',left:'entrada'}
};

const view=document.getElementById('view'),world=document.getElementById('world');
const titleEl=document.getElementById('title'),hint=document.getElementById('hint');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- build the house ---------- */
let entradaImg;
for(const k in ROOMS){
  const r=ROOMS[k],d=document.createElement('div');
  d.className='room';d.style.left=r.c*20+'%';d.style.top=r.r*50+'%';
  const img=new Image();img.src='casa/'+r.img+'.webp';img.alt=r.name;img.decoding='async';
  d.appendChild(img);world.appendChild(d);
  if(k==='entrada')entradaImg=img;
}
const garden=document.createElement('div');garden.className='room garden';garden.style.left='80%';garden.style.top='50%';world.appendChild(garden);

/* ---------- pixel arrows ---------- */
const ARROW=['....kk.....','...kwk.....','..kwwkkkkkk','.kwwwwwwwwk','kwwwwwwwwwk','.kwwwwwwwwk','..kwwkkkkkk','...kwk.....','....kk.....'];
const ROT={left:'',right:'translate(11,0) scale(-1,1)',up:'rotate(90 5.5 5.5)',down:'rotate(-90 5.5 5.5)'};
function arrowSvg(dir){let r='';ARROW.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x}" y="${y+1}" width="1" height="1" fill="${ch==='k'?'#3a1d17':'#fff3d6'}"/>`}));
  return `<svg viewBox="0 0 11 11" aria-hidden="true"><g transform="${ROT[dir]}">${r}</g></svg>`}
const arrows={};
document.querySelectorAll('.arrow').forEach(b=>{
  b.insertAdjacentHTML('afterbegin',arrowSvg(b.dataset.dir));
  arrows[b.dataset.dir]=b;b.addEventListener('click',()=>go(b.dataset.dir));
});

/* ---------- viewport & navigation ---------- */
let current='entrada',moving=false;
function fit(){
  hint.textContent=innerHeight>innerWidth?'Gira el móvil para ver la casa más grande':'';
  const titleH=titleEl.offsetHeight+10,hintH=hint.offsetHeight+10;
  const w=Math.min(innerWidth-16,(innerHeight-titleH-hintH-16)*16/9);
  view.style.width=Math.round(w)+'px';view.style.height=Math.round(w*9/16)+'px';
}
function place(instant){
  const r=ROOMS[current];
  if(instant)world.style.transition='none';
  world.style.transform=`translate(${-r.c*20}%,${-r.r*50}%)`;
  if(instant){world.offsetWidth;world.style.transition=''}
  titleEl.textContent=r.name;
  for(const d of ['left','right','up','down']){
    const b=arrows[d],to=r[d];
    b.hidden=!to;if(!to)continue;
    b.querySelector('span').textContent=ROOMS[to].name;
    b.setAttribute('aria-label','Ir a '+ROOMS[to].name);
    if(d==='up'||d==='down'){const [x,y]=r[d+'At'];b.style.left=x+'%';b.style.top=y+'%'}
  }
}
function go(dir){
  const to=ROOMS[current][dir];if(!to||moving)return;
  current=to;moving=true;
  Object.values(arrows).forEach(b=>b.style.opacity=0);
  place();
  setTimeout(()=>{moving=false;Object.values(arrows).forEach(b=>b.style.opacity=1)},reduce?50:1000);
}
addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();go(m)}});
let sx=0,sy=0;
view.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
view.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;
  if(Math.abs(dx)>Math.abs(dy))go(dx<0?'right':'left');else go(dy<0?'down':'up')});
addEventListener('resize',fit);
fit();place(true);
if(document.fonts)document.fonts.ready.then(fit);

// fade in once the entrance picture is ready (or after 4s at most)
const reveal=()=>document.getElementById('fade').classList.add('out');
if(entradaImg.complete)setTimeout(reveal,300);else{entradaImg.addEventListener('load',()=>setTimeout(reveal,300));entradaImg.addEventListener('error',reveal)}
setTimeout(reveal,4000);

/* ---------- night sky with snow around the house ---------- */
(function(){
  const c=document.getElementById('sky'),g=c.getContext('2d');let W,H,fl=[];
  function size(){W=Math.ceil(innerWidth/4);H=Math.ceil(innerHeight/4);c.width=W;c.height=H;
    fl=Array.from({length:Math.round(W*H/90)},()=>({x:Math.random()*W,y:Math.random()*H,v:.1+Math.random()*.25}))}
  size();addEventListener('resize',size);
  (function tick(){g.fillStyle='#080d24';g.fillRect(0,0,W,H);
    for(const f of fl){if(!reduce){f.y+=f.v;if(f.y>H){f.y=0;f.x=Math.random()*W}}g.fillStyle=f.v>.28?'#ffffff':'#56608a';g.fillRect(f.x|0,f.y|0,1,1)}
    if(!reduce)requestAnimationFrame(tick)})();
})();
</script>
</body>
</html>
