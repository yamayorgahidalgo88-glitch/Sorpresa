<meta name="screen-orientation" content="landscape">
<meta name="mobile-web-app-capable" content="yes">

<title>Feliz Navidad cariño 💚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--night:#080d24;--ink:#fff3d6;--neon:#5d8cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:"Press Start 2P",monospace}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---------- always landscape: #app is rotated when the phone is held upright ---------- */
#app{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0}
#sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#title{font-size:clamp(9px,2vw,16px);letter-spacing:1px;text-shadow:2px 2px 0 #7a1a1f;min-height:1.6em;text-align:center;padding:0 16px}
#view{position:relative;overflow:hidden;border-radius:3px;background:#120a06;
  box-shadow:0 0 0 2px #2d5bff,0 0 24px rgba(93,140,255,.55),0 0 60px rgba(93,140,255,.25)}
#world{position:absolute;left:0;top:0;width:500%;height:200%;transition:transform 1s cubic-bezier(.65,0,.35,1);will-change:transform}
.room{position:absolute;width:20%;height:50%;overflow:hidden;container-type:size}
.room>img{display:block;width:100%;height:100%;object-fit:fill;-webkit-user-drag:none;pointer-events:none}
.room::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
  box-shadow:inset 0 0 0 3px #2d5bff,inset 0 0 0 5px rgba(159,192,255,.35),inset 0 0 22px rgba(0,0,0,.45)}
.room.garden{background:linear-gradient(#0f1838 0 50%,#1a2a58 50% 72%,#dfe8f7 72%)}

/* ---------- arrows ---------- */
.arrow{position:absolute;z-index:60;border:0;background:none;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  -webkit-tap-highlight-color:transparent;outline:none;transition:opacity .3s}
.arrow svg{width:clamp(28px,4.6vw,54px);height:auto;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(0,0,0,.35))}
.arrow span{font:inherit;font-size:clamp(6px,1.15vw,11px);color:var(--ink);background:rgba(8,13,36,.78);padding:4px 5px;border:1px solid rgba(255,243,214,.35);white-space:nowrap}
.arrow.left{left:1.2%;top:50%;translate:0 -50%;flex-direction:row}
.arrow.right{right:1.2%;top:50%;translate:0 -50%;flex-direction:row-reverse}
.arrow.up,.arrow.down{translate:-50% -50%}
.arrow.down{flex-direction:column-reverse}
.arrow.left svg{animation:bobL 1.2s steps(2) infinite}
.arrow.right svg{animation:bobR 1.2s steps(2) infinite}
.arrow.up svg{animation:bobU 1.2s steps(2) infinite}
.arrow.down svg{animation:bobD 1.2s steps(2) infinite}
@keyframes bobL{50%{transform:translateX(-3px)}}
@keyframes bobR{50%{transform:translateX(3px)}}
@keyframes bobU{50%{transform:translateY(-3px)}}
@keyframes bobD{50%{transform:translateY(3px)}}
.arrow[hidden]{display:none}

/* ---------- interactive props ---------- */
.prop{position:absolute;padding:0;border:0;background:none;cursor:pointer;perspective:520px;-webkit-tap-highlight-color:transparent;outline:none;z-index:5}
.prop.open{z-index:20}
.prop .hole{position:absolute;inset:0;opacity:0;transition:opacity .15s}
.prop.open .hole{opacity:1}
.piece{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.25,.9,.3,1.08)}
.face{position:absolute;inset:0;background-repeat:no-repeat;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.t-door .face.back{background:#6e3f1c;box-shadow:inset 0 0 0 2px #3a1f0c,inset 0 0 0 6px #8a5428,inset 0 0 0 7px #3a1f0c}
.t-door.hl .piece{transform-origin:0 50%}
.t-door.hr .piece{transform-origin:100% 50%}
.t-door.hl.open .piece{transform:rotateY(-112deg)}
.t-door.hr.open .piece{transform:rotateY(112deg)}
.t-drawer.open .piece{transform:translateY(42%) scale(1.13)}
.t-drawer.open .face.front{box-shadow:0 5px 6px rgba(0,0,0,.55)}
.t-flap .piece{transform-origin:50% 100%}
.t-flap .face.back{transform:rotateX(180deg);background:linear-gradient(#3a3d46,#22242b);box-shadow:inset 0 0 0 3px #8e95a3}
.t-flap.open .piece{transform:rotateX(-100deg)}
.t-lid .piece,.t-bin .piece{transform-origin:50% 0}
.t-lid .face.back{transform:rotateX(180deg);border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#fffaf2 0 45%,#e9e1d4 46% 60%,#cfc5b6 61%);box-shadow:0 0 0 2px #6b5d4c}
.t-bin .face.back{transform:rotateX(180deg);border-radius:40%;background:linear-gradient(90deg,#8e95a3,#e6e9ef 40%,#9aa0ae);box-shadow:0 0 0 1px #4a4f5a}
.t-lid.open .piece{transform:rotateX(178deg) scaleY(1.75)}
.t-bin.open .piece{transform:rotateX(155deg) scaleY(1.4)}
.t-curtain .piece{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.t-curtain.dr .piece{transform-origin:0 50%}
.t-curtain.dl .piece{transform-origin:100% 50%}
.t-curtain.open .piece{transform:scaleX(var(--k))}
.t-curtain.open{z-index:12}

/* interiors (hidden spots for the envelopes) */
.in-wood{background:linear-gradient(180deg,#0e0703,#2a180b 55%,#3d2513);box-shadow:inset 0 0 0 2px #0a0502,inset 0 8px 10px rgba(0,0,0,.8)}
.in-drawer{background:linear-gradient(180deg,#120904 0 30%,#5a3818 30% 34%,#3a2410 34%);box-shadow:inset 0 0 0 2px #0a0502,inset 0 6px 8px rgba(0,0,0,.8)}
.in-night{overflow:hidden;background:
  radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 15%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 45% 55%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 45%,#fff 50%,transparent 51%),
  linear-gradient(180deg,#081232 0,#1d3570 62%,#cfdcf2 62%,#f4f8ff 100%);box-shadow:inset 0 0 0 3px #3a1f0c}
.in-night::before{content:"";position:absolute;left:12%;bottom:30%;width:22%;height:34%;background:linear-gradient(to top,#123a2c,#1f5a40);clip-path:polygon(50% 0,100% 100%,0 100%)}
.in-night::after{content:"";position:absolute;right:14%;bottom:32%;width:16%;height:26%;background:#16402f;clip-path:polygon(50% 0,100% 100%,0 100%)}
.in-fridge{background:repeating-linear-gradient(180deg,#f3fbff 0 31%,#b8d4e6 31% 33%),#f3fbff;box-shadow:inset 0 0 0 3px #8e95a3,inset 0 0 18px rgba(170,220,255,.9)}
.in-fridge::before{content:"";position:absolute;left:12%;right:12%;top:18%;height:12%;background:linear-gradient(90deg,#e5544a 0 18%,transparent 18% 24%,#f2c84a 24% 40%,transparent 40% 48%,#62b45a 48% 62%,transparent 62% 70%,#fff 70% 88%,transparent 88%)}
.in-fridge::after{content:"";position:absolute;left:14%;right:20%;top:51%;height:10%;background:linear-gradient(90deg,#c8823a 0 30%,transparent 30% 38%,#e5544a 38% 58%,transparent 58% 66%,#4ab0ff 66%)}
.in-freezer{background:repeating-linear-gradient(180deg,#dff1fb 0 46%,#a9c9de 46% 49%);box-shadow:inset 0 0 0 3px #8e95a3,inset 0 0 22px #fff}
.in-oven{background:radial-gradient(ellipse at 50% 70%,#ff9a3a 0,#a8401a 35%,#1a0c06 75%);box-shadow:inset 0 0 0 3px #2b2b33}
.in-shelves{background:repeating-linear-gradient(180deg,#c99a62 0 31%,#7a4f2c 31% 34%),#c99a62;box-shadow:inset 0 0 0 3px #4a2e1a,inset 0 0 14px rgba(0,0,0,.4)}
.in-shelves::before{content:"";position:absolute;left:12%;right:30%;top:16%;height:14%;background:linear-gradient(90deg,#e5544a 0 14%,transparent 14% 22%,#fff 22% 34%,transparent 34% 42%,#62b45a 42% 56%,transparent 56% 64%,#4ab0ff 64% 78%,transparent 78%)}
.in-glass{background:repeating-linear-gradient(180deg,#d9c8a8 0 47%,#8a5a32 47% 50%);box-shadow:inset 0 0 0 3px #4a2e1a}
.in-glass::before{content:"";position:absolute;left:14%;right:14%;top:22%;height:20%;background:radial-gradient(circle at 20% 50%,#fff 0 28%,transparent 30%),radial-gradient(circle at 50% 50%,#fff 0 28%,transparent 30%),radial-gradient(circle at 80% 50%,#fff 0 28%,transparent 30%)}
.in-clothes{background:linear-gradient(180deg,#140a04 0 8%,#b08040 8% 10%,transparent 10%),
  linear-gradient(180deg,transparent 10%,transparent 10%) ,
  repeating-linear-gradient(90deg,#9e1d25 0 18%,#24613a 18% 34%,#1f3d5c 34% 52%,#d9cfb4 52% 66%,#6a3d7a 66% 84%,#c8302f 84% 100%),#140a04;
  background-size:100% 100%,100% 100%,100% 62%;background-position:0 0,0 0,0 12%;background-repeat:no-repeat;box-shadow:inset 0 0 0 2px #0a0502,inset 0 0 16px rgba(0,0,0,.8)}
.in-bowl{border-radius:50%;background:radial-gradient(ellipse at 50% 58%,#7cc3e0 0 34%,#cfe9f4 38%,#f7f9fb 46% 63%,#c9ced6 66% 72%,transparent 74%)}
.in-bin{border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#0b0b0e 0 55%,#5a5f6a 58% 70%,transparent 72%)}

/* lamps */
.t-lamp{border-radius:50%;cursor:pointer}
.t-lamp .dark{position:absolute;inset:-30%;border-radius:50%;opacity:0;transition:opacity .35s;pointer-events:none;mix-blend-mode:multiply;
  background:radial-gradient(circle,rgba(25,15,35,.9) 0 16%,rgba(25,15,35,.55) 34%,rgba(25,15,35,0) 66%)}
.t-lamp.open .dark{opacity:1}

/* shower water */
.t-water .drops{position:absolute;inset:0;opacity:0;transition:opacity .4s;pointer-events:none;overflow:hidden}
.t-water.open .drops{opacity:1}
.t-water .drops i{position:absolute;top:-10%;width:2px;height:7%;background:linear-gradient(transparent,#d8f0ff);border-radius:2px;animation:drop .55s linear infinite}
.t-water .steam{position:absolute;left:-10%;right:-10%;bottom:0;height:60%;opacity:0;transition:opacity 2s;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.45),transparent 70%)}
.t-water.open .steam{opacity:1}
@keyframes drop{to{transform:translateY(1500%)}}

/* tv */
.t-tv .screen{position:absolute;inset:3% 4% 5% 4%;opacity:0;transition:opacity .25s;background-repeat:no-repeat;filter:saturate(1.3) brightness(1.15);box-shadow:0 0 18px rgba(120,170,255,.7)}
.t-tv .screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);animation:flick .15s steps(2) infinite}
.t-tv.open .screen{opacity:1}
@keyframes flick{50%{opacity:.6}}

/* fire */
.t-fire .roar{position:absolute;inset:-15%;opacity:0;transition:opacity .4s;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 75%,rgba(255,190,80,.85),rgba(255,110,30,.45) 35%,transparent 65%);animation:roar .25s steps(2) infinite}
.t-fire.open .roar{opacity:1}
@keyframes roar{50%{transform:scale(1.05,1.12) translateY(-3%)}}
.spark{position:absolute;width:4px;height:4px;background:#ffd24a;box-shadow:0 0 6px #ff9a3a;pointer-events:none;animation:spark 1.2s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.twinkle{position:absolute;width:10px;height:10px;pointer-events:none;animation:tw 1.1s ease-out forwards;
  background:conic-gradient(from 45deg,#fff 0 6%,transparent 6% 25%,#fff 25% 31%,transparent 31% 50%,#fff 50% 56%,transparent 56% 75%,#fff 75% 81%,transparent 81%);filter:drop-shadow(0 0 4px #ffe58a)}
@keyframes tw{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.6) rotate(45deg)}100%{transform:scale(0) rotate(90deg);opacity:0}}

/* snow globe */
.t-shake .piece{clip-path:ellipse(50% 46% at 50% 45%)}
.t-shake.go .piece{animation:shake .7s ease-in-out}
@keyframes shake{20%{transform:translateX(-8%) rotate(-8deg)}40%{transform:translateX(8%) rotate(8deg)}60%{transform:translateX(-6%) rotate(-5deg)}80%{transform:translateX(4%) rotate(3deg)}}

/* toaster */
.t-toast .slice{position:absolute;top:2%;width:26%;height:46%;background:linear-gradient(#e7b56a,#c8823a);border-radius:30% 30% 4px 4px;box-shadow:inset 0 0 0 2px #7a4519;opacity:0}
.t-toast .slice:nth-child(1){left:22%}.t-toast .slice:nth-child(2){left:54%}
.t-toast.go .slice{animation:toast 1.1s cubic-bezier(.2,.9,.3,1)}
@keyframes toast{0%{opacity:1;transform:translateY(40%)}35%{transform:translateY(-95%)}70%{transform:translateY(-80%)}100%{opacity:1;transform:translateY(40%)}}

/* toilet paper */
.t-tp .strip{position:absolute;left:30%;width:42%;top:78%;height:0;transition:height .6s cubic-bezier(.3,1.3,.5,1);
  background:repeating-linear-gradient(180deg,#fbfbf8 0 18px,#dedcd4 18px 19px);box-shadow:1px 1px 0 rgba(0,0,0,.25)}
.t-tp.open .strip{height:230%}
.capa{position:absolute;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s ease;image-rendering:auto}
.capa.on{opacity:1}
.prop.hit{z-index:6}

/* ---------- intro / overlays ---------- */
#intro{position:absolute;inset:0;z-index:100;background:var(--night);display:grid;place-items:center;transition:opacity 1s}
#intro.out{opacity:0;pointer-events:none}
#intro .box{text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center;padding:16px}
#intro h1{margin:0;font-size:clamp(12px,3vw,24px);font-weight:400;line-height:1.6;text-shadow:3px 3px 0 #7a1a1f}
#enter{font:inherit;font-size:clamp(9px,1.6vw,13px);color:#fff3d6;background:#9e1d25;border:0;padding:14px 20px;cursor:pointer;
  box-shadow:0 4px 0 #5e0f14,0 0 0 3px #fff3d6;animation:pulse 1.4s steps(2) infinite}
@keyframes pulse{50%{transform:translateY(-2px)}}
#toast{position:absolute;left:50%;bottom:3%;translate:-50% 0;z-index:70;font-size:clamp(6px,1.1vw,10px);line-height:1.8;background:rgba(8,13,36,.85);border:1px solid rgba(255,243,214,.4);
  padding:8px 12px;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#world{transition:none}.arrow svg{animation:none!important}}
</style>
</head>

    ['lamp',180,170,70],['lamp',355,210,60],['lamp',592,340,70],['lamp',815,90,160]
  ]
};

// generated by tools/entrada_capas.py: piece of picture shown on top of the base when tapped
// generated by tools/*_capas.py: per room, pieces of picture shown on top of the base when tapped
const CAPAS={
  aseo:/*CAPAS:aseo*/{"cuadro":{"x":804,"y":14,"w":155,"h":187,"hits":[[812,22,138,100]],"group":"cuadro","label":"cuadro"},"botes":{"x":1303,"y":273,"w":99,"h":103,"hits":[[1300,270,100,100]],"group":"botes","label":"botes de la ducha"},"toalla":{"x":192,"y":361,"w":115,"h":278,"hits":[[200,372,98,258]],"group":"toalla","label":"toalla"},"mueble":{"x":291,"y":588,"w":414,"h":230,"hits":[[346,595,304,213]],"group":"mueble","label":"mueble del lavabo"},"tapa":{"x":792,"y":501,"w":233,"h":216,"hits":[[800,625,215,85]],"group":"tapa","label":"tapa del váter"},"papelera":{"x":1024,"y":625,"w":97,"h":107,"hits":[[1028,696,88,132]],"group":"papelera","label":"papelera"},"flor_lavabo":{"x":320,"y":292,"w":171,"h":228,"hits":[[318,298,168,216]],"group":"flor","label":"flor"},"flor_suelo":{"x":223,"y":647,"w":165,"h":240,"hits":[[230,660,150,210]],"group":"flor","label":"flor"},"planta":{"x":855,"y":0,"w":267,"h":380,"hits":[[945,40,175,360]],"group":"planta","label":"planta"}}/*FIN:aseo*/,
};
const ENTRADA_CAPAS=/*CAPAS_ENTRADA*/{"abrigos":{"x":309,"y":335,"w":177,"h":215,"hits":[[300,320,180,220]],"group":"abrigos"},"corona":{"x":777,"y":57,"w":176,"h":126,"hits":[[730,0,260,200]],"group":"corona"},"cojin_banco":{"x":353,"y":538,"w":112,"h":105,"hits":[[355,540,105,100]],"group":"cojin"},"cojin_suelo":{"x":447,"y":691,"w":175,"h":74,"hits":[[455,688,155,62]],"group":"cojin"},"alfombrilla":{"x":1164,"y":634,"w":292,"h":147,"hits":[[1180,650,250,115]],"group":"alfombrilla"},"alfombra_pasillo":{"x":486,"y":554,"w":210,"h":120,"hits":[[500,565,200,100]],"group":"alfombra_pasillo"},"alfombra":{"x":320,"y":764,"w":433,"h":177,"hits":[[330,800,250,141]],"group":"alfombra"},"cajon_izq_1":{"x":137,"y":613,"w":123,"h":102,"hits":[[144,613,109,75]],"group":"cajon_izq_1"},"cajon_izq_2":{"x":249,"y":595,"w":96,"h":90,"hits":[[255,595,84,63]],"group":"cajon_izq_2"},"puerta_izq_1":{"x":111,"y":677,"w":112,"h":156,"hits":[[144,677,79,147]],"group":"puerta_izq_1"},"puerta_izq_2":{"x":224,"y":653,"w":88,"h":138,"hits":[[224,660,62,131]],"group":"puerta_izq_2"},"puerta_izq_3":{"x":288,"y":638,"w":75,"h":128,"hits":[[288,645,53,121]],"group":"puerta_izq_3"},"puerta_der_1":{"x":1503,"y":636,"w":76,"h":142,"hits":[[1525,643,54,135]],"group":"puerta_der_1"},"puerta_der_2":{"x":1580,"y":667,"w":90,"h":156,"hits":[[1580,667,64,147]],"group":"puerta_der_2"}}/*FIN_CAPAS*/;
const NOMBRES={abrigos:'perchero',corona:'lámpara',cojin:'cojín',alfombrilla:'alfombrilla',alfombra_pasillo:'alfombra del pasillo',alfombra:'alfombra'};
const $=s=>document.querySelector(s);
const app=$('#app'),view=$('#view'),world=$('#world'),titleEl=$('#title'),toastEl=$('#toast');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pct=(v,t)=>(v/t*100)+'%';
function crop(el,img,x,y,w,h){
  el.style.backgroundImage=`url(casa/${img}.webp)`;
  el.style.backgroundSize=`${IW/w*100}% ${IH/h*100}%`;
  el.style.backgroundPosition=`${x/(IW-w)*100}% ${y/(IH-h)*100}%`;
}

/* ---------- build the house ---------- */
let entradaImg;
for(const k in ROOMS){
  const r=ROOMS[k],d=document.createElement('div');
  d.className='room';d.style.left=r.c*20+'%';d.style.top=r.r*50+'%';
  const img=new Image();img.src='casa/'+r.img+'.webp';img.alt=r.name;img.decoding='async';
  d.appendChild(img);world.appendChild(d);r.el=d;
  if(k==='entrada')entradaImg=img;
  if(!CAPAS[k])for(const p of PROPS[k]||[])addProp(d,r.img,p);
  if(k==='entrada')addLayers(d,'entrada',ENTRADA_CAPAS);
  else if(CAPAS[k])addLayers(d,r.img,CAPAS[k]);
}
const garden=document.createElement('div');garden.className='room garden';garden.style.left='80%';garden.style.top='50%';world.appendChild(garden);

function addLayers(room,dir,capas){
  const groups={};
  for(const [name,l] of Object.entries(capas)){
    const im=new Image();im.src=`casa/${dir}/${name}.webp`;im.className='capa';im.alt='';im.decoding='async';
    Object.assign(im.style,{left:pct(l.x,IW),top:pct(l.y,IH),width:pct(l.w,IW),height:pct(l.h,IH)});
    room.appendChild(im);(groups[l.group]=groups[l.group]||[]).push(im);
  }
  for(const [name,l] of Object.entries(capas))for(const [hx,hy,hw,hh] of l.hits){
    const b=document.createElement('button');b.className='prop hit';b.setAttribute('aria-label',l.label||NOMBRES[l.group]||name.replace(/_/g,' '));
    Object.assign(b.style,{left:pct(hx,IW),top:pct(hy,IH),width:pct(hw,IW),height:pct(hh,IH)});
    b.addEventListener('click',e=>{e.stopPropagation();if(moving)return;
      const on=!groups[l.group][0].classList.contains('on');groups[l.group].forEach(i=>i.classList.toggle('on',on))});
    room.appendChild(b);
  }
}
function addProp(room,img,[t,x,y,w,h,o={}]){
  if(t==='lamp'){const r=w;[x,y,w,h]=[x-r,y-r,2*r,2*r]}
  const b=document.createElement('button');
  b.className='prop t-'+t;b.setAttribute('aria-label',t);
  Object.assign(b.style,{left:pct(x,IW),top:pct(y,IH),width:pct(w,IW),height:pct(h,IH)});
  const html=s=>b.insertAdjacentHTML('beforeend',s);
  const piece=(back=true)=>{html(`<div class="piece"><div class="face front"></div>${back?'<div class="face back"></div>':''}</div>`);crop(b.querySelector('.front'),img,x,y,w,h)};
  switch(t){
    case 'door':b.classList.add('h'+o.h);html(`<div class="hole in-${o.in||'wood'}"></div>`);piece();break;
    case 'drawer':html('<div class="hole in-drawer"></div>');piece(false);break;
    case 'flap':html(`<div class="hole in-${o.in||'wood'}"></div>`);piece();break;
    case 'lid':html('<div class="hole in-bowl"></div>');piece();break;
    case 'bin':html('<div class="hole in-bin"></div>');piece();break;
    case 'curtain':b.classList.add('d'+o.d);b.style.setProperty('--k',o.to/w);piece(false);break;
    case 'lamp':html('<div class="dark"></div>');break;
    case 'water':{let s='<div class="steam"></div><div class="drops">';for(let i=0;i<22;i++)s+=`<i style="left:${8+Math.random()*84}%;animation-delay:${-Math.random()*.55}s;animation-duration:${.45+Math.random()*.25}s"></i>`;html(s+'</div>');break}
    case 'tv':{html('<div class="screen"></div>');const [sx,sy,sw,sh]=o.win;crop(b.querySelector('.screen'),o.src,sx,sy,sw,sh);break}
    case 'fire':html('<div class="roar"></div>');break;
    case 'shake':piece(false);break;
    case 'toast':html('<div class="slice"></div><div class="slice"></div>');break;
    case 'tp':html('<div class="strip"></div>');break;
  }
  b.addEventListener('click',e=>{
    e.stopPropagation();if(moving)return;
    if(t==='twinkle'){burst(b,14,'twinkle');return}
    if(t==='shake'||t==='toast'){b.classList.remove('go');void b.offsetWidth;b.classList.add('go');if(t==='shake')burst(b,8,'twinkle');return}
    b.classList.toggle('open');
    if(t==='fire'&&b.classList.contains('open'))sparks(b);
  });
  room.appendChild(b);
}
function burst(b,n,cls){
  for(let i=0;i<n;i++){const s=document.createElement('i');s.className=cls;
    s.style.left=Math.random()*90+'%';s.style.top=Math.random()*90+'%';s.style.animationDelay=Math.random()*.5+'s';
    b.appendChild(s);setTimeout(()=>s.remove(),1800)}
}
function sparks(b){
  let n=0;const it=setInterval(()=>{
    if(!b.classList.contains('open')||n++>40){clearInterval(it);return}
    const s=document.createElement('i');s.className='spark';
    s.style.left=30+Math.random()*40+'%';s.style.top=45+Math.random()*30+'%';
    s.style.setProperty('--dx',(Math.random()*60-30)+'px');s.style.setProperty('--dy',(-40-Math.random()*70)+'px');
    b.appendChild(s);setTimeout(()=>s.remove(),1300)},120);
}

/* ---------- pixel arrows ---------- */
const ARROW=['....kk.....','...kwk.....','..kwwkkkkkk','.kwwwwwwwwk','kwwwwwwwwwk','.kwwwwwwwwk','..kwwkkkkkk','...kwk.....','....kk.....'];
const ROT={left:'',right:'translate(11,0) scale(-1,1)',up:'rotate(90 5.5 5.5)',down:'rotate(-90 5.5 5.5)'};
function arrowSvg(dir){let r='';ARROW.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x}" y="${y+1}" width="1" height="1" fill="${ch==='k'?'#3a1d17':'#fff3d6'}"/>`}));
  return `<svg viewBox="0 0 11 11" aria-hidden="true"><g transform="${ROT[dir]}">${r}</g></svg>`}
const arrows={};
document.querySelectorAll('.arrow').forEach(b=>{
  b.insertAdjacentHTML('afterbegin',arrowSvg(b.dataset.dir));
  arrows[b.dataset.dir]=b;b.addEventListener('click',()=>go(b.dataset.dir));
});

/* ---------- always landscape ---------- */
let rotated=false;
function fit(){
  const vw=innerWidth,vh=innerHeight;
  rotated=vh>vw;
  const W=rotated?vh:vw,H=rotated?vw:vh;
  app.style.width=W+'px';app.style.height=H+'px';
  app.style.transform=rotated?`rotate(90deg) translateY(-${vw}px)`:'none';
  const titleH=titleEl.offsetHeight+8;
  const w=Math.min(W-12,(H-titleH-14)*16/9);
  view.style.width=Math.round(w)+'px';view.style.height=Math.round(w*9/16)+'px';
  sizeSky(W,H);
}

/* ---------- navigation ---------- */
let current='entrada',moving=false;
function place(instant){
  const r=ROOMS[current];
  if(instant)world.style.transition='none';
  world.style.transform=`translate(${-r.c*20}%,${-r.r*50}%)`;
  if(instant){world.offsetWidth;world.style.transition=''}
  titleEl.textContent=r.name;
  for(const d of ['left','right','up','down']){
    const b=arrows[d],to=r[d];
    b.hidden=!to;if(!to)continue;
    b.querySelector('span').textContent=ROOMS[to].name;
    b.setAttribute('aria-label','Ir a '+ROOMS[to].name);
    if(d==='up'||d==='down'){const [x,y]=r[d+'At'];b.style.left=x+'%';b.style.top=y+'%'}
  }
}
function go(dir){
  const to=ROOMS[current][dir];if(!to||moving)return;
  current=to;moving=true;
  Object.values(arrows).forEach(b=>b.style.opacity=0);
  place();
  setTimeout(()=>{moving=false;Object.values(arrows).forEach(b=>b.style.opacity=1)},reduce?50:1000);
}
addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();go(m)}});
let sx=0,sy=0;
view.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
view.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(rotated)[dx,dy]=[dy,-dx];          // screen gesture -> rotated-app gesture
  if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;
  if(Math.abs(dx)>Math.abs(dy))go(dx<0?'right':'left');else go(dy<0?'down':'up')});

/* ---------- intro: tap to enter (also asks the phone for fullscreen + landscape) ---------- */
$('#enter').addEventListener('click',async()=>{
  try{
    const el=document.documentElement;
    if(el.requestFullscreen&&!document.fullscreenElement)await el.requestFullscreen({navigationUI:'hide'});
    if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');
  }catch(e){/* not supported (e.g. iPhone): the CSS rotation keeps it horizontal */}
  $('#intro').classList.add('out');
  setTimeout(()=>{toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),5000)},900);
});

/* ---------- night sky with snow ---------- */
const sky=$('#sky'),sg=sky.getContext('2d');let SW,SH,fl=[];
function sizeSky(W,H){SW=Math.ceil(W/4);SH=Math.ceil(H/4);if(sky.width===SW&&sky.height===SH)return;sky.width=SW;sky.height=SH;
  fl=Array.from({length:Math.round(SW*SH/90)},()=>({x:Math.random()*SW,y:Math.random()*SH,v:.1+Math.random()*.25}))}
(function tick(){sg.fillStyle='#080d24';sg.fillRect(0,0,SW,SH);
  for(const f of fl){if(!reduce){f.y+=f.v;if(f.y>SH){f.y=0;f.x=Math.random()*SW}}sg.fillStyle=f.v>.28?'#ffffff':'#56608a';sg.fillRect(f.x|0,f.y|0,1,1)}
  requestAnimationFrame(tick)})();

addEventListener('resize',()=>{fit()});
addEventListener('orientationchange',()=>setTimeout(fit,250));
fit();place(true);
if(document.fonts)document.fonts.ready.then(fit);
</script>
