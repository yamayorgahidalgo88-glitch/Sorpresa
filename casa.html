<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestra Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--night:#080d24;--ink:#fff3d6;--neon:#5d8cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:"Press Start 2P",monospace}
body{display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:0}
#stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
#title{font-size:clamp(10px,2.2vw,16px);letter-spacing:1px;text-shadow:2px 2px 0 #7a1a1f;min-height:1.6em;text-align:center;padding:0 16px}
#view{position:relative;overflow:hidden;border-radius:2px;
  box-shadow:0 0 0 2px #2d5bff,0 0 24px rgba(93,140,255,.55),0 0 60px rgba(93,140,255,.25)}
#world{position:absolute;left:0;top:0;width:500%;height:200%;transition:transform 1s cubic-bezier(.65,0,.35,1);will-change:transform}
#world canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.arrow{position:absolute;z-index:3;border:0;background:none;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  -webkit-tap-highlight-color:transparent;outline:none;transition:opacity .3s}
.arrow svg{width:clamp(30px,5vw,56px);height:auto;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.arrow span{font:inherit;font-size:clamp(7px,1.25vw,11px);color:var(--ink);background:rgba(8,13,36,.75);padding:4px 5px;border:1px solid rgba(255,243,214,.35);white-space:nowrap}
.arrow.left{left:1.5%;top:50%;translate:0 -50%;flex-direction:row}
.arrow.right{right:1.5%;top:50%;translate:0 -50%;flex-direction:row-reverse}
.arrow.left svg{animation:bobL 1.2s steps(2) infinite}
.arrow.right svg{animation:bobR 1.2s steps(2) infinite}
.arrow.up svg{animation:bobU 1.2s steps(2) infinite}
.arrow.down svg{animation:bobD 1.2s steps(2) infinite}
.arrow.up,.arrow.down{translate:-50% -50%}
.arrow.down{flex-direction:column-reverse}
@keyframes bobL{50%{transform:translateX(-3px)}}
@keyframes bobR{50%{transform:translateX(3px)}}
@keyframes bobU{50%{transform:translateY(-3px)}}
@keyframes bobD{50%{transform:translateY(3px)}}
.arrow:hover svg,.arrow:focus-visible svg{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.arrow[hidden]{display:none}
#hint{font-size:8px;opacity:.6;text-align:center;padding:0 16px;line-height:1.8}
#fade{position:fixed;inset:0;z-index:10;background:var(--night);display:grid;place-items:center;transition:opacity 1.2s}
#fade.out{opacity:0;pointer-events:none}
#fade p{font-size:12px;letter-spacing:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){#world{transition:none}.arrow svg{animation:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="stage">
  <div id="title" aria-live="polite"></div>
  <div id="view">
    <div id="world"><canvas id="bg"></canvas><canvas id="fx"></canvas></div>
    <button class="arrow left" data-dir="left"><span></span></button>
    <button class="arrow right" data-dir="right"><span></span></button>
    <button class="arrow up" data-dir="up"><span></span></button>
    <button class="arrow down" data-dir="down"><span></span></button>
  </div>
  <div id="hint"></div>
</div>
<div id="fade"><p>Entrando...</p></div>

<script>
/* =========================================================
   Pixel-art house. Each room is 256x144 "pixels".
   World grid: 5 columns x 2 floors (row 0 = upstairs).
   ========================================================= */
const RW=256,RH=144,COLS=5,ROWS=2,FL=112;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(1225);

const ROOMS={
  dormitorio:{c:0,r:0,name:'Dormitorio',right:'bano2',draw:drawDormitorio},
  bano2:     {c:1,r:0,name:'Baño del dormitorio',left:'dormitorio',right:'salita',draw:drawBano2},
  salita:    {c:2,r:0,name:'Salita',left:'bano2',right:'bano3',down:'entrada',downAt:[44,122],draw:drawSalita},
  bano3:     {c:3,r:0,name:'Baño',left:'salita',right:'ninos',draw:drawBano3},
  ninos:     {c:4,r:0,name:'Habitación de los niños',left:'bano3',draw:drawNinos},
  cocina:    {c:0,r:1,name:'Cocina',right:'aseo',draw:drawCocina},
  aseo:      {c:1,r:1,name:'Aseo',left:'cocina',right:'entrada',draw:drawAseo},
  entrada:   {c:2,r:1,name:'Entrada',left:'aseo',right:'salon',up:'salita',upAt:[40,34],draw:drawEntrada},
  salon:     {c:3,r:1,name:'Salón',left:'entrada',draw:drawSalon}
};

/* ---------- drawing toolkit ---------- */
const bgC=document.getElementById('bg'),fxC=document.getElementById('fx');
bgC.width=fxC.width=RW*COLS;bgC.height=fxC.height=RH*ROWS;
const ctx=bgC.getContext('2d'),fx=fxC.getContext('2d');
let OX=0,OY=0;
const FX={lights:[],flames:[],fires:[],windows:[],glows:[]};

function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(OX+x,OY+y,w,h)}
function P(x,y,c){ctx.fillStyle=c;ctx.fillRect(OX+x,OY+y,1,1)}
function box(x,y,w,h,fill,line){R(x,y,w,h,line);R(x+1,y+1,w-2,h-2,fill)}
function spr(x,y,rows,pal){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=pal[r[i]];if(c)P(x+i,y+j,c)}})}
function ell(cx,cy,rx,ry,c){ctx.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));ctx.fillRect(OX+cx-w,OY+cy+y,w*2+1,1)}}
function disc(cx,cy,r){for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));ctx.fillRect(OX+cx-w,OY+cy+y,w*2+1,1)}}
function glow(cx,cy,r,col,a=.07){ctx.fillStyle=col;ctx.globalAlpha=a;for(let k=r;k>1;k-=Math.max(2,r/6|0))disc(cx,cy,k|0);ctx.globalAlpha=1}
function line(x0,y0,x1,y1,c){const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let e=dx+dy;for(;;){P(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function light(x,y,c){FX.lights.push({x:OX+x,y:OY+y,c,p:rnd()*6})}
function flame(x,y){FX.flames.push({x:OX+x,y:OY+y,p:rnd()*6})}

const C={
  out:'#2a1a14',
  w0:'#4a2e1a',w1:'#6e4526',w2:'#8a5a32',w3:'#a8743f',w4:'#c08a4e',
  r0:'#6e1219',r1:'#9e1d25',r2:'#c8302f',r3:'#e5544a',
  g0:'#163d24',g1:'#24613a',g2:'#3a8a48',g3:'#62b45a',
  au:'#c8902a',au2:'#f2c84a',
  wh:'#f4f6fa',wh2:'#d4d9e3',wh3:'#9aa2b3',
  cr:'#efe2c4',
  steel:'#b9bfc9',steel2:'#8e95a3'
};
const LIGHTCOLS=['#ff4a4a','#ffd24a','#4ab0ff','#5cff7a','#ff9a3a'];

/* ---------- reusable furniture & decor ---------- */
function frameNeon(){
  // glowing blue structure like the reference
  R(0,0,RW,4,'#16236b');R(0,1,RW,2,'#3d6bff');R(0,1,RW,1,'#9fc0ff');
  R(0,138,RW,6,'#16236b');R(0,139,RW,3,'#3d6bff');R(0,140,RW,1,'#9fc0ff');
  for(const x of [0,RW-4]){R(x,0,4,RH,'#16236b');R(x+1,0,2,RH,'#3d6bff');R(x+1,0,1,RH,'#9fc0ff')}
  for(let y=8;y<RH;y+=12){P(1,y,'#16236b');P(RW-3,y,'#16236b')}
}
function base(wallFn,floorType='wood',floorTone){
  // wall
  for(let y=4;y<106;y++)for(let x=4;x<RW-4;x++)P(x,y,wallFn(x,y));
  // ceiling shadow
  ctx.globalAlpha=.25;R(4,4,RW-8,4,'#000');ctx.globalAlpha=.12;R(4,8,RW-8,3,'#000');ctx.globalAlpha=1;
  // baseboard
  R(4,104,RW-8,1,'#e9dfcc');R(4,105,RW-8,3,'#cbbfa8');R(4,108,RW-8,1,'#8f8270');
  // floor
  if(floorType==='wood'){
    const t=floorTone||[C.w1,C.w2,C.w3];
    for(let row=0;row<8;row++){
      const y=109+row*4-(row>0?0:0);
      const h=row===7?2:4;
      R(4,y,RW-8,h,row%2?t[1]:t[2]);R(4,y+h-1,RW-8,1,t[0]);
      let x=4+((rnd()*30)|0);while(x<RW-4){R(x,y,1,h-1,t[0]);x+=24+((rnd()*18)|0)}
      for(let k=0;k<12;k++)P(4+((rnd()*(RW-8))|0),y+1+((rnd()*2)|0),row%2?t[2]:t[1]);
    }
  }else{
    const [a,b,l]=floorTone||['#d9dce4','#b9bdc9','#9aa0ae'];
    for(let y=109;y<138;y++)for(let x=4;x<RW-4;x++){const cx=((x-4)/10|0),cy=((y-109)/5|0);P(x,y,((cx+cy)&1)?a:b)}
    for(let y=109;y<138;y+=5)R(4,y,RW-8,1,l);
  }
  ctx.globalAlpha=.18;R(4,109,RW-8,3,'#000');ctx.globalAlpha=1;
}
function garland(y=8,step=42){
  const G=[C.g0,C.g1,C.g2,C.g3];
  for(let x=5;x<RW-5;x++){
    const ph=((x-5)%step)/step,sag=Math.round(Math.sin(ph*Math.PI)*5);
    for(let k=0;k<4;k++){const c=G[(rnd()*4)|0];P(x,y+sag+k-1,c)}
    if(rnd()<.3)P(x,y+sag-2,C.g1);if(rnd()<.3)P(x,y+sag+3,C.g0);
    if((x-5)%6===3)light(x,y+sag+(x%12<6?2:-1),LIGHTCOLS[((x/6)|0)%LIGHTCOLS.length]);
  }
  for(let x=5;x<RW-5;x+=step)bow(x-3,y-1);
  bow(RW-9,y-1);
}
const BOW=['RR...RR','RrRdRrR','.rrdrr.','..rdr..','.rr.rr.','.r...r.'];
function bow(x,y){spr(x,y,BOW,{R:C.r3,r:C.r2,d:C.r0})}
function pendant(x,len=14,col=C.au){
  R(x,4,1,len,'#2a2018');
  const y=4+len;
  R(x-2,y,5,1,'#6b4a1a');R(x-3,y+1,7,1,col);R(x-4,y+2,9,1,col);R(x-5,y+3,11,2,col);R(x-5,y+3,3,2,C.au2);
  R(x-5,y+5,11,1,'#6b4a1a');R(x-1,y+6,3,1,'#fff3b0');
  glow(x,y+10,30,'#ffd27a',.05);
}
function wreath(cx,cy,r=7){
  for(let y=-r-2;y<=r+2;y++)for(let x=-r-2;x<=r+2;x++){
    const d=Math.hypot(x,y);if(d<=r+1.6&&d>=r-2.6){const q=rnd();P(cx+x,cy+y,q<.3?C.g3:q<.65?C.g2:q<.9?C.g1:C.g0)}
  }
  for(let k=0;k<9;k++){const a=rnd()*Math.PI*2;P(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),C.r2)}
  for(let k=0;k<8;k++){const a=k/8*Math.PI*2+.3;light(cx+Math.round(Math.cos(a)*(r-1)),cy+Math.round(Math.sin(a)*(r-1)),'#ffd24a')}
  bow(cx-3,cy+r-1);
}
function picture(x,y,w,h){
  box(x,y,w,h,C.au,C.w0);R(x+2,y+2,w-4,h-4,C.w1);
  const ix=x+3,iy=y+3,iw=w-6,ih=h-6;
  for(let j=0;j<ih;j++)R(ix,iy+j,iw,1,j<ih*.4?'#1a2550':j<ih*.65?'#2c3f78':'#e8eef8');
  R(ix,iy+Math.round(ih*.62),iw,1,'#c3cfe6');
  const tx=ix+Math.round(iw*.35),ty=iy+Math.round(ih*.65);
  for(let k=0;k<Math.min(7,ih*.45|0);k++)R(tx-(k>>1),ty-k,(k>>1)*2+1,1,C.g1);
  const tx2=ix+Math.round(iw*.7);for(let k=0;k<Math.min(5,ih*.35|0);k++)R(tx2-(k>>1),ty-k,(k>>1)*2+1,1,C.g0);
  P(ix+iw-3,iy+2,'#fff4cf');
  for(let k=0;k<iw*ih/14;k++)P(ix+((rnd()*iw)|0),iy+((rnd()*ih*.6)|0),'#ffffff');
}
function windowNight(x,y,w,h,curtain){
  box(x-2,y-2,w+4,h+4,'#e9e2d0','#8f8270');
  for(let j=0;j<h;j++)R(x,y+j,w,1,j<h*.35?'#0f1838':j<h*.7?'#1a2a58':'#2c4078');
  // snowy hills + trees outside
  for(let i=0;i<w;i++){const t=Math.round(h*.78+Math.sin(i*.18+x)*2);R(x+i,y+t,1,h-t,'#dfe8f7')}
  for(let k=0;k<3;k++){const tx=x+4+((rnd()*(w-8))|0),ty=y+Math.round(h*.78);for(let q=0;q<7;q++)R(tx-(q>>1),ty-q,(q>>1)*2+1,1,'#183a30')}
  for(let k=0;k<w*h/30;k++)P(x+((rnd()*w)|0),y+((rnd()*h*.6)|0),'#c9d6ff');
  R(x,y+h-2,w,2,'#ffffff');
  R(x+(w>>1),y,1,h,'#e9e2d0');R(x,y+(h>>1),w,1,'#e9e2d0');
  R(x-3,y+h+2,w+6,2,'#cbbfa8');
  FX.windows.push({x:OX+x,y:OY+y,w,h:h-2,f:Array.from({length:Math.round(w*h/40)},()=>({x:rnd()*w,y:rnd()*h,v:.08+rnd()*.12}))});
  if(curtain){
    const [a,b]=curtain;
    for(const side of [0,1]){
      const cx=side?x+w-3:x-6;
      for(let j=-4;j<h+8;j++){const ww=9-Math.round(Math.max(0,j-h*.4)/h*6);for(let i=0;i<ww;i++){const px=side?cx+9-ww+i:cx+i;P(px,y+j,((i+(side?1:0))%3===0)?b:a)}}
    }
    R(x-8,y-5,w+16,2,C.w0);
  }
}
function plant(x,yb,big){
  const s=big?1.4:1;
  R(x-3,yb-7,7,7,'#a0522d');R(x-4,yb-8,9,2,'#c0663a');R(x-2,yb-6,1,5,'#c0663a');
  const n=big?14:9;
  for(let k=0;k<n;k++){const a=-Math.PI/2+(rnd()-.5)*2.4,l=(5+rnd()*6)*s;for(let t=0;t<l;t++)P(x+Math.round(Math.cos(a)*t),yb-9+Math.round(Math.sin(a)*t),t>l-3?C.g3:C.g2)}
}
function poinsettia(x,yb){
  R(x-3,yb-6,7,6,C.au);R(x-3,yb-6,7,1,C.au2);
  const L=['..r.r..','.rRrRr.','rRrgrRr','.rgYgr.','rRrgrRr','.rRrRr.','..r.r..'];
  spr(x-3,yb-13,L,{r:C.r2,R:C.r3,g:C.g2,Y:'#ffd24a'});
}
function candle(x,yb,h=6,c=C.wh){R(x,yb-h,2,h,c);P(x,yb-h,'#ffffff');P(x+1,yb-h-1,'#3a2a1a');flame(x,yb-h-2);glow(x+1,yb-h-2,10,'#ffcf6a',.06)}
function rug(x,y,w,h,a,b,c){
  R(x+1,y,w-2,h,a);R(x,y+1,w,h-2,a);
  R(x+2,y+1,w-4,1,b);R(x+2,y+h-2,w-4,1,b);R(x+1,y+2,1,h-4,b);R(x+w-2,y+2,1,h-4,b);
  for(let i=x+5;i<x+w-5;i+=6){P(i,y+(h>>1),c||b);P(i+3,y+(h>>1)-1,c||b);P(i+3,y+(h>>1)+1,c||b)}
  for(let i=x;i<x+w;i+=2){P(i,y-1,b);P(i,y+h,b)}
}
const BOOKC=['#8e1b22','#2e5a8a','#2e7a3e','#c8902a','#6a3d7a','#d9cfb4','#a0522d','#1f3d5c','#b8262e'];
function bookshelf(x,y,w,h){
  box(x,y,w,h,C.w0,C.out);R(x+1,y+1,w-2,2,C.w2);R(x+1,y+1,1,h-2,C.w2);R(x+w-2,y+1,1,h-2,C.w1);
  R(x+2,y+3,w-4,h-5,'#3a2414');
  for(let sy=y+3;sy<y+h-6;sy+=14){
    let bx=x+2;
    while(bx<x+w-4){const bw=2+((rnd()*3)|0),bh=8+((rnd()*4)|0),c=BOOKC[(rnd()*BOOKC.length)|0];
      if(bx+bw>x+w-2)break;
      if(rnd()<.08){bx+=3;continue}
      R(bx,sy+12-bh,bw,bh,c);P(bx,sy+12-bh+2,'#f2e2b0');if(bw>2)R(bx+1,sy+12-bh+4,1,2,'#f2e2b0');
      bx+=bw;}
    R(x+1,sy+12,w-2,2,C.w2);R(x+1,sy+13,w-2,1,C.w0);
  }
}
function lampTable(x,yb){
  R(x-1,yb-8,3,8,C.au);R(x-3,yb-1,7,1,C.au);
  R(x-4,yb-14,9,6,'#f6e2a8');R(x-3,yb-15,7,1,'#f6e2a8');R(x-4,yb-9,9,1,'#d9b86a');
  glow(x,yb-12,22,'#ffd27a',.07);
}
function nightstand(x,yb,w=20,h=20){
  box(x,yb-h,w,h,C.w2,C.out);R(x+1,yb-h+1,w-2,2,C.w3);
  R(x+2,yb-h+5,w-4,1,C.w0);R(x+2,yb-h+11,w-4,1,C.w0);P(x+(w>>1),yb-h+8,C.au2);P(x+(w>>1),yb-h+14,C.au2);
}
function toilet(x,yb){
  const W=C.wh,S=C.wh2,L='#7d8597';
  box(x+3,yb-40,18,15,W,L);R(x+4,yb-39,16,2,'#ffffff');R(x+17,yb-38,2,11,S);P(x+16,yb-35,C.steel2);R(x+15,yb-35,3,1,C.steel2);
  R(x+2,yb-41,20,2,L);R(x+3,yb-41,18,1,W);
  box(x,yb-25,24,5,W,L);R(x+1,yb-24,22,1,'#ffffff');
  ell(x+12,yb-15,10,6,L);ell(x+12,yb-15,9,5,W);R(x+16,yb-20,4,8,S);
  box(x+6,yb-10,12,10,W,L);R(x+14,yb-9,3,8,S);
}
function vanity(x,yb,w,cab='#3c4256',top=C.wh){
  box(x,yb-24,w,24,cab,'#1f2230');R(x+(w>>1),yb-23,1,22,'#1f2230');
  P(x+(w>>1)-2,yb-14,C.au2);P(x+(w>>1)+2,yb-14,C.au2);
  R(x-2,yb-28,w+4,4,top);R(x-2,yb-25,w+4,1,C.wh3);
  ell(x+(w>>1),yb-28,(w>>1)-4,1,'#c5ccd8');
  R(x+(w>>1)-1,yb-34,2,6,C.steel);R(x+(w>>1)-1,yb-34,5,2,C.steel);P(x+(w>>1)-2,yb-33,C.steel2);
}
function mirrorOval(cx,cy,rx,ry){
  ell(cx,cy,rx+2,ry+2,C.w0);ell(cx,cy,rx+1,ry+1,C.au);ell(cx,cy,rx,ry,'#a9c6da');ell(cx-1,cy,rx-2,ry-2,'#bcd6e6');
  for(let k=0;k<ry;k++){P(cx-rx+4+(k>>1),cy-ry+3+k,'#e6f2fa')}

/* ---------- animated layer ---------- */
function drawFx(t){
  fx.clearRect(0,0,fxC.width,fxC.height);
  for(const l of FX.lights){
    const on=Math.sin(t/500+l.p)>-.3;
    fx.fillStyle=l.c;fx.globalAlpha=on?1:.35;fx.fillRect(l.x,l.y,1,1);
    if(on){fx.globalAlpha=.25;fx.fillRect(l.x-1,l.y,3,1);fx.fillRect(l.x,l.y-1,1,3)}
  }
  fx.globalAlpha=1;
  for(const f of FX.flames){
    const h=Math.sin(t/90+f.p)>0?1:0;
    fx.fillStyle='#ffb02e';fx.fillRect(f.x,f.y-h,2,2+h);fx.fillStyle='#fff3a0';fx.fillRect(f.x,f.y+1,1,1);
  }
  for(const F of FX.fires){
    for(let i=0;i<F.w;i++){
      const n=Math.sin(i*.9+t/110)*.5+Math.sin(i*.37-t/170)*.5;
      const h=Math.max(3,Math.round(F.h*(.45+.35*n)*(1-Math.abs(i-F.w/2)/(F.w*.7))));
      for(let j=0;j<h;j++){const q=j/h;fx.fillStyle=q<.25?'#fff3a0':q<.5?'#ffc23a':q<.8?'#ff7a1f':'#c8321a';fx.fillRect(F.x+i,F.y+F.h-j,1,1)}
    }
    fx.globalAlpha=.06+.03*Math.sin(t/140);fx.fillStyle='#ff9a3a';fx.fillRect(F.x-20,F.y-14,F.w+40,F.h+30);fx.globalAlpha=1;
  }
  fx.fillStyle='#ffffff';
  for(const W of FX.windows){
    for(const f of W.f){if(!reduce){f.y+=f.v;f.x+=Math.sin(t/900+f.y)*.05;if(f.y>=W.h){f.y=0;f.x=Math.random()*W.w}}
      const x=Math.round(f.x),y=Math.round(f.y);if(x>=0&&x<W.w&&((x!==W.w>>1)&&(y!==W.h+2>>1)))fx.fillRect(W.x+x,W.y+y,1,1)}
  }
}

/* ---------- viewport & navigation ---------- */
const view=document.getElementById('view'),world=document.getElementById('world');
const titleEl=document.getElementById('title'),hint=document.getElementById('hint');
const ARROW=['....kk.....','...kwk.....','..kwwkkkkkk','.kwwwwwwwwk','kwwwwwwwwwk','.kwwwwwwwwk','..kwwkkkkkk','...kwk.....','....kk.....'];
const ROT={left:'',right:'translate(11,0) scale(-1,1)',up:'rotate(90 5.5 5.5)',down:'rotate(-90 5.5 5.5)'};
function arrowSvg(dir){let r='';ARROW.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x}" y="${y+1}" width="1" height="1" fill="${ch==='k'?'#3a1d17':'#fff3d6'}"/>`}));
  return `<svg viewBox="0 0 11 11"><g transform="${ROT[dir]}">${r}</g></svg>`}
document.querySelectorAll('.arrow').forEach(b=>b.insertAdjacentHTML('afterbegin',arrowSvg(b.dataset.dir)));
const arrows={};document.querySelectorAll('.arrow').forEach(b=>{arrows[b.dataset.dir]=b;b.addEventListener('click',()=>go(b.dataset.dir))});
let current='entrada',moving=false;

function fit(){
  const titleH=titleEl.offsetHeight+10,hintH=hint.offsetHeight+10;
  const availW=innerWidth-16,availH=innerHeight-titleH-hintH-16;
  let w=Math.min(availW,availH*RW/RH);
  // prefer whole-pixel scaling when there's room for it
  const s=Math.floor(w/RW);if(s>=2&&s*RW>=w*.85)w=s*RW;
  view.style.width=Math.round(w)+'px';view.style.height=Math.round(w*RH/RW)+'px';
  hint.textContent=innerHeight>innerWidth?'Gira el móvil para ver la casa más grande':'';
}
function place(instant){
  const r=ROOMS[current];
  if(instant){world.style.transition='none'}
  world.style.transform=`translate(${-r.c*20}%,${-r.r*50}%)`;
  if(instant){world.offsetWidth;world.style.transition=''}
  titleEl.textContent=r.name;
  for(const d of ['left','right','up','down']){
    const b=arrows[d],to=r[d];
    b.hidden=!to;
    if(to){
      b.querySelector('span').textContent=ROOMS[to].name;
      b.setAttribute('aria-label','Ir a '+ROOMS[to].name);
      if(d==='up'||d==='down'){const [x,y]=r[d+'At'];b.style.left=(x/RW*100)+'%';b.style.top=(y/RH*100)+'%'}
    }
  }
}
function go(dir){
  const to=ROOMS[current][dir];if(!to||moving)return;
  current=to;moving=true;
  Object.values(arrows).forEach(b=>b.style.opacity=0);
  place();
  setTimeout(()=>{moving=false;Object.values(arrows).forEach(b=>b.style.opacity=1)},reduce?50:1000);
}
addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();go(m)}});
let sx=0,sy=0;
view.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
view.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;
  if(Math.abs(dx)>Math.abs(dy))go(dx<0?'right':'left');else go(dy<0?'down':'up')});
addEventListener('resize',fit);
fit();place(true);
if(document.fonts)document.fonts.ready.then(fit);
setTimeout(()=>document.getElementById('fade').classList.add('out'),600);

/* ---------- night sky with snow around the house ---------- */
(function(){
  const c=document.getElementById('sky'),g=c.getContext('2d');let W,H,fl=[];
  function size(){W=Math.ceil(innerWidth/4);H=Math.ceil(innerHeight/4);c.width=W;c.height=H;
    g.fillStyle='#080d24';g.fillRect(0,0,W,H);
    fl=Array.from({length:Math.round(W*H/90)},()=>({x:Math.random()*W,y:Math.random()*H,v:.1+Math.random()*.25}))}
  size();addEventListener('resize',size);
  (function tick(){g.fillStyle='#080d24';g.fillRect(0,0,W,H);
    for(const f of fl){if(!reduce){f.y+=f.v;if(f.y>H){f.y=0;f.x=Math.random()*W}}g.fillStyle=f.v>.28?'#ffffff':'#56608a';g.fillRect(f.x|0,f.y|0,1,1)}
    requestAnimationFrame(tick)})();
})();
