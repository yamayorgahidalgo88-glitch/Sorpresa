<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset=".55" stop-color="#FFB800"/>
      <stop offset="1" stop-color="#E07B00"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5652B"/>
      <stop offset="1" stop-color="#6E3412"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A0"/>
      <stop offset="1" stop-color="#D99100"/>
    </linearGradient>
  </defs>
  <!-- moneda -->
  <circle cx="100" cy="112" r="74" fill="#7A3B00"/>
  <circle cx="100" cy="106" r="74" fill="url(#coin)"/>
  <circle cx="100" cy="106" r="60" fill="none" stroke="#FFF3C4" stroke-width="5" stroke-dasharray="6 7" opacity=".8"/>
  <!-- ondas de golpe -->
  <g stroke="#FF3D6E" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M38 150 l-16 10"/>
    <path d="M52 166 l-6 18"/>
    <path d="M30 128 l-20 0"/>
  </g>
  <!-- martillo -->
  <g transform="rotate(-38 100 100)">
    <rect x="94" y="78" width="16" height="104" rx="7" fill="url(#wood)" stroke="#3B1A06" stroke-width="5"/>
    <rect x="52" y="34" width="100" height="44" rx="14" fill="url(#wood)" stroke="#3B1A06" stroke-width="5"/>
    <rect x="62" y="34" width="12" height="44" fill="url(#band)" stroke="#3B1A06" stroke-width="3"/>
    <rect x="130" y="34" width="12" height="44" fill="url(#band)" stroke="#3B1A06" stroke-width="3"/>
    <rect x="60" y="40" width="84" height="8" rx="4" fill="#fff" opacity=".25"/>
  </g>
  <!-- brillos -->
  <path d="M164 30 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#FFF"/>
  <path d="M30 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#FFF" opacity=".9"/>
</svg>
